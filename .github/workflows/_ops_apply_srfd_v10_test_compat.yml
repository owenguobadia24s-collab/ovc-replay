name: OVC apply SRFD v1.0 pointer compatibility
on:
  push:
    branches:
      - run/srfdi-wp10-v10-start
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: run/srfdi-wp10-v10-start
          fetch-depth: 0
      - name: Apply exact compatibility patch
        run: |
          base64 -d .ops/srfd_v10_test_compat.patch.gz.b64 | gzip -d > /tmp/srfd.patch
          git apply --check /tmp/srfd.patch
          git apply /tmp/srfd.patch
          rm -f .ops/srfd_v10_test_compat.patch.gz.b64 .github/workflows/_ops_apply_srfd_v10_test_compat.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'tests(srfd): preserve history across v1.0 pointer progression'
          git push origin HEAD:run/srfdi-wp10-v10-start
