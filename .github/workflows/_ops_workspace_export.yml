name: OVC ops workspace export
on:
  push:
    branches:
      - ops/srfd-v10-workspace-export
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact checkout
        run: |
          tar --exclude=.git -czf ovc-replay-current.tar.gz .
          sha256sum ovc-replay-current.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ovc-replay-current-workspace
          path: |
            ovc-replay-current.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1
