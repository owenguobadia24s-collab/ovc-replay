name: TEMP SRFDI v1.0 dispatch blocker pointer

on:
  push:
    branches:
      - block/srfdi-wp10-v10-dispatch-output-contract-20260810
    paths:
      - '.github/workflows/_temp_srfdi_v10_failure_pointer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: block/srfdi-wp10-v10-dispatch-output-contract-20260810
      - name: Preserve historical fields and advance only current v1.0 disposition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('registries/implementation/srfd/CURRENT_STATE_POINTER.json')
          d=json.loads(p.read_text())
          d.update({
            'authoritative_state':'registries/implementation/srfd/OVC_SRFDI_STATE_v0_47_WP10_V10_DISPATCH_BLOCKED.json',
            'status':'BLOCKED',
            'current_gate':'SRFDI-G10',
            'failure_reason':'WORK_UNIT_DISPATCH_OUTPUT_CONTRACT_CORRUPTION',
            'failure_receipt':'docs/releases/srfd-benchmark-v0-1/srfdi-wp10-v1-0/SRFDI_WP10_V10_EXECUTION_OUTPUT_CONTRACT_FAILURE.json',
            'june_execution':'BLOCKED_V10_DISPATCH_OUTPUT_CONTRACT_FAILURE_PRESERVED',
            'next_packet':'SRFDI-WP10-v1.1-REAL-EXECUTION-ROUTE',
            'next_action':'IMPLEMENT_MEMORY_SAFE_EXACT_V11_REAL_RUNNER_AND_PROVE_EQUIVALENCE_BEFORE_TOKEN_MINT',
            'operator_decision_required':False,
            'reason':'V10_DISPATCH_OUTPUT_CONTRACT_FAILURE_RECORDED_AFTER_V11_HARDENING_STEPS_1_TO_5_PASS',
            'wp10_v1_0_execution_route':'BLOCKED_DISPATCH_OUTPUT_CONTRACT_FAILURE_PRESERVED',
            'wp10_v1_1_execution_route':'IMPLEMENTATION_ONLY_NO_RUN_AUTHORITY',
            'v10_last_unambiguously_bound_runner_sequence':282,
            'v10_correct_preparation_sequence':284,
            'v10_first_invalid_sequence':285,
            'v10_last_invalid_sequence':338,
            'v10_invalid_configuration_unit_count':54,
            'hardening_steps_1_to_5':'PASS_MERGED_AT_7e6628fd04b0d21bf0ba5f7062fd2f2e918cec10',
          })
          d.pop('run_completed_unit_count',None)
          d.pop('run_remaining_unit_count',None)
          d.pop('run_checkpoint_id',None)
          p.write_text(json.dumps(d,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - name: Commit pointer update
        run: |
          git config user.name 'ovc-remediation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add registries/implementation/srfd/CURRENT_STATE_POINTER.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Advance SRFDI pointer to preserved v1.0 dispatch blocker'
          git push origin HEAD:block/srfdi-wp10-v10-dispatch-output-contract-20260810
