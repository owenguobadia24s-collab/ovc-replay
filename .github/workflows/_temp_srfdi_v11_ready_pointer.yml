            'failure_reason':None,
            'wp10_v1_0_execution_route':'BLOCKED_DISPATCH_OUTPUT_CONTRACT_FAILURE_PRESERVED',
            'wp10_v1_1_execution_route':'AUTHORIZED_UNCONSUMED_PENDING_EXACT_PREFLIGHT',
            'provider_fetch':'DENIED','validation_2025':'LOCKED_UNCONSUMED',
            'scientific_promotion':'NONE','selector_family_semantic_publication':'NONE','probability_risk_exposure_execution':'NONE',
