name: A2-G1 Diagnostics
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture full suite output
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python3 -m unittest discover -s tests -v > "$RUNNER_TEMP/a2-g1-tests.log" 2>&1
          echo $? > "$RUNNER_TEMP/a2-g1-status.txt"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: a2-g1-diagnostics
          path: |
            ${{ runner.temp }}/a2-g1-tests.log
            ${{ runner.temp }}/a2-g1-status.txt
          retention-days: 1
