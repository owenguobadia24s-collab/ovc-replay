name: C1C-G5 corrective pilot review DEFER

on:
  pull_request:
    branches: [main]
    paths:
      - docs/releases/opt-b-c1-v2/corrective/c1c-g5/operator-gate/**
      - registries/research_operations/pattern_discovery/PD_C1C_G5_PILOT_CORRECTIVE_STATE_v0_1.json
      - tests/research_operations/pattern_discovery/test_c1c_g5_corrective_pilot_review_defer.py
      - .github/workflows/c1c-g5-corrective-pilot-review-defer.yml

permissions:
  contents: read

jobs:
  operator-defer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify operator DEFER and CORR2 boundary
        env:
          PYTHONPATH: src
        run: python -m unittest tests.research_operations.pattern_discovery.test_c1c_g5_corrective_pilot_review_defer -v
      - name: Run complete repository suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Enforce retained authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/releases/opt-b-c1-v2/corrective/c1c-g5/operator-gate')
          decision=json.loads((root/'C1C_G5_CORRECTIVE_PILOT_REVIEW_OPERATOR_DECISION.json').read_text())
          state=json.loads(Path('registries/research_operations/pattern_discovery/PD_C1C_G5_PILOT_CORRECTIVE_STATE_v0_1.json').read_text())
          assert decision['decision']=='DEFER'
          assert decision['authorised_next_packet']['packet_id']=='C1C-G5-CORR2'
          assert decision['authorised_next_packet']['machine_replay']=='DENIED_NOT_REQUIRED'
          assert state['corr2']['status']=='READY'
          assert state['next_gate']=='C1C-G5-CORRECTIVE-PILOT-REVIEW'
          retained=decision['retained_prohibitions']
          assert retained['canonical_append']=='DENIED'
          assert retained['validation_consumption']=='LOCKED_UNCONSUMED'
          for key in ('semantic_promotion','family_promotion','candidate_promotion','novelty_promotion','threshold_or_model_change','probability','risk','exposure','trading','execution','agent_write'):
              assert retained[key]=='NONE'
          PY
