name: C2-G7 prospective evidence operation acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run canonical repository tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Enforce C2-G7 acceptance boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(Path('docs/releases/opt-b-c2-v2/c2-g7/C2_G7_GATE_PACKET.json').read_text())
          assert gate['decision'] == 'PASS_PROSPECTIVE_EVIDENCE_OPERATION_ACCEPTED'
          assert gate['prerequisites']['zero_baseline'] is True
          assert gate['prerequisites']['historical_backfill'] is False
          assert gate['retained']['validation_consumption'] == 'LOCKED_UNCONSUMED'
          assert gate['retained']['trading_authority'] == 'NONE'
          assert gate['retained']['execution_authority'] == 'NONE'
          assert gate['blocking_issues'] == 0
          PY
