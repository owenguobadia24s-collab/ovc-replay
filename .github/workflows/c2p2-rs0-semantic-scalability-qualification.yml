name: C2P2 RS0 R4 capacity recovery qualification

on:
  push:
    branches:
      - recover/c2p2-rs0-run-recovery-r4-20260818

permissions:
  contents: write

concurrency:
  group: c2p2-rs0-r4-capacity-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Bounded synthetic R4 capacity recovery qualification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository test dependencies
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt

      - name: Verify exact operator-approved bounded recovery authority and consumed R4
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src:. python3 - <<'PY'
          import json
          from pathlib import Path

          release = Path('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0')
          decision = json.loads((release / 'C2P2_RS0_RUN_RECOVERY_R4_OPERATOR_DECISION_v0_1.json').read_text())
          diagnosis = json.loads((release / 'C2P2_RS0_RUN_RECOVERY_R4_DIAGNOSIS_v0_1.json').read_text())
          authority = json.loads(Path('registries/authority/C2P2_RS0_RUN_RECOVERY_R4_AUTHORITY_v0_1.json').read_text())
          consumption = json.loads(Path('registries/authority/C2P2_RS0_REAL_SOURCE_SHADOW_RUN_CONSUMPTION_v0_4.json').read_text())
          result = json.loads((release / 'C2P2_RS0_REAL_SOURCE_SHADOW_RUN_R4_RESULT_v0_1.json').read_text())

          assert decision['gate_id'] == 'C2P2-RS0-RUN-RECOVERY-R4'
          assert decision['decision'] == 'PASS'
          assert decision['real_source_execution_authority'] == 'NONE'
          assert decision['fresh_run_token'] == 'NONE'
          assert decision['storage_limit_change'] == 'NOT_AUTHORISED'
          assert authority['authority_id'] == 'AUTH.C2P2.RS0.RUN_RECOVERY.R4.v0.1'
          assert authority['state'] == 'AUTHORISED_RECOVERY_ONLY'
          assert authority['real_source_read'] == 'FORBIDDEN'
          assert authority['real_source_execution'] == 'FORBIDDEN'
          assert authority['fresh_run_token'] == 'NONE'
          assert authority['diagnostic_capacity']['storage_limit_change'] == 'NOT_AUTHORISED'
          assert diagnosis['diagnosis_class'] == 'POST_SEMANTIC_LAUNCH_RESIDUAL_STORAGE_CAPACITY_QUALIFICATION_GAP'
          assert consumption['authority_id'] == 'AUTH.C2P2.RS0.REAL_SOURCE_SHADOW.ONE_RUN.v0.5'
          assert consumption['execution_count_consumed'] == 1
          assert consumption['run_count_remaining'] == 0
          assert result['status'] == 'BLOCKED_CAPACITY_EXCEEDED_SINGLE_USE_CONSUMED'
          assert result['selection_state'] == 'NONE_SELECTED_INCOMPLETE_RUN'
          assert result['active_object_pack_id'] is None
          print('C2P2_RS0_R4_RECOVERY_AUTHORITY=PASS')
          PY

      - name: Re-resolve live main scientific identities before qualification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          live_main="$(git rev-parse origin/main)"
          echo "LIVE_MAIN_START_SHA=$live_main" >> "$GITHUB_ENV"
          PYTHONPATH=src:. python3 - <<'PY'
          import json
          import subprocess

          def git_json(path: str):
              raw = subprocess.run(
                  ['git', 'show', f'origin/main:{path}'],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout
              return json.loads(raw)

          candidate = git_json('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0/C2P2_RS0_CANDIDATE_CURRENTNESS_v0_2.json')
          final = candidate['final_generation']
          assert final['generation_id'] == 'C2P2-PS0-EMPIRICAL-RUNTIME-GENERATION-v3'
          assert final['generation_logical_sha256'] == 'c7f0160f7bb8d75b92d4aa95116895c25c44c987e2e78a8352c0e491244bbf1a'
          assert final['candidate_hashes'] == {
              'C2P2-PS0-OP-A-STRICT-CONTINUITY-v3': 'a8cb003521c62129044a4d62cb9a4d5a967cd3ef9d933fb1090ac4dad0843102',
              'C2P2-PS0-OP-B-RELATIONAL-CONTINUITY-v3': 'a91f50c12438c4d5263d36b48e40acc0a5e146b474307721a4108ac2398a752e',
              'C2P2-PS0-OP-C-EPISODE-ENRICHED-CONTINUITY-v3': '29f8ac9a5844b425901fda90299f911a48a85422a390771753ffd5b894b1c52c',
          }
          assert candidate['selection_state'] == 'COMPARATIVE_SET_ONLY_NO_WINNER'
          assert candidate['active_object_pack_id'] is None

          closeout = git_json('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0/C2P2_RS0_CURRENT_SOURCE_MATERIALISATION_CLOSEOUT_v0_1.json')
          material = closeout['materialisation']
          assert material['materialisation_id'] == 'C2P2.RS0.CURRENT.C2VNEXT.C2E.2021_2023.v1'
          assert material['logical_sha256'] == 'f7e772ca550fe9b1fb69c45ceca6e55f48da3b9cc02d88bb7b8dd1b74dd6766b'
          assert material['rows']['C2_VNEXT'] == 1505072
          assert material['rows']['C2E_V0_2'] == 584520
          artifact = closeout['artifact']
          assert artifact['github_actions_artifact_id'] == 9283576949
          assert artifact['github_actions_artifact_digest'] == 'sha256:482781f5b7921d64219650ff4711027337dbfe677b22415df37708848471976e'
          print('C2P2_RS0_R4_RECOVERY_LIVE_MAIN_CURRENTNESS=PASS')
          PY

      - name: Prepare recovery qualification workspace
        run: |
          rm -rf /tmp/c2p2-rs0-r4-capacity-recovery
          mkdir -p /tmp/c2p2-rs0-r4-capacity-recovery

      - name: Run targeted R4 recovery assurance
        run: |
          PYTHONPATH=src:. python3 -m pytest -q --tb=short \
            --junitxml=/tmp/c2p2-rs0-r4-capacity-recovery/targeted.xml \
            tests/opt_b/c2p/v0_2/test_c2p2_rs0_r4_capacity_recovery.py \
            tests/opt_b/c2p/v0_2/test_c2p2_rs0_semantic_scalability_indexed.py \
            tests/opt_b/c2p/v0_2/test_c2p2_rs0_semantic_scalability_compact_storage.py \
            tests/opt_b/c2p/v0_2/test_c2p2_rs0_source_order_recovery.py \
            tests/development/test_ci_workflow_inventory.py

      - name: Run complete repository regression
        run: |
          PYTHONPATH=src:. python3 -m pytest tests -q --tb=short \
            --junitxml=/tmp/c2p2-rs0-r4-capacity-recovery/repository.xml

      - name: Run adversarial full-cardinality A/B/C synthetic capacity measurement
        run: |
          PYTHONPATH=src:. python3 scripts/run_c2p2_rs0_semantic_scalability_qualification.py \
            --output /tmp/c2p2-rs0-r4-capacity-recovery/capacity.json \
            --work-root /tmp/c2p2-rs0-r4-capacity-recovery/work

      - name: Bind exact-head test identities to recovery qualification
        env:
          OVC_GITHUB_RUN_ID: ${{ github.run_id }}
          OVC_GITHUB_JOB: ${{ github.job }}
          OVC_HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('/tmp/c2p2-rs0-r4-capacity-recovery')
          data = json.loads((root / 'capacity.json').read_text())

          def summary(path: Path):
              xml = ET.parse(path).getroot()
              suites = [xml] if xml.tag == 'testsuite' else list(xml.findall('testsuite'))
              totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.attrib.get(key, 0))
              totals['passed'] = totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']
              return totals

          assert data['status'] == 'PASS'
          assert data['real_source_read'] is False
          assert data['real_source_execution'] is False
          assert data['fresh_run_token'] == 'NONE'
          assert data['storage_ceiling_change'] == 'PROPOSED_ONLY_OPERATOR_REQUIRED_NOT_ENACTED'
          data['qualification'] = {
              'github_run_id': int(os.environ['OVC_GITHUB_RUN_ID']),
              'github_job': os.environ['OVC_GITHUB_JOB'],
              'head_sha': os.environ['OVC_HEAD_SHA'],
              'targeted_assurance': summary(root / 'targeted.xml'),
              'repository_regression': summary(root / 'repository.xml'),
              'source_download': 'FORBIDDEN_NOT_PERFORMED',
              'real_source_semantic_execution': False,
              'fresh_run_token': 'NONE',
              'selection': 'NONE',
              'activation': 'NONE',
              'validation': 'LOCKED_UNCONSUMED',
              'status': 'PASS',
          }
          (root / 'capacity.json').write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload compact recovery qualification artifact
        id: recovery_artifact
        uses: actions/upload-artifact@v4
        with:
          name: c2p2-rs0-r4-capacity-recovery-${{ github.run_id }}
          path: /tmp/c2p2-rs0-r4-capacity-recovery/capacity.json
          if-no-files-found: error
          retention-days: 30

      - name: Re-resolve live main scientific identities and exact recovery head before evidence write
        env:
          OVC_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          live_main="$(git rev-parse origin/main)"
          echo "LIVE_MAIN_FINAL_SHA=$live_main" >> "$GITHUB_ENV"
          git fetch origin recover/c2p2-rs0-run-recovery-r4-20260818 --no-tags
          current="$(git rev-parse FETCH_HEAD)"
          test "$current" = "$OVC_HEAD_SHA" || {
            echo "R4_RECOVERY_BRANCH_ADVANCED:${current}:${OVC_HEAD_SHA}" >&2
            exit 1
          }
          PYTHONPATH=src:. python3 - <<'PY'
          import json
          import subprocess

          def git_json(path: str):
              raw = subprocess.run(['git', 'show', f'origin/main:{path}'], check=True, capture_output=True, text=True).stdout
              return json.loads(raw)

          candidate = git_json('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0/C2P2_RS0_CANDIDATE_CURRENTNESS_v0_2.json')
          assert candidate['final_generation']['generation_logical_sha256'] == 'c7f0160f7bb8d75b92d4aa95116895c25c44c987e2e78a8352c0e491244bbf1a'
          assert candidate['selection_state'] == 'COMPARATIVE_SET_ONLY_NO_WINNER'
          assert candidate['active_object_pack_id'] is None
          closeout = git_json('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0/C2P2_RS0_CURRENT_SOURCE_MATERIALISATION_CLOSEOUT_v0_1.json')
          assert closeout['materialisation']['logical_sha256'] == 'f7e772ca550fe9b1fb69c45ceca6e55f48da3b9cc02d88bb7b8dd1b74dd6766b'
          assert closeout['artifact']['github_actions_artifact_digest'] == 'sha256:482781f5b7921d64219650ff4711027337dbfe677b22415df37708848471976e'
          print('C2P2_RS0_R4_RECOVERY_FINAL_CURRENTNESS=PASS')
          PY

      - name: Materialise recovery QA, R5 gate and programme state on recovery branch only
        env:
          OVC_GITHUB_RUN_ID: ${{ github.run_id }}
          OVC_GITHUB_JOB: ${{ github.job }}
          OVC_HEAD_SHA: ${{ github.sha }}
          ARTIFACT_ID: ${{ steps.recovery_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.recovery_artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.recovery_artifact.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release = Path('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0')
          root = Path('/tmp/c2p2-rs0-r4-capacity-recovery')
          qualification_path = release / 'C2P2_RS0_R4_CAPACITY_RECOVERY_QUALIFICATION_v0_1.json'
          qualification_path.write_bytes((root / 'capacity.json').read_bytes())
          qualification = json.loads(qualification_path.read_text())
          qualification_sha = hashlib.sha256(qualification_path.read_bytes()).hexdigest()

          artifact_digest = os.environ.get('ARTIFACT_DIGEST', '')
          if artifact_digest and not artifact_digest.startswith('sha256:'):
              artifact_digest = 'sha256:' + artifact_digest

          qa = {
              'schema': 'ovc-c2p2-rs0-run-recovery-r4-qa/v1',
              'programme_id': 'OVC-C2P2-RS0-SHADOW-EVIDENCE-v0.1',
              'packet_id': 'C2P2-RS0-RUN-RECOVERY-R4',
              'status': 'PASS',
              'qa_recommendation': 'PASS',
              'tested_head_sha': os.environ['OVC_HEAD_SHA'],
              'live_main_final_sha': os.environ['LIVE_MAIN_FINAL_SHA'],
              'qualification_ref': str(qualification_path),
              'qualification_sha256': qualification_sha,
              'tests': qualification['qualification'],
              'capacity': {
                  'max_measured_database_bytes': qualification['max_measured_database_bytes'],
                  'max_measured_peak_rss_bytes': qualification['max_measured_peak_rss_bytes'],
                  'diagnostic_storage_limit_bytes': qualification['diagnostic_storage_limit_bytes'],
                  'frozen_execution_storage_limit_bytes': qualification['frozen_execution_storage_limit_bytes'],
                  'proposed_execution_storage_limit_bytes': qualification['proposed_execution_storage_limit_bytes'],
                  'proposal_status': 'OPERATOR_REQUIRED_NOT_ENACTED',
              },
              'authority_review': {
                  'real_source_read': False,
                  'real_source_execution': False,
                  'fresh_run_token': 'NONE',
                  'storage_ceiling_change_enacted': False,
                  'science_change': 'NONE',
                  'selection': 'NONE',
                  'activation': 'NONE',
                  'validation': 'LOCKED_UNCONSUMED',
              },
              'warnings': [
                  'R4 v0.5 authority remains consumed and is not reinstated.',
                  'The diagnostic measurement ceiling is not an execution ceiling.',
                  'The proposed R5 storage ceiling is operator-reserved and has not been enacted.',
              ],
              'unresolved_issues': [],
              'rollback': 'FORWARD_ONLY_PRESERVE_R4_CONSUMPTION_AND_ALL_RECOVERY_QUALIFICATION_EVIDENCE',
          }
          qa_path = release / 'C2P2_RS0_RUN_RECOVERY_R4_QA_v0_1.json'
          qa_path.write_text(json.dumps(qa, indent=2, sort_keys=True) + '\n')
          qa_sha = hashlib.sha256(qa_path.read_bytes()).hexdigest()

          gate = {
              'schema': 'ovc-c2p2-rs0-fresh-grun-r5-gate-packet/v1',
              'programme_id': 'OVC-C2P2-RS0-SHADOW-EVIDENCE-v0.1',
              'gate_id': 'C2P2-RS0-FRESH-GRUN-R5',
              'title': 'C2P2-RS0 Fresh GRUN R5 after bounded R4 capacity recovery',
              'status': 'GATE_READY',
              'gate_classification': 'OPERATOR_REQUIRED',
              'baseline_commit': '6d641a121b839686b521da38b8523b895f904811',
              'candidate_commit': os.environ['OVC_HEAD_SHA'],
              'live_main_sha_at_final_qualification': os.environ['LIVE_MAIN_FINAL_SHA'],
              'completed_packets': ['C2P2-RS0-RUN-RECOVERY-R4'],
              'current_authority': 'AUTH.C2P2.RS0.RUN_RECOVERY.R4.v0.1_SYNTHETIC_ONLY_NO_REAL_SOURCE',
              'proposed_authority_delta': {
                  'proposed_authority_id': 'AUTH.C2P2.RS0.REAL_SOURCE_SHADOW.ONE_RUN.v0.6',
                  'fresh_real_source_run_count': 1,
                  'fresh_run_token_id': 'TOKEN.C2P2.RS0.R5.ONE_RUN.v0.6',
                  'run_mode': 'PREREGISTERED_COMPARATIVE_A_B_C_SHADOW_ONLY',
                  'source_materialisation_id': 'C2P2.RS0.CURRENT.C2VNEXT.C2E.2021_2023.v1',
                  'candidate_generation_id': 'C2P2-PS0-EMPIRICAL-RUNTIME-GENERATION-v3',
                  'runtime_binding_id': 'C2P2_RS0_INDEXED_OUTCOME_EQUIVALENT_RUNTIME_BINDING_v0_3',
                  'runtime_generation_id': 'C2P2_RS0_INDEXED_OUTCOME_EQUIVALENT_RUNTIME_v0_2',
                  'evidence_contract_id': 'C2P2_RS0_NEGATIVE_COVERAGE_CERTIFICATE_v0_2',
                  'source_order_binding_id': 'C2P2_RS0_EMPIRICAL_RUNTIME_SPOOLED_ADAPTER_BINDING_v0_2',
                  'peak_memory_limit_bytes': 1160593408,
                  'external_storage_limit_bytes': qualification['proposed_execution_storage_limit_bytes'],
                  'storage_limit_change': {
                      'from_bytes': 6411935744,
                      'to_bytes': qualification['proposed_execution_storage_limit_bytes'],
                      'authority': 'OPERATOR_RESERVED_NOT_YET_ENACTED',
                  },
                  'concurrency_limit': 1,
                  'checkpoint_cadence_source_records': 4096,
              },
              'acceptance_conditions': {
                  'recovery_qualification': 'PASS',
                  'targeted_tests': 'PASS',
                  'repository_regression': 'PASS',
                  'all_three_adversarial_full_cardinality_candidates': 'PASS',
                  'synthetic_high_water_bounds_r4_partial_high_water': qualification['checks']['synthetic_high_water_bounds_r4_observed_partial_database'],
                  'memory_within_frozen_ceiling': qualification['checks']['all_cases_inside_frozen_memory_ceiling'],
                  'real_source_read_during_recovery': False,
                  'real_source_execution_during_recovery': False,
                  'storage_ceiling_enacted_during_recovery': False,
              },
              'tests': qualification['qualification'],
              'qa_ref': str(qa_path),
              'qa_sha256': qa_sha,
              'qa_recommendation': 'PASS',
              'warnings': [
                  'R4 single-use v0.5 authority is consumed and cannot be rerun.',
                  'R5 would be a new one-shot authority, not reinstatement of R4.',
                  'The proposed storage ceiling is a physical capacity change and therefore operator-reserved.',
                  'No candidate has been selected and no ObjectPack is active.',
              ],
              'unresolved_issues': [],
              'changed_files': [
                  '.github/workflows/c2p2-rs0-semantic-scalability-qualification.yml',
                  'scripts/run_c2p2_rs0_semantic_scalability_qualification.py',
                  'tests/opt_b/c2p/v0_2/test_c2p2_rs0_r4_capacity_recovery.py',
                  'registries/authority/C2P2_RS0_RUN_RECOVERY_R4_AUTHORITY_v0_1.json',
                  'registries/implementation/c2p_v0_2/C2P2_RS0_EXECUTION_STATE_v0_4.json',
                  'docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0/C2P2_RS0_RUN_RECOVERY_R4_OPERATOR_DECISION_v0_1.json',
                  'docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0/C2P2_RS0_RUN_RECOVERY_R4_DIAGNOSIS_v0_1.json',
                  'docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0/C2P2_RS0_RUN_RECOVERY_R4_IMPLEMENTATION_PACKET_v0_1.json',
                  str(qualification_path),
                  str(qa_path),
              ],
              'external_artifact': {
                  'github_actions_run_id': int(os.environ['OVC_GITHUB_RUN_ID']),
                  'github_actions_artifact_id': int(os.environ['ARTIFACT_ID']) if os.environ.get('ARTIFACT_ID') else None,
                  'github_actions_artifact_digest': artifact_digest or None,
                  'github_actions_artifact_url': os.environ.get('ARTIFACT_URL') or None,
                  'qualification_sha256': qualification_sha,
              },
              'rollback': 'FORWARD_ONLY_PRESERVE_R4_CONSUMPTION_AND_ALL_R4_RECOVERY_EVIDENCE',
              'recommended_decision': 'PASS',
              'exact_work_after_approval': [
                  'Materialise AUTH.C2P2.RS0.REAL_SOURCE_SHADOW.ONE_RUN.v0.6 with exactly one R5 token.',
                  'Enact only the operator-approved proposed physical storage ceiling; keep memory, population, sampling, precision, source, candidates, runtime semantics and evidence contract unchanged.',
                  'Re-resolve live main and all bound scientific identities immediately before source access.',
                  'Run exactly one A/B/C real-source shadow comparison.',
                  'On completion stop at C2P2-RS0-SCIENTIFIC-REVIEW-SELECTION with no automatic winner; on post-semantic failure consume R5 and stop at C2P2-RS0-RUN-RECOVERY-R5.',
              ],
              'non_transitive_denials': {
                  'r4_rerun_or_token_reinstatement': 'FORBIDDEN',
                  'more_than_one_r5_execution': 'FORBIDDEN',
                  'population_sampling_or_precision_change': 'FORBIDDEN',
                  'candidate_predicate_threshold_semantic_or_objectpack_change': 'FORBIDDEN',
                  'objectpack_selection': 'NONE',
                  'c2p_activation': 'NONE',
                  'validation': 'LOCKED_UNCONSUMED',
                  'publication_probability_risk_exposure_trading_execution_agent_write': 'NONE',
                  'main_merge': 'NONE',
              },
              'f0_a': 'HOLD_NO_JOINT_LAUNCH',
          }
          gate_path = release / 'C2P2_RS0_FRESH_GRUN_R5_GATE_PACKET_v0_1.json'
          gate_path.write_text(json.dumps(gate, indent=2, sort_keys=True) + '\n')

          state = {
              'schema': 'ovc-c2p2-rs0-execution-state/v4',
              'packet_id': 'C2P2-RS0-RUN-RECOVERY-R4',
              'plan_id': 'OVC-C2P2-RS0-SHADOW-EVIDENCE-v0.1',
              'plan_version': 'v0.1',
              'status': 'GATE_READY',
              'prerequisites': [
                  'C2P2_RS0_REAL_SOURCE_SHADOW_RUN_R4_RESULT_v0_1',
                  'C2P2_RS0_REAL_SOURCE_SHADOW_RUN_CONSUMPTION_v0_4',
                  'C2P2_RS0_RUN_RECOVERY_R4_OPERATOR_DECISION_v0_1',
              ],
              'authority_required': 'OPERATOR_REQUIRED_AT_C2P2-RS0-FRESH-GRUN-R5',
              'authority_delta': 'RECOVERY_QUALIFIED_NO_REAL_SOURCE_AUTHORITY_GRANTED',
              'baseline_commit': '6d641a121b839686b521da38b8523b895f904811',
              'branch': 'recover/c2p2-rs0-run-recovery-r4-20260818',
              'candidate_commit': os.environ['OVC_HEAD_SHA'],
              'tests': qualification['qualification'],
              'qa_packet': str(qa_path),
              'decision_record': 'docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0/C2P2_RS0_RUN_RECOVERY_R4_OPERATOR_DECISION_v0_1.json',
              'merge_commit': None,
              'blockers': [],
              'next_packet': 'C2P2-RS0-FRESH-GRUN-R5',
              'mandatory_stop': 'C2P2-RS0-FRESH-GRUN-R5',
              'run_authority_consumed': True,
              'run_count_remaining': 0,
              'real_source_execution_authority': 'NONE_PENDING_R5_OPERATOR_DECISION',
              'fresh_run_token': 'NONE_PENDING_R5_OPERATOR_DECISION',
              'frozen_execution_storage_limit_bytes': 6411935744,
              'proposed_execution_storage_limit_bytes': qualification['proposed_execution_storage_limit_bytes'],
              'storage_limit_change': 'PROPOSED_ONLY_OPERATOR_REQUIRED_NOT_ENACTED',
              'selection_state': 'NONE_SELECTED_INCOMPLETE_RUN',
