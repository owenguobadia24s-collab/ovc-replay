name: C2P2 RS0 semantic scalability qualification

on:
  push:
    branches:
      - recover/c2p2-rs0-semantic-scalability-20260818

permissions:
  contents: write

concurrency:
  group: c2p2-rs0-semantic-scalability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    name: Bounded synthetic semantic scalability qualification
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Publish diagnostic run locator branch
        env:
          OVC_GITHUB_RUN_ID: ${{ github.run_id }}
          OVC_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          locator_branch="diag/c2p2-rs0-semantic-scalability-run-${OVC_GITHUB_RUN_ID}"
          mkdir -p diagnostics/c2p2-rs0-semantic-scalability
          cat > diagnostics/c2p2-rs0-semantic-scalability/run-locator.json <<JSON
          {
            "schema": "ovc-c2p2-rs0-semantic-scalability-run-locator/v1",
            "packet_id": "C2P2-RS0-SEMANTIC-SCALABILITY-RECOVERY",
            "github_run_id": ${OVC_GITHUB_RUN_ID},
            "head_sha": "${OVC_HEAD_SHA}",
            "authority_effect": "NONE_DIAGNOSTIC_ONLY",
            "real_source_execution_authority": "NONE",
            "fresh_run_token": "NONE"
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/c2p2-rs0-semantic-scalability/run-locator.json
          git commit -m "C2P2-RS0: expose semantic scalability run ${OVC_GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:"refs/heads/${locator_branch}"
          git reset --hard "$OVC_HEAD_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository test dependencies
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt

      - name: Verify exact bounded authority and preserved R3 consumption
        shell: bash
        run: |
          PYTHONPATH=src:. python3 - <<'PY'
          import json
          from pathlib import Path

          release = Path('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0')
          decision = json.loads((release / 'C2P2_RS0_SEMANTIC_SCALABILITY_RECOVERY_OPERATOR_DECISION_v0_1.json').read_text())
          design = json.loads((release / 'C2P2_RS0_SEMANTIC_SCALABILITY_DESIGN_v0_1.json').read_text())
          consumption = json.loads(Path('registries/authority/C2P2_RS0_REAL_SOURCE_SHADOW_RUN_CONSUMPTION_v0_3.json').read_text())
          assert decision['gate_id'] == 'C2P2-RS0-SEMANTIC-SCALABILITY-RECOVERY'
          assert decision['decision'] == 'PASS'
          assert decision['fresh_run_token'] == 'NONE'
          assert decision['forbidden']['real_source_execution'] is True
          assert decision['forbidden']['r4_execution'] is True
          assert decision['forbidden']['storage_ceiling_change'] is True
          assert design['selected_design']['id'] == 'ALT-2-OUTCOME-EQUIVALENT-NEGATIVE-COVERAGE'
          assert design['selected_design']['runtime_generation'] == 'C2P2_RS0_INDEXED_OUTCOME_EQUIVALENT_RUNTIME_v0_2'
          assert design['selected_design']['evidence_contract_id'] == 'C2P2_RS0_NEGATIVE_COVERAGE_CERTIFICATE_v0_2'
          assert design['real_source_execution'] == 'FORBIDDEN'
          assert design['fresh_run_token'] == 'NONE'
          assert consumption['authority_id'] == 'AUTH.C2P2.RS0.REAL_SOURCE_SHADOW.ONE_RUN.v0.4'
          assert consumption['execution_count_consumed'] == 1
          assert consumption['run_count_remaining'] == 0
          print('C2P2_RS0_SEMANTIC_SCALABILITY_AUTHORITY=PASS')
          PY

      - name: Prepare qualification workspace
        run: |
          rm -rf /tmp/c2p2-rs0-semantic-scalability
          mkdir -p /tmp/c2p2-rs0-semantic-scalability

      - name: Run targeted adversarial exact-reference assurance
        run: |
          PYTHONPATH=src:. python3 -m pytest -q --tb=short \
            --junitxml=/tmp/c2p2-rs0-semantic-scalability/targeted.xml \
            tests/opt_b/c2p/v0_2/test_c2p2_rs0_semantic_scalability_indexed.py \
            tests/opt_b/c2p/v0_2/test_c2p2_rs0_semantic_scalability_compact_storage.py \
            tests/opt_b/c2p/v0_2/test_c2p2_rs0_runtime_capacity_recovery.py \
            tests/opt_b/c2p/v0_2/test_c2p2_rs0_source_order_recovery.py

      - name: Run complete repository regression
        run: |
          PYTHONPATH=src:. python3 -m pytest tests -q --tb=short \
            --junitxml=/tmp/c2p2-rs0-semantic-scalability/repository.xml

      - name: Run full-cardinality worst-case synthetic capacity qualification
        run: |
          PYTHONPATH=src:. python3 scripts/run_c2p2_rs0_semantic_scalability_qualification.py \
            --output /tmp/c2p2-rs0-semantic-scalability/capacity.json \
            --work-root /tmp/c2p2-rs0-semantic-scalability/work

      - name: Bind exact-head test and Actions identities to qualification receipt
        env:
          OVC_GITHUB_RUN_ID: ${{ github.run_id }}
          OVC_HEAD_SHA: ${{ github.sha }}
          OVC_GITHUB_JOB: ${{ github.job }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('/tmp/c2p2-rs0-semantic-scalability')
          data = json.loads((root / 'capacity.json').read_text())

          def summary(path: Path):
              xml = ET.parse(path).getroot()
              suites = [xml] if xml.tag == 'testsuite' else list(xml.findall('testsuite'))
              keys = ('tests', 'failures', 'errors', 'skipped')
              totals = {key: 0 for key in keys}
              for suite in suites:
                  for key in keys:
                      totals[key] += int(suite.attrib.get(key, 0))
              totals['passed'] = totals['tests'] - totals['failures'] - totals['errors'] - totals['skipped']
              return totals

          assert data['status'] == 'PASS'
          assert data['real_source_read'] is False
          assert data['real_source_execution'] is False
          assert data['fresh_run_token'] == 'NONE'
          assert data['storage_ceiling_change'] == 'NONE'
          data['qualification'] = {
              'github_run_id': int(os.environ['OVC_GITHUB_RUN_ID']),
              'github_job': os.environ['OVC_GITHUB_JOB'],
              'head_sha': os.environ['OVC_HEAD_SHA'],
              'targeted_assurance': summary(root / 'targeted.xml'),
              'repository_regression': summary(root / 'repository.xml'),
              'source_download': 'FORBIDDEN_NOT_PERFORMED',
              'real_source_semantic_execution': False,
              'fresh_run_token': 'NONE',
              'selection': 'NONE',
              'activation': 'NONE',
              'validation': 'LOCKED_UNCONSUMED',
              'status': 'PASS',
          }
          (root / 'capacity.json').write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload compact qualification artifact
        uses: actions/upload-artifact@v4
        with:
          name: c2p2-rs0-semantic-scalability-${{ github.run_id }}
          path: /tmp/c2p2-rs0-semantic-scalability/capacity.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify tested head is still branch head before evidence write
        env:
          OVC_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin recover/c2p2-rs0-semantic-scalability-20260818 --no-tags
          current="$(git rev-parse FETCH_HEAD)"
          test "$current" = "$OVC_HEAD_SHA" || {
            echo "SEMANTIC_SCALABILITY_BRANCH_ADVANCED:${current}:${OVC_HEAD_SHA}" >&2
            exit 1
          }

      - name: Persist compact exact-head qualification evidence on successor branch only
        shell: bash
        run: |
          set -euo pipefail
          target='docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0/C2P2_RS0_SEMANTIC_SCALABILITY_QUALIFICATION_v0_1.json'
          cp /tmp/c2p2-rs0-semantic-scalability/capacity.json "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'C2P2-RS0: materialise semantic scalability qualification [skip ci]'
          git push origin HEAD:refs/heads/recover/c2p2-rs0-semantic-scalability-20260818
