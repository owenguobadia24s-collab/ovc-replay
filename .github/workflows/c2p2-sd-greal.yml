          else
            git add docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd/C2P2_SD_GREAL_RECOVERY_GATE_PACKET_v0_1.json
          fi
          git commit -m 'C2P2-SD: materialise single-use GREAL evidence and next gate [skip ci]'; git push origin HEAD:${GITHUB_REF_NAME}

      - name: Summarise GREAL boundary
