        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          p=Path(os.environ['RESULT_DIR'])/'C2P2_SD_GREAL_RUN_RESULT_v0_1.json'
          if not p.exists():
              print('## C2P2-SD GREAL stopped before semantic launch'); print('- Single-use authority remains unconsumed.')
          else:
              r=json.loads(p.read_text()); print('## C2P2-SD GREAL'); print(f"- Status: `{r['status']}`"); print(f"- Next gate: `{r['next_operator_gate']}`"); print(f"- Authority consumed: `{r['authority']['execution_count_consumed']}`"); print('- Selection: `NONE`; activation: `NONE`; Validation: `LOCKED_UNCONSUMED`.')
          PY

      - name: Fail closed after consumed semantic failure
        if: ${{ always() && steps.execute.outputs.exit_code != '0' && steps.execute.outputs.exit_code != '' }}
        run: exit 1
