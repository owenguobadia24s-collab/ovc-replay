name: C2P2 SD GREAL full-population discrimination replay

on:
  push:
    branches:
      - run/c2p2-sd-greal-20260818
    paths:
      - registries/authority/C2P2_SD_GREAL_AUTHORITY_v0_1.json

concurrency:
  group: c2p2-sd-greal-single-use
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  greal:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: src:.
      RESULT_DIR: /tmp/c2p2-sd-greal-result
      SOURCE_DIR: /tmp/c2p2-sd-greal-source
    steps:
      - name: Checkout exact GREAL trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Prove prior GREAL attempts did not reach semantic launch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/c2p2-sd-greal.yml/runs?branch=${GITHUB_REF_NAME}&event=push&per_page=100")"
          mapfile -t prior_ids < <(jq -r --arg current "$GITHUB_RUN_ID" '.workflow_runs[] | select((.id|tostring) != $current) | .id' <<<"$runs_json")
          for prior_run_id in "${prior_ids[@]}"; do
            jobs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${prior_run_id}/jobs?per_page=100")"
            launch_state="$(jq -r '([.jobs[].steps[]? | select(.name == "Launch exactly one authorised GREAL semantic replay") | (.conclusion // .status // "UNKNOWN")] | first) // "ABSENT"' <<<"$jobs_json")"
            case "$launch_state" in
              skipped|ABSENT) echo "GREAL_PRIOR_ATTEMPT_PRE_SEMANTIC_SAFE:${prior_run_id}:${launch_state}" ;;
              *) echo "GREAL_PRIOR_ATTEMPT_REACHED_OR_AMBIGUOUS_SEMANTIC_LAUNCH:${prior_run_id}:${launch_state}" >&2; exit 44 ;;
            esac
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository and test dependencies
        run: python -m pip install -e ".[test]" -r requirements-console-vnext.txt

      - name: Verify exact branch head and unconsumed single-use authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" --no-tags
          live_branch="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          test "$live_branch" = "$GITHUB_SHA" || { echo "SD_GREAL_STALE_TRIGGER:$live_branch:$GITHUB_SHA" >&2; exit 42; }
          if git cat-file -e "origin/${GITHUB_REF_NAME}:registries/authority/C2P2_SD_GREAL_CONSUMPTION_v0_1.json" 2>/dev/null; then
            echo 'SD_GREAL_SINGLE_USE_ALREADY_CONSUMED' >&2; exit 43
          fi
          python -m py_compile scripts/c2p2_sd_greal.py
          python scripts/c2p2_sd_greal.py validate-repo-bindings --repo-root .

      - name: Re-resolve live main and frozen scientific identities before source access
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          live_main="$(git rev-parse origin/main)"
          echo "LIVE_MAIN_SHA=$live_main" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, subprocess
          def main_json(path):
              return json.loads(subprocess.run(['git','show',f'origin/main:{path}'],check=True,capture_output=True,text=True).stdout)
          c=main_json('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0/C2P2_RS0_CANDIDATE_CURRENTNESS_v0_2.json')
          f=c['final_generation']
          assert f['generation_id']=='C2P2-PS0-EMPIRICAL-RUNTIME-GENERATION-v3'
          assert f['generation_logical_sha256']=='c7f0160f7bb8d75b92d4aa95116895c25c44c987e2e78a8352c0e491244bbf1a'
          assert f['candidate_hashes']=={
              'C2P2-PS0-OP-A-STRICT-CONTINUITY-v3':'a8cb003521c62129044a4d62cb9a4d5a967cd3ef9d933fb1090ac4dad0843102',
              'C2P2-PS0-OP-B-RELATIONAL-CONTINUITY-v3':'a91f50c12438c4d5263d36b48e40acc0a5e146b474307721a4108ac2398a752e',
              'C2P2-PS0-OP-C-EPISODE-ENRICHED-CONTINUITY-v3':'29f8ac9a5844b425901fda90299f911a48a85422a390771753ffd5b894b1c52c'}
          assert c['selection_state']=='COMPARATIVE_SET_ONLY_NO_WINNER' and c['active_object_pack_id'] is None
          s=main_json('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0/C2P2_RS0_CURRENT_SOURCE_MATERIALISATION_CLOSEOUT_v0_1.json')
          assert s['materialisation']['materialisation_id']=='C2P2.RS0.CURRENT.C2VNEXT.C2E.2021_2023.v1'
          assert s['materialisation']['logical_sha256']=='f7e772ca550fe9b1fb69c45ceca6e55f48da3b9cc02d88bb7b8dd1b74dd6766b'
          assert s['artifact']['github_actions_artifact_id']==9283576949
          assert s['artifact']['github_actions_artifact_digest']=='sha256:482781f5b7921d64219650ff4711027337dbfe677b22415df37708848471976e'
          print('SD_GREAL_LIVE_MAIN_CURRENTNESS=PASS')
          PY

      - name: Run targeted GREAL assurance before source access
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/opt_b/c2p/v0_2/test_c2p2_sd_aggregate.py \
            tests/opt_b/c2p/v0_2/test_c2p2_sd_discrimination.py \
            tests/opt_b/c2p/v0_2/test_c2p2_sd_adversarial_fixture.py \
            tests/opt_b/c2p/v0_2/test_c2p2_rs0_source_order_recovery.py \
            tests/development/test_ci_workflow_inventory.py \
            --tb=short 2>&1 | tee /tmp/sd-greal-targeted.log

      - name: Run repository-wide regression before source access
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q --tb=short 2>&1 | tee /tmp/sd-greal-full.log

      - name: Download exact authorised source artifact
        uses: actions/download-artifact@v4
        with:
          name: c2p2-rs0-current-c2-vnext-c2e-2021-2023
          path: ${{ env.SOURCE_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '32010902424'

      - name: Preflight exact source without consuming GREAL authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RESULT_DIR"; mkdir -p "$RESULT_DIR"
          python scripts/c2p2_sd_greal.py preflight --repo-root . --source-root "$SOURCE_DIR" --output-dir "$RESULT_DIR"

      - name: Launch exactly one authorised GREAL semantic replay
        id: execute
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/c2p2_sd_greal.py execute --repo-root . --source-plan "$RESULT_DIR/source-plan-greal.json" --output-dir "$RESULT_DIR" --github-run-id "$GITHUB_RUN_ID"
          code=$?; echo "exit_code=$code" >> "$GITHUB_OUTPUT"; exit $code

      - name: Upload immutable GREAL run evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c2p2-sd-greal-${{ github.run_id }}
          path: ${{ env.RESULT_DIR }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1

      - name: Materialise GREAL court record and next gate
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RESULT_DIR/run-greal-start-receipt.json" ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          receipt={'schema':'ovc-c2p2-sd-greal-presemantic-technical-failure/v1','programme_id':'OVC-C2P2-SCIENTIFIC-DISCRIMINATION-v0.1','gate_id':'C2P2-SD-GREAL','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'trigger_head_sha':os.environ['GITHUB_SHA'],'semantic_execution_started':False,'execution_count_consumed':0,'fresh_run_token_state':'UNCONSUMED','real_source_semantic_execution':False,'authority_effect':'NONE_TECHNICAL_FAILURE_ONLY','selection':'NONE','activation':'NONE','validation':'LOCKED_UNCONSUMED'}
          p=Path('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd/C2P2_SD_GREAL_PRESEMANTIC_TECHNICAL_FAILURE_v0_1.json'); p.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
            git config user.name 'ovc-continuous-execution'; git config user.email 'actions@users.noreply.github.com'
            git add docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd/C2P2_SD_GREAL_PRESEMANTIC_TECHNICAL_FAILURE_v0_1.json
            git commit -m 'C2P2-SD: preserve presemantic GREAL technical failure [skip ci]'; git push origin HEAD:${GITHUB_REF_NAME}; exit 0
          fi
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          result_dir=Path(os.environ['RESULT_DIR']); release=Path('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd')
          result=json.loads((result_dir/'C2P2_SD_GREAL_RUN_RESULT_v0_1.json').read_text())
          shutil.copy2(result_dir/'C2P2_SD_GREAL_RUN_RESULT_v0_1.json', release/'C2P2_SD_GREAL_RUN_RESULT_v0_1.json')
          Path('registries/authority/C2P2_SD_GREAL_CONSUMPTION_v0_1.json').write_bytes((result_dir/'C2P2_SD_GREAL_CONSUMPTION_v0_1.json').read_bytes())
          artifact={'schema':'ovc-c2p2-sd-greal-artifact-binding/v1','programme_id':result['programme_id'],'gate_id':'C2P2-SD-GREAL','authority_id':'AUTH.C2P2.SD.GREAL.ONE_RUN.v0.1','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'github_actions_artifact_id':int(os.environ['ARTIFACT_ID']) if os.environ.get('ARTIFACT_ID') else None,'github_actions_artifact_digest':os.environ.get('ARTIFACT_DIGEST'),'github_actions_artifact_url':os.environ.get('ARTIFACT_URL'),'run_result_sha256':hashlib.sha256((result_dir/'C2P2_SD_GREAL_RUN_RESULT_v0_1.json').read_bytes()).hexdigest(),'retention':'PRESERVE_FORWARD_SUPERSEDE_ONLY','authority_effect':'NONE_STORAGE_PROVENANCE_ONLY'}
          (release/'C2P2_SD_GREAL_ARTIFACT_BINDING_v0_1.json').write_text(json.dumps(artifact,indent=2,sort_keys=True)+'\n')
          if result['status']=='COMPLETED_FULL_POPULATION_DISAGREEMENT_EVIDENCE':
              for name in ('C2P2_SD_WP4_REAL_SOURCE_LEDGER_SUMMARY_v0_1.json','C2P2_SD_WP5_BLIND_REVIEW_PACKET_v0_1.json'): shutil.copy2(result_dir/name, release/name)
              wp4=json.loads((result_dir/'C2P2_SD_WP4_REAL_SOURCE_LEDGER_SUMMARY_v0_1.json').read_text()); wp5=json.loads((result_dir/'C2P2_SD_WP5_BLIND_REVIEW_PACKET_v0_1.json').read_text())
              targeted=Path('/tmp/sd-greal-targeted.log').read_text().strip().splitlines()[-1]; full=Path('/tmp/sd-greal-full.log').read_text().strip().splitlines()[-1]
              qa={'schema':'ovc-c2p2-sd-wp4-qa/v1','programme_id':result['programme_id'],'packet_id':'C2P2-SD-WP4','recommendation':'PASS','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'tested_head_sha':os.environ['GITHUB_SHA'],'live_main_sha':os.environ.get('LIVE_MAIN_SHA'),'targeted_tests':targeted,'repository_tests':full,'full_population_identity_edges':wp4['identity_edge_count'],'disagreement_ledger_rows':wp4['disagreement_ledger_rows'],'sampling':'NONE','reduced_precision':'NONE','selection':'NONE','activation':'NONE','validation':'LOCKED_UNCONSUMED','warnings':['2H_A_L source is context-only under the frozen base-candidate runtime; base identity-edge population is 15M.','Candidate C episode enrichment remains untested because the frozen episode-relative role registry is empty.'],'unresolved_issues':[]}
              (release/'C2P2_SD_WP4_QA_v0_1.json').write_text(json.dumps(qa,indent=2,sort_keys=True)+'\n')
              gate={'schema':'ovc-c2p2-sd-gadj-gate-packet/v1','gate_id':'C2P2-SD-GADJ','title':'Blinded scientific adjudication','programme_id':result['programme_id'],'plan_id':'OVC-C2P2-SCIENTIFIC-DISCRIMINATION-PLAN-v0.1','plan_version':'v0.1','status':'GATE_READY','gate_classification':'OPERATOR_REQUIRED_FOR_HUMAN_SCIENTIFIC_LABELS','completed_packets':['C2P2-SD-WP0','C2P2-SD-WP1','C2P2-SD-WP2','C2P2-SD-WP3','C2P2-SD-WP4','C2P2-SD-WP5'],'current_authority':'GREAL_CONSUMED_FULL_POPULATION_DISAGREEMENT_EVIDENCE_ONLY','proposed_authority_delta':'HUMAN_BLINDED_LABELS_ONLY_NO_SELECTION_NO_ACTIVATION','allowed_labels':['SAME','DIFFERENT','AMBIGUOUS','NOT_EVALUABLE'],'blind_review_rows':wp5['blind_review_rows'],'representative_selector_rows':wp5['representative_selector_rows'],'confirmed_hard_break_rows':wp5['confirmed_hard_break_rows'],'blind_review_manifest_sha256':wp5['blind_review_manifest_sha256'],'candidate_names_hidden':True,'unblinding_map_emitted':False,'artifact_binding':artifact,'tests':{'targeted':targeted,'repository':full,'qa':'PASS'},'warnings':qa['warnings'],'unresolved_issues':[],'rollback':'DEFER_OR_BLOCK_GADJ; preserve immutable GREAL ledger and blind packet; no unblinding or selection before label freeze.','recommended_decision':'PASS_TO_HUMAN_BLINDED_ADJUDICATION','exact_work_after_approval':'Human operator/reviewers assign only SAME/DIFFERENT/AMBIGUOUS/NOT_EVALUABLE to the frozen blind review cases. Freeze labels before any candidate unblinding. Then WP6 computes error/Pareto evidence and stops at C2P2-SD-GSEL.','non_transitive_denials':{'objectpack_selection':'NONE','c2p_activation':'NONE','validation':'LOCKED_UNCONSUMED','canonical_publication':'NONE','ec1_candidate_defining_use':'FORBIDDEN','probability_risk_exposure_trading_execution_agent_write':'NONE'}}
              (release/'C2P2_SD_GADJ_GATE_PACKET_v0_1.json').write_text(json.dumps(gate,indent=2,sort_keys=True)+'\n')
              state={'schema':'ovc-c2p2-scientific-discrimination-execution-state/v1','programme_id':result['programme_id'],'plan_id':'OVC-C2P2-SCIENTIFIC-DISCRIMINATION-PLAN-v0.1','plan_version':'v0.1','packet_id':'C2P2-SD-GADJ','status':'GATE_READY','prerequisites':['C2P2-SD-WP4_COMPLETED','C2P2-SD-WP5_COMPLETED'],'authority_required':'OPERATOR_REQUIRED_FOR_HUMAN_SCIENTIFIC_LABELS','authority_delta':'PROPOSED_HUMAN_BLINDED_LABELS_ONLY','baseline_commit':'b9d1a65fd414f1be13f9b76e6369d8a4cf79582a','branch':os.environ['GITHUB_REF_NAME'],'candidate_commit':os.environ['GITHUB_SHA'],'tests':[targeted,full],'qa_packet':str(release/'C2P2_SD_WP4_QA_v0_1.json'),'decision_record':None,'merge_commit':None,'blockers':[],'next_packet':'C2P2-SD-GADJ','mandatory_stop':'C2P2-SD-GADJ','real_source_authority':'GREAL_SINGLE_USE_CONSUMED_NO_REPLAY_REMAINING','selection_state':'COMPARATIVE_SET_ONLY_NO_WINNER','active_object_pack_id':None,'c2p_activation':'NONE','validation':'LOCKED_UNCONSUMED','publication_probability_risk_exposure_trading_execution_agent_write':'NONE','no_vit':True,'main_merge':'NONE','state_pointer':'registries/implementation/c2p_v0_2/C2P2_SD_PROGRAMME_STATE_v0_1.json','external_artifact_id':artifact['github_actions_artifact_id'],'external_artifact_digest':artifact['github_actions_artifact_digest']}
          else:
              gate={'schema':'ovc-c2p2-sd-greal-recovery-gate-packet/v1','gate_id':'C2P2-SD-GREAL-RECOVERY','title':'GREAL post-launch recovery','programme_id':result['programme_id'],'status':'GATE_READY','gate_classification':'OPERATOR_REQUIRED','current_authority':'GREAL_SINGLE_USE_CONSUMED','failure_type':result.get('failure_type'),'failure_detail':result.get('failure_detail'),'rerun':'FORBIDDEN','selection':'NONE','activation':'NONE','validation':'LOCKED_UNCONSUMED','recommended_decision':'BLOCK_PENDING_BOUNDED_RECOVERY_PLAN'}
              (release/'C2P2_SD_GREAL_RECOVERY_GATE_PACKET_v0_1.json').write_text(json.dumps(gate,indent=2,sort_keys=True)+'\n')
              state={'schema':'ovc-c2p2-scientific-discrimination-execution-state/v1','programme_id':result['programme_id'],'plan_id':'OVC-C2P2-SCIENTIFIC-DISCRIMINATION-PLAN-v0.1','plan_version':'v0.1','packet_id':'C2P2-SD-GREAL-RECOVERY','status':'GATE_READY','authority_required':'OPERATOR_REQUIRED','authority_delta':'NONE_RECOVERY_DECISION_REQUIRED_SINGLE_USE_CONSUMED','branch':os.environ['GITHUB_REF_NAME'],'candidate_commit':os.environ['GITHUB_SHA'],'blockers':[result.get('failure_detail')],'next_packet':'C2P2-SD-GREAL-RECOVERY','mandatory_stop':'C2P2-SD-GREAL-RECOVERY','real_source_authority':'CONSUMED_NO_REPLAY_REMAINING','selection_state':'COMPARATIVE_SET_ONLY_NO_WINNER','active_object_pack_id':None,'c2p_activation':'NONE','validation':'LOCKED_UNCONSUMED','publication_probability_risk_exposure_trading_execution_agent_write':'NONE','no_vit':True,'main_merge':'NONE','state_pointer':'registries/implementation/c2p_v0_2/C2P2_SD_PROGRAMME_STATE_v0_1.json'}
          Path('registries/implementation/c2p_v0_2/C2P2_SD_EXECUTION_STATE_v0_1.json').write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'ovc-continuous-execution'; git config user.email 'actions@users.noreply.github.com'
          git add docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd/C2P2_SD_GREAL_RUN_RESULT_v0_1.json docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd/C2P2_SD_GREAL_ARTIFACT_BINDING_v0_1.json registries/authority/C2P2_SD_GREAL_CONSUMPTION_v0_1.json registries/implementation/c2p_v0_2/C2P2_SD_EXECUTION_STATE_v0_1.json
          if [ -f docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd/C2P2_SD_GADJ_GATE_PACKET_v0_1.json ]; then
