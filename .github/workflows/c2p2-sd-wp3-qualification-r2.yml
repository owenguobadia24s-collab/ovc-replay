name: C2P2 SD WP3 synthetic qualification R2

on:
  push:
    branches:
      - build/c2p2-sd-wp3-20260818
    paths:
      - docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd/C2P2_SD_WP3_R2_LAUNCH_v0_1.json

concurrency:
  group: c2p2-sd-wp3-synthetic-qualification-r2
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  qualify_wp3_r2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src:.
      QUAL_DIR: /tmp/c2p2-sd-wp3-r2
    steps:
      - name: Checkout exact R2 trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -e ".[test]" -r requirements-console-vnext.txt

      - name: Verify exact branch and frozen court record
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" main --no-tags
          live_branch="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          test "$live_branch" = "$GITHUB_SHA" || { echo "SD_R2_STALE_TRIGGER:$live_branch:$GITHUB_SHA"; exit 41; }
          live_main="$(git rev-parse origin/main)"
          echo "LIVE_MAIN_SHA=$live_main" >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          def main_json(path):
              return json.loads(subprocess.run(['git','show',f'origin/main:{path}'],check=True,capture_output=True,text=True).stdout)
          c=main_json('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0/C2P2_RS0_CANDIDATE_CURRENTNESS_v0_2.json')
          f=c['final_generation']
          assert f['generation_id']=='C2P2-PS0-EMPIRICAL-RUNTIME-GENERATION-v3'
          assert f['generation_logical_sha256']=='c7f0160f7bb8d75b92d4aa95116895c25c44c987e2e78a8352c0e491244bbf1a'
          assert f['candidate_hashes']=={
              'C2P2-PS0-OP-A-STRICT-CONTINUITY-v3':'a8cb003521c62129044a4d62cb9a4d5a967cd3ef9d933fb1090ac4dad0843102',
              'C2P2-PS0-OP-B-RELATIONAL-CONTINUITY-v3':'a91f50c12438c4d5263d36b48e40acc0a5e146b474307721a4108ac2398a752e',
              'C2P2-PS0-OP-C-EPISODE-ENRICHED-CONTINUITY-v3':'29f8ac9a5844b425901fda90299f911a48a85422a390771753ffd5b894b1c52c'}
          assert c['selection_state']=='COMPARATIVE_SET_ONLY_NO_WINNER' and c['active_object_pack_id'] is None
          s=main_json('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0/C2P2_RS0_CURRENT_SOURCE_MATERIALISATION_CLOSEOUT_v0_1.json')
          assert s['materialisation']['materialisation_id']=='C2P2.RS0.CURRENT.C2VNEXT.C2E.2021_2023.v1'
          assert s['materialisation']['logical_sha256']=='f7e772ca550fe9b1fb69c45ceca6e55f48da3b9cc02d88bb7b8dd1b74dd6766b'
          assert s['artifact']['github_actions_artifact_id']==9283576949
          assert s['artifact']['github_actions_artifact_digest']=='sha256:482781f5b7921d64219650ff4711027337dbfe677b22415df37708848471976e'
          p=Path('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-rs0/C2P2_RS0_REAL_SOURCE_SHADOW_RUN_R5_RESULT_v0_1.json')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='2c47aa5d96f6c58fcb03bf079778ddd96e98f9e32480ef0b3796e491196aa18b'
          r=json.loads(p.read_text())
          assert r['status']=='COMPLETED_COMPARATIVE_SET_NO_WINNER'
          assert r['authority']['execution_count_consumed']==1 and r['authority']['run_count_remaining']==0
          assert r['active_object_pack_id'] is None and r['c2p_activation']=='NONE'
          pointer=json.loads(Path('registries/implementation/c2p_v0_2/C2P2_SD_PROGRAMME_STATE_v0_1.json').read_text())
          assert 'programme_id' not in pointer and pointer['status']=='SUPERSEDED_PATH_POINTER'
          state=json.loads(Path('registries/implementation/c2p_v0_2/C2P2_SD_EXECUTION_STATE_v0_1.json').read_text())
          assert state['programme_id']=='OVC-C2P2-SCIENTIFIC-DISCRIMINATION-v0.1'
          PY
          test ! -d /tmp/c2p2-rs0-current-source-r5

      - name: Run targeted assurance
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/opt_b/c2p/v0_2/test_c2p2_sd_aggregate.py tests/opt_b/c2p/v0_2/test_c2p2_sd_discrimination.py tests/opt_b/c2p/v0_2/test_c2p2_sd_adversarial_fixture.py tests/development/test_ci_workflow_inventory.py --tb=short 2>&1 | tee /tmp/sd-targeted.log

      - name: Run repository regression
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q --tb=short 2>&1 | tee /tmp/sd-full.log

      - name: Run synthetic capacity qualification
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$QUAL_DIR" && mkdir -p "$QUAL_DIR"
          python scripts/c2p2_sd_wp3_qualification.py --output-dir "$QUAL_DIR" --synthetic-edges 20000 2>&1 | tee /tmp/sd-capacity.log

      - name: Upload synthetic qualification artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: c2p2-sd-wp3-r2-${{ github.run_id }}
          path: /tmp/c2p2-sd-wp3-r2
          if-no-files-found: error
          retention-days: 30

      - name: Materialise PASS and GREAL gate
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          rel=Path('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd')
          qsrc=Path(os.environ['QUAL_DIR'])/'C2P2_SD_WP3_CAPACITY_QUALIFICATION_v0_1.json'
          q=json.loads(qsrc.read_text()); assert q['status']=='PASS' and q['real_source_read'] is False and q['real_source_execution'] is False
          qsha=hashlib.sha256(qsrc.read_bytes()).hexdigest(); (rel/'C2P2_SD_WP3_CAPACITY_QUALIFICATION_v0_1.json').write_bytes(qsrc.read_bytes())
          targeted=Path('/tmp/sd-targeted.log').read_text().strip().splitlines()[-1]
          full=Path('/tmp/sd-full.log').read_text().strip().splitlines()[-1]
          qa={'schema':'ovc-c2p2-scientific-discrimination-qa/v1','programme_id':'OVC-C2P2-SCIENTIFIC-DISCRIMINATION-v0.1','packet_id':'C2P2-SD-WP3','recommendation':'PASS','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'tested_head_sha':os.environ['GITHUB_SHA'],'targeted_tests':targeted,'repository_tests':full,'capacity_qualification_sha256':qsha,'real_source_read':False,'real_source_execution':False,'selection':'NONE','activation':'NONE','validation':'LOCKED_UNCONSUMED','warnings':['Capacity is synthetic worst-case qualification only.','Candidate C episode enrichment remains untested; role count is zero.'],'unresolved_issues':[]}
          (rel/'C2P2_SD_WP3_QA_v0_1.json').write_text(json.dumps(qa,indent=2,sort_keys=True)+'\n')
          assurance={'schema':'ovc-c2p2-scientific-discrimination-cumulative-assurance/v1','programme_id':'OVC-C2P2-SCIENTIFIC-DISCRIMINATION-v0.1','packet_scope':['C2P2-SD-WP0','C2P2-SD-WP1','C2P2-SD-WP2','C2P2-SD-WP3'],'status':'PASS','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'tested_head_sha':os.environ['GITHUB_SHA'],'live_main_sha':os.environ['LIVE_MAIN_SHA'],'targeted_summary':targeted,'repository_summary':full,'real_source_read':False,'real_source_execution':False,'selection':'NONE','activation':'NONE','validation':'LOCKED_UNCONSUMED','warnings':[],'unresolved_issues':[]}
          (rel/'C2P2_SD_CUMULATIVE_ASSURANCE_v0_1.json').write_text(json.dumps(assurance,indent=2,sort_keys=True)+'\n')
          gate={'schema':'ovc-c2p2-scientific-discrimination-greal-gate-packet/v1','gate_id':'C2P2-SD-GREAL','title':'Bounded real-source discrimination replay authority','programme_id':'OVC-C2P2-SCIENTIFIC-DISCRIMINATION-v0.1','plan_id':'OVC-C2P2-SCIENTIFIC-DISCRIMINATION-PLAN-v0.1','plan_version':'v0.1','status':'GATE_READY','gate_classification':'OPERATOR_REQUIRED','baseline_commit':'779163f159964e0f1dae0184b52f2124f12e72ac','candidate_commit':os.environ['GITHUB_SHA'],'completed_packets':['C2P2-SD-WP0','C2P2-SD-WP1','C2P2-SD-WP2','C2P2-SD-WP3'],'current_authority':'R5_COMPACT_REANALYSIS_AND_SYNTHETIC_TOOLING_ONLY_NO_REAL_SOURCE_AUTHORITY','proposed_authority_delta':'ONE_EXACT_FULL_POPULATION_DISCOVERY_SHADOW_REPLAY_FOR_DISAGREEMENT_EVIDENCE_ONLY','proposed_capacity':{'external_storage_limit_bytes':q['proposed_execution_storage_limit_bytes'],'peak_memory_limit_bytes':q['proposed_peak_memory_limit_bytes'],'concurrency_limit':1,'checkpoint_cadence_source_records':4096},'required_bindings':{'candidate_generation_id':'C2P2-PS0-EMPIRICAL-RUNTIME-GENERATION-v3','candidate_generation_logical_sha256':'c7f0160f7bb8d75b92d4aa95116895c25c44c987e2e78a8352c0e491244bbf1a','source_materialisation_id':'C2P2.RS0.CURRENT.C2VNEXT.C2E.2021_2023.v1','source_materialisation_logical_sha256':'f7e772ca550fe9b1fb69c45ceca6e55f48da3b9cc02d88bb7b8dd1b74dd6766b','source_artifact_id':9283576949,'source_artifact_digest':'sha256:482781f5b7921d64219650ff4711027337dbfe677b22415df37708848471976e','runtime_binding_id':'C2P2_RS0_INDEXED_OUTCOME_EQUIVALENT_RUNTIME_BINDING_v0_3','evidence_contract_id':'C2P2_RS0_NEGATIVE_COVERAGE_CERTIFICATE_v0_2','source_order_binding_id':'C2P2_RS0_EMPIRICAL_RUNTIME_SPOOLED_ADAPTER_BINDING_v0_2','population':'GBPUSD BID/ASK 15M/2H_A_L [2021-01-01,2024-01-01) DISCOVERY_SHADOW_ONLY FULL_POPULATION','sampling':'FORBIDDEN','reduced_precision':'FORBIDDEN','semantic_or_threshold_change':'FORBIDDEN'},'tests':{'targeted':targeted,'repository':full,'qa':'PASS'},'warnings':qa['warnings'],'unresolved_issues':[],'external_artifact_hashes':{'github_actions_artifact_id':int(os.environ['ARTIFACT_ID']),'github_actions_artifact_digest':os.environ['ARTIFACT_DIGEST'],'github_actions_artifact_url':os.environ['ARTIFACT_URL'],'capacity_qualification_sha256':qsha},'rollback':'DEFER_OR_BLOCK_GREAL; preserve WP0-WP3 and all R4/R5 evidence. No token exists before PASS.','recommended_decision':'PASS','exact_work_after_approval':'Materialise one new single-use GREAL token bound to this exact gate/capacity; execute exactly one frozen full-population disagreement-evidence replay; then WP4/WP5 and stop at C2P2-SD-GADJ.','non_transitive_denials':{'objectpack_selection':'NONE','c2p_activation':'NONE','validation':'LOCKED_UNCONSUMED','canonical_publication':'NONE','ec1_candidate_defining_use':'FORBIDDEN','probability_risk_exposure_trading_execution_agent_write':'NONE'}}
          (rel/'C2P2_SD_GREAL_GATE_PACKET_v0_1.json').write_text(json.dumps(gate,indent=2,sort_keys=True)+'\n')
          state={'schema':'ovc-c2p2-scientific-discrimination-execution-state/v1','programme_id':'OVC-C2P2-SCIENTIFIC-DISCRIMINATION-v0.1','plan_id':'OVC-C2P2-SCIENTIFIC-DISCRIMINATION-PLAN-v0.1','plan_version':'v0.1','packet_id':'C2P2-SD-GREAL','status':'GATE_READY','prerequisites':['C2P2-SD-WP0_COMPLETED','C2P2-SD-WP1_COMPLETED','C2P2-SD-WP2_COMPLETED','C2P2-SD-WP3_COMPLETED'],'authority_required':'OPERATOR_REQUIRED','authority_delta':'PROPOSED_NOT_GRANTED_ONE_FULL_POPULATION_DISAGREEMENT_REPLAY','baseline_commit':'779163f159964e0f1dae0184b52f2124f12e72ac','branch':os.environ['GITHUB_REF_NAME'],'candidate_commit':os.environ['GITHUB_SHA'],'tests':[targeted,full],'qa_packet':str(rel/'C2P2_SD_WP3_QA_v0_1.json'),'decision_record':None,'merge_commit':None,'blockers':[],'next_packet':'C2P2-SD-GREAL','mandatory_stop':'C2P2-SD-GREAL','real_source_authority':'NONE_PENDING_OPERATOR_GREAL_DECISION','selection_state':'COMPARATIVE_SET_ONLY_NO_WINNER','active_object_pack_id':None,'c2p_activation':'NONE','validation':'LOCKED_UNCONSUMED','publication_probability_risk_exposure_trading_execution_agent_write':'NONE','no_vit':True,'main_merge':'NONE','state_pointer':'registries/implementation/c2p_v0_2/C2P2_SD_PROGRAMME_STATE_v0_1.json'}
          Path('registries/implementation/c2p_v0_2/C2P2_SD_EXECUTION_STATE_v0_1.json').write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'ovc-continuous-execution'; git config user.email 'actions@users.noreply.github.com'
          git add docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd/C2P2_SD_WP3_CAPACITY_QUALIFICATION_v0_1.json docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd/C2P2_SD_WP3_QA_v0_1.json docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd/C2P2_SD_CUMULATIVE_ASSURANCE_v0_1.json docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd/C2P2_SD_GREAL_GATE_PACKET_v0_1.json registries/implementation/c2p_v0_2/C2P2_SD_EXECUTION_STATE_v0_1.json
          git commit -m 'C2P2-SD-WP3: qualify tooling and materialise GREAL gate [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Materialise fail-closed technical receipt
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json,os
          from pathlib import Path
          def tail(path):
              p=Path(path)
              return p.read_text(errors='replace').splitlines()[-80:] if p.exists() else []
          receipt={'schema':'ovc-c2p2-sd-wp3-technical-failure/v1','programme_id':'OVC-C2P2-SCIENTIFIC-DISCRIMINATION-v0.1','packet_id':'C2P2-SD-WP3','status':'BLOCKED_TECHNICAL_CORRECTABLE','github_actions_run_id':int(os.environ['GITHUB_RUN_ID']),'trigger_head_sha':os.environ['GITHUB_SHA'],'live_main_sha':os.environ.get('LIVE_MAIN_SHA'),'targeted_tail':tail('/tmp/sd-targeted.log'),'repository_tail':tail('/tmp/sd-full.log'),'capacity_tail':tail('/tmp/sd-capacity.log'),'real_source_read':False,'real_source_execution':False,'selection':'NONE','activation':'NONE','validation':'LOCKED_UNCONSUMED','authority_effect':'NONE'}
          path=Path('docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd/C2P2_SD_WP3_TECHNICAL_FAILURE_v0_1.json'); path.parent.mkdir(parents=True,exist_ok=True); path.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'ovc-continuous-execution'; git config user.email 'actions@users.noreply.github.com'
          git add docs/releases/c2p-persistent-structural-objects-v0-2/c2p2-sd/C2P2_SD_WP3_TECHNICAL_FAILURE_v0_1.json
          git commit -m 'C2P2-SD-WP3: preserve technical qualification failure [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
          exit 0
