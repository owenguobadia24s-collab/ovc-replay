name: OVC unittest deterministic shard shadow

on:
  push:
    branches:
      - build/ci-performance-shadow-shards
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovc-unittest-shard-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-proof:
    name: OVC unittest shard manifest shadow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove deterministic exact-union shard manifest
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python tools/ci/unittest_shard_shadow.py prove \
            --policy registries/implementation/ci_performance/CIPR_UNITTEST_SHARD_POLICY_v0_1.json \
            --head-sha "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/unittest-shard-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: unittest-shard-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/unittest-shard-manifest.json
          if-no-files-found: error
          retention-days: 14

  shard:
    name: OVC unittest shard shadow ${{ matrix.shard }}
    needs: manifest-proof
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Execute deterministic legacy unittest shard
        shell: bash
        run: |
          set -euo pipefail
          started_ns=$(date +%s%N)
          PYTHONPATH=src python tools/ci/unittest_shard_shadow.py run \
            --policy registries/implementation/ci_performance/CIPR_UNITTEST_SHARD_POLICY_v0_1.json \
            --head-sha "${GITHUB_SHA}" \
            --shard-index "${{ matrix.shard }}" \
            --output "${RUNNER_TEMP}/unittest-shard-manifest-${{ matrix.shard }}.json"
          finished_ns=$(date +%s%N)
          elapsed_ms=$(( (finished_ns - started_ns) / 1000000 ))
          echo "OVC_CI_METRIC {\"schema\":\"ovc-ci-metric/v1\",\"metric\":\"shadow_unittest_shard_step_ms\",\"value_ms\":${elapsed_ms},\"head_sha\":\"${GITHUB_SHA}\",\"shard_index\":${{ matrix.shard }},\"authority_mode\":\"SHADOW_ONLY_NO_REQUIRED_CHECK_SUBSTITUTION\"}"
