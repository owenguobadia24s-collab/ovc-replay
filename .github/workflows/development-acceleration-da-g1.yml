name: Development Acceleration DA-G1 shared-service trust

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/development/**"
      - "schemas/development/**"
      - "src/ovc/development/**"
      - "fixtures/development/**"
      - "tests/development/**"
      - "scripts/development/validate_da_g1.py"
      - "docs/releases/development-acceleration-v0-1/da-00/**"
      - "docs/releases/development-acceleration-v0-1/da-g1/**"
      - "registries/development/**"
      - ".github/workflows/development-acceleration-da-g1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  da-g1:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'DA-WP1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate DA-G1 packet
        run: PYTHONPATH=src python -u scripts/development/validate_da_g1.py
      - name: Focused shared-service tests
        run: PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_shared_services.py' -v
      - name: Retained DA-G0 tests
        run: PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_da_g0.py' -v
      - name: Complete repository suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Assert authority and dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'from ovc\.opt_|import ovc\.opt_|pattern_discovery|research_operations' src/ovc/development
          grep -q 'repository_bot_write.*DENIED' docs/releases/development-acceleration-v0-1/da-g1/DA_G1_DELEGATED_DECISION.json
          grep -q 'reserved_authority_delta.*NONE' docs/releases/development-acceleration-v0-1/da-g1/DA_G1_QA_PACKET.json
