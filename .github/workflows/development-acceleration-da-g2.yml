name: Development Acceleration DA-G2 preflight trust

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/development/**"
      - "schemas/development/**"
      - "src/ovc/development/**"
      - "scripts/development/**"
      - "tests/development/**"
      - "fixtures/development/**"
      - "registries/development/**"
      - "docs/releases/development-acceleration-v0-1/da-wp1/**"
      - "docs/releases/development-acceleration-v0-1/da-g2/**"
      - ".github/workflows/development-acceleration-da-g2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  da-g2:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'DA-WP2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate DA-G2 packet
        run: PYTHONPATH=src python -u scripts/development/validate_da_g2.py
      - name: Focused preflight tests
        run: PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_preflight.py' -v
      - name: Retained shared-service tests
        run: PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_shared_services.py' -v
      - name: Retained DA-G0 tests
        run: PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_da_g0.py' -v
      - name: Complete repository suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Assert authority and no-write boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FAIL_CLOSED_EXECUTION_GUARD' contracts/development/OVC_UNIVERSAL_ARTIFACT_PREFLIGHT_CONTRACT_v0_1.md
          grep -q 'writes_performed.*false' schemas/development/preflight_receipt_v0_1.schema.json
          grep -q 'repository_bot_write.*DENIED' docs/releases/development-acceleration-v0-1/da-g2/DA_G2_QA_PACKET.json
          grep -q 'reserved_authority_delta.*NONE' docs/releases/development-acceleration-v0-1/da-g2/DA_G2_QA_PACKET.json
          ! grep -R -E 'from ovc\.opt_|import ovc\.opt_|pattern_discovery|research_operations' src/ovc/development/preflight.py
          ! grep -R -E 'rclone|aws s3|wrangler|git push|git merge|git reset --hard' src/ovc/development/preflight.py scripts/development/ovc_preflight.py
