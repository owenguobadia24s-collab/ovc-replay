name: Development Acceleration DA-G3 tiered test trust

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/development/**"
      - "schemas/development/**"
      - "registries/development/**"
      - "src/ovc/development/**"
      - "scripts/development/**"
      - "tests/development/**"
      - "fixtures/development/**"
      - "docs/development-acceleration/**"
      - "docs/releases/development-acceleration-v0-1/da-wp2/**"
      - "docs/releases/development-acceleration-v0-1/da-g3/**"
      - ".github/workflows/ovc-tiered-tests.yml"
      - ".github/workflows/development-acceleration-da-g3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  da-g3:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'DA-WP3')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate DA-G3 packet
        run: PYTHONPATH=src python -u scripts/development/validate_da_g3.py
      - name: Focused tiered-selection tests
        run: PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_test_selection.py' -v
      - name: Retained preflight tests
        run: PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_preflight.py' -v
      - name: Retained shared-service tests
        run: PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_shared_services.py' -v
      - name: Complete repository suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Assert no weakening or authority expansion
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'unknown_path_policy.*FINAL_HEAD' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json
          grep -q 'complete_repository_suite.*true' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json
          grep -q 'gate_replay_substitution.*PROHIBITED' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json
          grep -q 'default_workflow_adoption.*DENIED_UNTIL_DA_G6' docs/releases/development-acceleration-v0-1/da-g3/DA_G3_QA_PACKET.json
          grep -q 'repository_bot_write.*DENIED' docs/releases/development-acceleration-v0-1/da-g3/DA_G3_QA_PACKET.json
          ! grep -R -E 'from ovc\.opt_|import ovc\.opt_|pattern_discovery|research_operations' src/ovc/development/test_selection.py
          ! grep -R -E 'git push|git merge|git reset --hard|rclone|wrangler|aws s3' src/ovc/development/test_selection.py scripts/development/ovc_test_select.py
