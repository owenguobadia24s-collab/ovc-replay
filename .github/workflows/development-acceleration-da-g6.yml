name: Development Acceleration DA-G6 operator gate readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/development/OVC_DEVELOPMENT_ACCELERATION_DEFAULT_WORKFLOW_ADOPTION_PROPOSAL_v0_1.md"
      - "schemas/development/default_workflow_adoption_profile_v0_1.schema.json"
      - "registries/development/OVC_DEVELOPMENT_ACCELERATION_DEFAULT_WORKFLOW_PROPOSAL_v0_1.json"
      - "registries/development/OVC_DEVELOPMENT_ACCELERATION_PROGRAMME_STATE_v0_1.json"
      - "registries/development/OVC_DEVELOPMENT_ACCELERATION_IMPLEMENTATION_REGISTRY_v0_1.yaml"
      - "docs/releases/development-acceleration-v0-1/da-g6/**"
      - "scripts/development/validate_da_g6.py"
      - "tests/development/test_da_g6.py"
      - ".github/workflows/development-acceleration-da-g6.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  da-g6:
    name: DA-G6 operator gate readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate DA-G6 packet
        run: PYTHONPATH=src python -u scripts/development/validate_da_g6.py
      - name: Focused DA-G6 tests
        run: PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_da_g6.py' -v
      - name: Retained DA-G4 and DA-G4B authority tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_da_g4.py' -v
          PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_da_g4b.py' -v
      - name: Retained DA-G5 exporter tests
        run: PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_evidence_export.py' -v
      - name: Complete repository suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Assert inactive operator boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"status": "PENDING_OPERATOR_DA_G6"' registries/development/OVC_DEVELOPMENT_ACCELERATION_DEFAULT_WORKFLOW_PROPOSAL_v0_1.json
          grep -q '"active": false' registries/development/OVC_DEVELOPMENT_ACCELERATION_DEFAULT_WORKFLOW_PROPOSAL_v0_1.json
          grep -q '"operator_decision_required": true' docs/releases/development-acceleration-v0-1/da-g6/DA_G6_GATE_PACKET.json
          grep -q '"default_workflow_active": false' docs/releases/development-acceleration-v0-1/da-g6/DA_G6_GATE_PACKET.json
          grep -q '"retirement_active": false' docs/releases/development-acceleration-v0-1/da-g6/DA_G6_GATE_PACKET.json
          grep -q 'NON_DESTRUCTIVE_RETIRED_NON_AUTHORITATIVE' registries/development/OVC_DEVELOPMENT_ACCELERATION_DEFAULT_WORKFLOW_PROPOSAL_v0_1.json
          ! grep -R -E '"default_workflow_active": true|"retirement_active": true' \
            contracts/development/OVC_DEVELOPMENT_ACCELERATION_DEFAULT_WORKFLOW_ADOPTION_PROPOSAL_v0_1.md \
            schemas/development/default_workflow_adoption_profile_v0_1.schema.json \
            registries/development/OVC_DEVELOPMENT_ACCELERATION_DEFAULT_WORKFLOW_PROPOSAL_v0_1.json \
            docs/releases/development-acceleration-v0-1/da-g6 \
            scripts/development/validate_da_g6.py \
            tests/development/test_da_g6.py
