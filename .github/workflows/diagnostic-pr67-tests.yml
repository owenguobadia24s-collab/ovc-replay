name: PR 67 unit-test diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnostic-pr67-tests.yml

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests and retain full output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          PYTHONPATH=src python3 -m unittest discover -s tests -v > diagnostics/unittest.log 2>&1
          status=$?
          echo "$status" > diagnostics/exit-code.txt
          exit "$status"
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr67-unit-test-diagnostics
          path: diagnostics/
          retention-days: 7
          if-no-files-found: error
      - name: Enforce test result
        if: steps.tests.outcome != 'success'
        run: exit 1
