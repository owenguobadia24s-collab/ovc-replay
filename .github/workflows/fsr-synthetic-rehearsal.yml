name: FSR Synthetic Fresh Discovery Rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - 'fixtures/full_stack_synthetic_fresh_discovery/**'
      - 'src/ovc/opt_a/fsr_synthetic.py'
      - 'src/ovc/opt_b/**'
      - 'scripts/fsr_run_*.py'
      - 'tests/full_stack_synthetic/**'
      - '.github/workflows/fsr-synthetic-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fsr-synthetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wp1-wp3:
    name: Fresh source → OPT-A → C1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run FSR WP1-WP3 assurance
        run: python -m pytest -q tests/full_stack_synthetic/test_fsr_wp1_wp3.py
      - name: Materialise exact fresh source, OPT-A and C1 evidence
        env:
          FSR_OUT: ${{ runner.temp }}/fsr-wp1-wp3
        run: python scripts/fsr_run_wp1_wp3.py
      - name: Upload exact source and evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsr-wp1-wp3-${{ github.sha }}
          path: ${{ runner.temp }}/fsr-wp1-wp3
          if-no-files-found: error
          retention-days: 30
