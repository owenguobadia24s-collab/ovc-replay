name: GRT2 G2 qualification evidence

on:
  pull_request:
    branches: [main]
    paths:
      - "src/ovc/programme_genesis/grt_v0_2/**"
      - "scripts/governance/grt_v0_2/**"
      - "tests/governance/grt_v0_2/**"
      - "registries/governance/grt_v0_2/**"
      - "registries/implementation/grt_v0_2/**"
      - "docs/programmes/grt-v0-2/**"
      - ".github/workflows/grt2-g2-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: grt2-g2-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: GRT2 G2 live qualification evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Fetch current main for exact baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt
      - name: Run fail-closed G2 qualification harness
        id: qualify
        shell: bash
        run: |
          set +e
          PYTHONPATH=src:. python3 scripts/governance/grt_v0_2/qualify.py
          status=$?
          echo "qualification_exit=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload immutable qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: grt2-g2-qualification-evidence
          path: artifacts/grt2-g2-qualification-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce qualification result
        shell: bash
        run: |
          test "${{ steps.qualify.outputs.qualification_exit }}" -eq 0
