name: GRT2 PR998 lineage body verification

on:
  pull_request:
    branches:
      - grt2/g3-full-enforcement-replay-correction-v3-20260816

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto = require('crypto');
            const {data: pr} = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: 998});
            const m = (pr.body || '').match(/^VIT-Lineage-B64:\s*([A-Za-z0-9_\-=]+)\s*$/im);
            if (!m) core.setFailed('VIT_LINEAGE_MARKER_MISSING');
            else {
              const token = m[1];
              const sha = crypto.createHash('sha256').update(token, 'ascii').digest('hex');
              core.info(`token_length=${token.length}`);
              core.info(`token_sha256=${sha}`);
              core.info('expected_length=8448');
              core.info('expected_sha256=d903ccf9e80cebe654564fc3d1765db6a1f231dd602c509eea3c897a8df61690');
              if (token.length !== 8448 || sha !== 'd903ccf9e80cebe654564fc3d1765db6a1f231dd602c509eea3c897a8df61690') core.setFailed('VIT_LINEAGE_BODY_TOKEN_MISMATCH');
            }
