name: GRT2 G2 qualification evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: grt2-g2-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: GRT2 G2 superseding implementation qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Fetch current main for exact history
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt
      - name: Run fail-closed superseding G2 implementation qualification
        id: qualify
        shell: bash
        run: |
          set +e
          PYTHONPATH=src:. python3 scripts/governance/grt_v0_2/qualify_full_g3_replay_correction.py
          status=$?
          echo "qualification_exit=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload immutable qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: grt2-g2-full-g3-replay-correction-qualification
          path: artifacts/grt2-g2-full-g3-replay-correction-qualification.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce qualification result
        shell: bash
        run: test "${{ steps.qualify.outputs.qualification_exit }}" -eq 0

  g3-readiness:
    name: GRT2 G3 full readiness evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Fetch current main for exact historical replay
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt
      - name: Execute complete fail-closed G3 readiness programme
        id: readiness
        shell: bash
        run: |
          set +e
          PYTHONPATH=src:. python3 scripts/governance/grt_v0_2/qualify_g3_readiness.py
          status=$?
          echo "readiness_exit=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload immutable G3 readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: grt2-g3-readiness-evidence
          path: artifacts/grt2-g3-readiness-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce G3 readiness result
        shell: bash
        run: test "${{ steps.readiness.outputs.readiness_exit }}" -eq 0
