name: GRT2 WP1 CORR1 targeted assurance temp

on:
  push:
    branches:
      - corrective/grt2-wp1-postmerge-integrity-93d66c42

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run exact GRT2 WP1 targeted surface
        run: PYTHONPATH=src python -m unittest discover -s tests/governance/grt_v0_2 -p 'test_grt2_wp1*.py' -v
