name: GRT2 WP2 deterministic baseline materialiser temp

on:
  push:
    branches:
      - build/grt2-wp2-finding-baseline-debtfloor-49873c6e

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialise exact B0 ledger and pre-WP3 status
        shell: bash
        env:
          TRIGGER_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          import os
          from pathlib import Path
          from ovc.programme_genesis.grt_v0_2.debt import (
              B0_ID,
              B0_MEMBER_COUNT,
              B0_MEMBERSHIP_SHA256,
              B0_SOURCE_COMMIT,
              B0_SOURCE_TREE,
              B0_TOPOLOGY_SHA256,
              SCANNER_IDENTITY,
              baseline_member_id,
              baseline_membership_sha256,
              subject_locator_from_anomaly,
              validate_baseline_members,
              validate_debt_baseline,
          )
          from ovc.programme_genesis.grt_v0_2.serialization import canonical_json_v1_text
          from ovc.programme_genesis.grt_v0_2.wp0 import build_exact_topology, canonical_sha256 as wp0_sha

          root = Path('.').resolve()
          baseline_root = root / 'registries/governance/grt_v0_2/baseline'
          docs_root = root / 'docs/programmes/grt-v0-2/wp2'
          baseline_root.mkdir(parents=True, exist_ok=True)
          docs_root.mkdir(parents=True, exist_ok=True)

          def warning_rows(build):
              rows=[]
              for item in build['read_model'].get('anomalies', []):
                  if item.get('severity') == 'WARNING':
                      rows.append((dict(item), wp0_sha(item)))
              return sorted(rows, key=lambda pair: pair[0]['anomaly_id'])

          b0 = build_exact_topology(root, B0_SOURCE_COMMIT, verify_determinism=True)
          b0_topology = str(b0['manifest'].get('topology_sha256') or b0['read_model'].get('topology_sha256') or '')
          if b0['tree'] != B0_SOURCE_TREE or b0_topology != B0_TOPOLOGY_SHA256:
              raise SystemExit('GRT2_WP2_B0_SOURCE_IDENTITY_MISMATCH')
          source_rows = warning_rows(b0)
          if len(source_rows) != B0_MEMBER_COUNT:
              raise SystemExit(f'GRT2_WP2_B0_COUNT_MISMATCH:{len(source_rows)}')

          records=[]
          for ordinal,(anomaly,payload_hash) in enumerate(source_rows, start=1):
              records.append({
                  'schema':'grt-baseline-member-record/v0.2',
                  'baseline_member_id':baseline_member_id(anomaly['anomaly_id'], payload_hash),
                  'ordinal':ordinal,
                  'original_GRT_anomaly':anomaly['anomaly_id'],
                  'original_anomaly_code':anomaly['anomaly_code'],
                  'original_subject_locator':subject_locator_from_anomaly(anomaly),
                  'payload_hash':payload_hash,
                  'original_scanner_identity':SCANNER_IDENTITY,
                  'mapped_finding_id':None,
                  'mapping_status':'PENDING_WP3_ARTIFACT_GRAPH',
                  'disposition':None,
                  'lineage_refs':[],
              })
          validate_baseline_members(records)
          if baseline_membership_sha256(records) != B0_MEMBERSHIP_SHA256:
              raise SystemExit('GRT2_WP2_B0_MEMBERSHIP_MISMATCH')

          ledger = baseline_root / 'GRT_B0_BASELINE_MEMBERS_v0_1.jsonl'
          ledger.write_text(''.join(canonical_json_v1_text(record)+'\n' for record in records), encoding='utf-8')

          baseline={
              'schema':'grt-debt-baseline/v0.2',
              'baseline_id':B0_ID,
              'source_commit':B0_SOURCE_COMMIT,
              'source_tree_hash':B0_SOURCE_TREE,
              'scanner_id':'GRT.V0.1',
              'scanner_version':SCANNER_IDENTITY,
              'raw_warning_count':B0_MEMBER_COUNT,
              'baseline_member_ids':[record['baseline_member_id'] for record in records],
              'raw_topology_evidence_hash':'88abf0dcb9cceeb0299d354d8a19804c6bbee3bbfdc38f8ef3847402d1c97e5f',
              'source_topology_sha256':B0_TOPOLOGY_SHA256,
              'constitution_mapping_status':'PENDING_WP3_ARTIFACT_GRAPH',
              'created_from_audit':True,
              'authority_effect':'NONE_HISTORICAL_BASELINE',
          }
          validate_debt_baseline(baseline, records)
          (baseline_root / 'GRT_DEBT_BASELINE_B0.json').write_text(canonical_json_v1_text(baseline)+'\n', encoding='utf-8')

          migration={
              'schema':'grt-b0-to-v0-2-migration/v0.1',
              'programme_id':'OVC-GRT-V0.2-REPOSITORY-CONSTITUTION-CONTINUOUS-CONFORMANCE',
              'baseline_id':'B0',
              'source_commit':B0_SOURCE_COMMIT,
              'source_tree':B0_SOURCE_TREE,
              'source_topology_sha256':B0_TOPOLOGY_SHA256,
              'baseline_membership_sha256':B0_MEMBERSHIP_SHA256,
              'mapping_generation':'PRE_WP3_ARTIFACT_GRAPH',
              'mapping_status':'PENDING_WP3_ARTIFACT_GRAPH',
              'member_count':B0_MEMBER_COUNT,
              'mapped_count':0,
              'pending_count':B0_MEMBER_COUNT,
              'ambiguous_count':0,
              'unmapped_no_active_rule_count':0,
              'entries':[
                  {
                      'baseline_member_id':record['baseline_member_id'],
                      'original_GRT_anomaly':record['original_GRT_anomaly'],
                      'mapped_finding_id':None,
                      'mapping_status':'PENDING_WP3_ARTIFACT_GRAPH',
                      'lineage_refs':[],
                  }
                  for record in records
              ],
              'zero_mapping_claim_prohibited':True,
              'authority_effect':'NONE_LINEAGE_PREPARATION_ONLY',
          }
          (baseline_root / 'GRT_B0_TO_V0_2_MIGRATION_v0_1.json').write_text(canonical_json_v1_text(migration)+'\n', encoding='utf-8')

          current_commit='49873c6e4efdb91d839b10b89ceb5f8fe76ee78d'
          current=build_exact_topology(root, current_commit, verify_determinism=False)
          current_rows=warning_rows(current)
          current_topology=str(current['manifest'].get('topology_sha256') or current['read_model'].get('topology_sha256') or '')
          (baseline_root / 'GRT_LATE_PREEXISTING_FINDINGS.jsonl').write_text('', encoding='utf-8')
          (baseline_root / 'GRT_PRE_G3_TRANSITION_DEBT.jsonl').write_text('', encoding='utf-8')

          status={
              'schema':'ovc-grt2-wp2-current-classification-status/v1',
              'programme_id':'OVC-GRT-V0.2-REPOSITORY-CONSTITUTION-CONTINUOUS-CONFORMANCE',
              'packet_id':'GRT2-WP2',
              'source_commit':current_commit,
              'source_tree':current['tree'],
              'raw_warning_count':len(current_rows),
              'source_topology_sha256':current_topology,
              'late_discovered_register':'registries/governance/grt_v0_2/baseline/GRT_LATE_PREEXISTING_FINDINGS.jsonl',
              'transition_debt_ledger':'registries/governance/grt_v0_2/baseline/GRT_PRE_G3_TRANSITION_DEBT.jsonl',
              'late_discovered_record_count':0,
              'transition_debt_record_count':0,
              'classification_complete':False,
              'classification_status':'NOT_EVALUABLE_UNTIL_WP3A_V0_2_SCANNER_AND_ARTIFACT_GRAPH',
              'empty_ledgers_are_not_zero_debt_evidence':True,
              'zero_transition_debt_claim_prohibited':True,
              'authority_effect':'NONE_PRE_G2_OBSERVATION_ONLY',
          }
          (docs_root / 'GRT2_WP2_CURRENT_CLASSIFICATION_STATUS.json').write_text(canonical_json_v1_text(status)+'\n', encoding='utf-8')

          source_receipt={
              'schema':'ovc-grt2-wp2-source-evidence-receipt/v1',
              'programme_id':'OVC-GRT-V0.2-REPOSITORY-CONSTITUTION-CONTINUOUS-CONFORMANCE',
              'packet_id':'GRT2-WP2',
              'baseline_main_commit':current_commit,
              'baseline_main_tree':current['tree'],
              'materialisation':{
                  'workflow_run_id':int(os.environ['RUN_ID']),
                  'workflow_run_attempt':int(os.environ['RUN_ATTEMPT']),
                  'trigger_commit':os.environ['TRIGGER_SHA'],
                  'method':'EXACT_SOURCE_REPLAY_AND_SELF_DELETING_BRANCH_SCOPED_MATERIALISER',
                  'result':'PASS',
              },
              'b0':{
                  'source_commit':B0_SOURCE_COMMIT,
                  'source_tree':B0_SOURCE_TREE,
                  'topology_sha256':B0_TOPOLOGY_SHA256,
                  'raw_warning_count':B0_MEMBER_COUNT,
                  'membership_sha256':B0_MEMBERSHIP_SHA256,
                  'compact_reproduction_file_sha256':'88abf0dcb9cceeb0299d354d8a19804c6bbee3bbfdc38f8ef3847402d1c97e5f',
                  'compact_reproduction_artifact_id':9179376890,
              },
              'current_census':{
                  'source_commit':current_commit,
                  'source_tree':current['tree'],
                  'topology_sha256':current_topology,
                  'raw_warning_count':len(current_rows),
                  'classification_status':status['classification_status'],
                  'zero_transition_debt_claim_prohibited':True,
              },
              'authority_effect':'NONE_READ_ONLY_SOURCE_EVIDENCE',
          }
          (docs_root / 'GRT2_WP2_SOURCE_EVIDENCE_RECEIPT.json').write_text(canonical_json_v1_text(source_receipt)+'\n', encoding='utf-8')

          merge_receipt={
              'schema':'ovc-grt2-wp1-merge-receipt/v1',
              'programme_id':'OVC-GRT-V0.2-REPOSITORY-CONSTITUTION-CONTINUOUS-CONFORMANCE',
              'packet_id':'GRT2-WP1',
              'pull_request':754,
              'merge_commit':'49873c6e4efdb91d839b10b89ceb5f8fe76ee78d',
              'merge_tree':'059baf176bbc342af42d4d872d3d1bc8af877992',
              'decision':'PASS',
              'authority_effect':'NONE_PRE_ENFORCEMENT',
              'next_packet':'GRT2-WP2',
          }
          (docs_root / 'GRT2_WP1_MERGE_RECEIPT.json').write_text(canonical_json_v1_text(merge_receipt)+'\n', encoding='utf-8')
          PY

          rm .github/workflows/grt2-wp2-materialise-records-temp.yml
          expected=$(cat <<'EOF'
.github/workflows/grt2-wp2-materialise-records-temp.yml
docs/programmes/grt-v0-2/wp2/GRT2_WP1_MERGE_RECEIPT.json
docs/programmes/grt-v0-2/wp2/GRT2_WP2_CURRENT_CLASSIFICATION_STATUS.json
docs/programmes/grt-v0-2/wp2/GRT2_WP2_SOURCE_EVIDENCE_RECEIPT.json
registries/governance/grt_v0_2/baseline/GRT_B0_BASELINE_MEMBERS_v0_1.jsonl
registries/governance/grt_v0_2/baseline/GRT_B0_TO_V0_2_MIGRATION_v0_1.json
registries/governance/grt_v0_2/baseline/GRT_DEBT_BASELINE_B0.json
registries/governance/grt_v0_2/baseline/GRT_LATE_PREEXISTING_FINDINGS.jsonl
registries/governance/grt_v0_2/baseline/GRT_PRE_G3_TRANSITION_DEBT.jsonl
EOF
          )
          actual=$(git status --short | sed 's/^...//' | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git config user.name "ovc-grt2-materialiser"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/grt2-wp2-materialise-records-temp.yml docs/programmes/grt-v0-2/wp2 registries/governance/grt_v0_2/baseline
          git commit -m "GRT2-WP2: materialise immutable B0 ledger and source evidence"
          git push origin HEAD:build/grt2-wp2-finding-baseline-debtfloor-49873c6e
