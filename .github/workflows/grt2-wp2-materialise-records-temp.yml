name: GRT2 WP2 deterministic baseline materialiser temp

on:
  push:
    branches:
      - build/grt2-wp2-finding-baseline-debtfloor-49873c6e

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialise exact B0 ledger and pre-WP3 status
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/governance/grt_v0_2/materialise_wp2_baseline.py \
            --repository-root . \
            --baseline-main 49873c6e4efdb91d839b10b89ceb5f8fe76ee78d \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --trigger-commit "${GITHUB_SHA}"
      - name: Commit bounded records and remove temporary writer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/grt2-wp2-materialise-records-temp.yml
          unexpected=$(git status --porcelain | awk '{print $2}' | grep -Ev '^(.github/workflows/grt2-wp2-materialise-records-temp.yml|docs/programmes/grt-v0-2/wp2/GRT2_WP1_MERGE_RECEIPT.json|docs/programmes/grt-v0-2/wp2/GRT2_WP2_CURRENT_CLASSIFICATION_STATUS.json|docs/programmes/grt-v0-2/wp2/GRT2_WP2_SOURCE_EVIDENCE_RECEIPT.json|registries/governance/grt_v0_2/baseline/GRT_B0_BASELINE_MEMBERS_v0_1.jsonl|registries/governance/grt_v0_2/baseline/GRT_B0_TO_V0_2_MIGRATION_v0_1.json|registries/governance/grt_v0_2/baseline/GRT_DEBT_BASELINE_B0.json|registries/governance/grt_v0_2/baseline/GRT_LATE_PREEXISTING_FINDINGS.jsonl|registries/governance/grt_v0_2/baseline/GRT_PRE_G3_TRANSITION_DEBT.jsonl)$' || true)
          test -z "$unexpected"
          git config user.name "ovc-grt2-materialiser"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/grt2-wp2-materialise-records-temp.yml docs/programmes/grt-v0-2/wp2 registries/governance/grt_v0_2/baseline
          git commit -m "GRT2-WP2: materialise immutable B0 ledger and source evidence"
          git push origin HEAD:build/grt2-wp2-finding-baseline-debtfloor-49873c6e
