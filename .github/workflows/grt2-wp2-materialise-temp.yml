name: GRT2 WP2 deterministic materialisation temp
on:
  push:
    branches: [build/grt2-wp2-finding-baseline-debtfloor-605d2ce1]
permissions:
  contents: write
jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Materialise exact WP2 records and tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from ovc.programme_genesis.grt_v0_2.debt import *
          from ovc.programme_genesis.grt_v0_2.serialization import canonical_json_v1_text
          from ovc.programme_genesis.grt_v0_2.wp0 import build_exact_topology, canonical_sha256 as wp0_sha
          root=Path('.').resolve(); base=root/'registries/governance/grt_v0_2/baseline'; docs=root/'docs/programmes/grt-v0-2/wp2'; fix=root/'fixtures/governance/grt_v0_2/wp2'; tests=root/'tests/governance/grt_v0_2'
          for p in (base,docs,fix,tests): p.mkdir(parents=True,exist_ok=True)
          def warnings(build):
              out=[]
              for item in build['read_model'].get('anomalies',[]):
                  if item.get('severity')=='WARNING': out.append((dict(item),wp0_sha(item)))
              return sorted(out,key=lambda pair:pair[0]['anomaly_id'])
          b0=build_exact_topology(root,B0_SOURCE_COMMIT,verify_determinism=True)
          topo=str(b0['manifest'].get('topology_sha256') or b0['read_model'].get('topology_sha256') or '')
          assert b0['tree']==B0_SOURCE_TREE and topo==B0_TOPOLOGY_SHA256
          src=warnings(b0); assert len(src)==569
          records=[]
          for ordinal,(a,h) in enumerate(src,1):
              records.append({'schema':'grt-baseline-member-record/v0.2','baseline_member_id':baseline_member_id(a['anomaly_id'],h),'ordinal':ordinal,'original_GRT_anomaly':a['anomaly_id'],'original_anomaly_code':a['anomaly_code'],'original_subject_locator':subject_locator_from_anomaly(a),'payload_hash':h,'original_scanner_identity':SCANNER_IDENTITY,'mapped_finding_id':None,'mapping_status':'PENDING_WP3_ARTIFACT_GRAPH','disposition':None,'lineage_refs':[]})
          validate_baseline_members(records); assert baseline_membership_sha256(records)==B0_MEMBERSHIP_SHA256
          (base/'GRT_B0_BASELINE_MEMBERS_v0_1.jsonl').write_text(''.join(canonical_json_v1_text(r)+'\n' for r in records),encoding='utf-8')
          baseline={'schema':'grt-debt-baseline/v0.2','baseline_id':'B0','source_commit':B0_SOURCE_COMMIT,'source_tree_hash':B0_SOURCE_TREE,'scanner_id':'GRT.V0.1','scanner_version':SCANNER_IDENTITY,'raw_warning_count':569,'baseline_member_ids':[r['baseline_member_id'] for r in records],'raw_topology_evidence_hash':'88abf0dcb9cceeb0299d354d8a19804c6bbee3bbfdc38f8ef3847402d1c97e5f','source_topology_sha256':B0_TOPOLOGY_SHA256,'constitution_mapping_status':'PENDING_WP3_ARTIFACT_GRAPH','created_from_audit':True,'authority_effect':'NONE_HISTORICAL_BASELINE'}
          validate_debt_baseline(baseline,records); (base/'GRT_DEBT_BASELINE_B0.json').write_text(canonical_json_v1_text(baseline)+'\n',encoding='utf-8')
          migration={'schema':'grt-b0-to-v0-2-migration/v0.1','programme_id':'OVC-GRT-V0.2-REPOSITORY-CONSTITUTION-CONTINUOUS-CONFORMANCE','baseline_id':'B0','source_commit':B0_SOURCE_COMMIT,'source_tree':B0_SOURCE_TREE,'source_topology_sha256':B0_TOPOLOGY_SHA256,'baseline_membership_sha256':B0_MEMBERSHIP_SHA256,'mapping_generation':'PRE_WP3_ARTIFACT_GRAPH','mapping_status':'PENDING_WP3_ARTIFACT_GRAPH','member_count':569,'mapped_count':0,'pending_count':569,'ambiguous_count':0,'unmapped_no_active_rule_count':0,'entries':[{'baseline_member_id':r['baseline_member_id'],'original_GRT_anomaly':r['original_GRT_anomaly'],'mapped_finding_id':None,'mapping_status':'PENDING_WP3_ARTIFACT_GRAPH','lineage_refs':[]} for r in records],'zero_mapping_claim_prohibited':True,'authority_effect':'NONE_LINEAGE_PREPARATION_ONLY'}
          (base/'GRT_B0_TO_V0_2_MIGRATION_v0_1.json').write_text(canonical_json_v1_text(migration)+'\n',encoding='utf-8')
          (base/'GRT_LATE_PREEXISTING_FINDINGS.jsonl').write_text('',encoding='utf-8'); (base/'GRT_PRE_G3_TRANSITION_DEBT.jsonl').write_text('',encoding='utf-8')
          current_commit='605d2ce10c361fd05dc5728171e3361a91f3d1f5'; current=build_exact_topology(root,current_commit,verify_determinism=False); current_rows=warnings(current); current_topo=str(current['manifest'].get('topology_sha256') or current['read_model'].get('topology_sha256') or '')
          status={'schema':'ovc-grt2-wp2-current-classification-status/v1','programme_id':'OVC-GRT-V0.2-REPOSITORY-CONSTITUTION-CONTINUOUS-CONFORMANCE','packet_id':'GRT2-WP2','source_commit':current_commit,'source_tree':current['tree'],'raw_warning_count':len(current_rows),'source_topology_sha256':current_topo,'late_discovered_register':'registries/governance/grt_v0_2/baseline/GRT_LATE_PREEXISTING_FINDINGS.jsonl','transition_debt_ledger':'registries/governance/grt_v0_2/baseline/GRT_PRE_G3_TRANSITION_DEBT.jsonl','late_discovered_record_count':0,'transition_debt_record_count':0,'classification_complete':False,'classification_status':'NOT_EVALUABLE_UNTIL_WP3A_V0_2_SCANNER_AND_ARTIFACT_GRAPH','empty_ledgers_are_not_zero_debt_evidence':True,'zero_transition_debt_claim_prohibited':True,'authority_effect':'NONE_PRE_G2_OBSERVATION_ONLY'}
          (docs/'GRT2_WP2_CURRENT_CLASSIFICATION_STATUS.json').write_text(canonical_json_v1_text(status)+'\n',encoding='utf-8')
          source={'schema':'ovc-grt2-wp2-source-evidence-receipt/v1','programme_id':status['programme_id'],'packet_id':'GRT2-WP2','baseline_main_commit':current_commit,'baseline_main_tree':current['tree'],'b0':{'source_commit':B0_SOURCE_COMMIT,'source_tree':B0_SOURCE_TREE,'topology_sha256':B0_TOPOLOGY_SHA256,'raw_warning_count':569,'membership_sha256':B0_MEMBERSHIP_SHA256,'compact_reproduction_file_sha256':'88abf0dcb9cceeb0299d354d8a19804c6bbee3bbfdc38f8ef3847402d1c97e5f','compact_reproduction_artifact_id':9179376890},'current_census':{'source_commit':current_commit,'source_tree':current['tree'],'topology_sha256':current_topo,'raw_warning_count':len(current_rows),'classification_status':status['classification_status'],'zero_transition_debt_claim_prohibited':True},'authority_effect':'NONE_READ_ONLY_SOURCE_EVIDENCE'}
          (docs/'GRT2_WP2_SOURCE_EVIDENCE_RECEIPT.json').write_text(canonical_json_v1_text(source)+'\n',encoding='utf-8')
          merge={'schema':'ovc-grt2-wp1-corr1-merge-receipt/v1','programme_id':status['programme_id'],'packet_id':'GRT2-WP1-CORR1','pull_request':763,'merge_commit':current_commit,'merge_tree':'6cfbe073fe2f9c1ca669fad979e207251a9e0e94','decision':'PASS','authority_effect':'NONE_INTEGRITY_CORRECTION','next_packet':'GRT2-WP2'}
          (docs/'GRT2_WP1_CORR1_MERGE_RECEIPT.json').write_text(canonical_json_v1_text(merge)+'\n',encoding='utf-8')
          fixture={'schema':'ovc-grt2-wp2-debt-mechanics-fixture/v1','extent_cases':[{'previous':{'count':2,'bytes':10},'current':{'count':2,'bytes':10},'expected':'UNCHANGED'},{'previous':{'count':2,'bytes':10},'current':{'count':1,'bytes':10},'expected':'REDUCED'},{'previous':{'count':2,'bytes':10},'current':{'count':3,'bytes':10},'expected':'EXPANDED'},{'previous':{'count':2,'bytes':10},'current':{'count':1,'bytes':11},'expected':'MATERIAL_CHANGED'}]}
          (fix/'debt_mechanics_fixture.json').write_text(canonical_json_v1_text(fixture)+'\n',encoding='utf-8')
          test='''from __future__ import annotations\nimport json, unittest\nfrom pathlib import Path\nfrom ovc.programme_genesis.grt_v0_2.debt import *\nROOT=Path(__file__).resolve().parents[3]; BASE=ROOT/"registries/governance/grt_v0_2/baseline"; DOCS=ROOT/"docs/programmes/grt-v0-2/wp2"\ndef rows(): return [json.loads(x) for x in (BASE/"GRT_B0_BASELINE_MEMBERS_v0_1.jsonl").read_text(encoding="utf-8").splitlines() if x]\nclass GRT2WP2Tests(unittest.TestCase):\n def test_b0_exact(self):\n  data=rows(); self.assertEqual(len(data),569); validate_baseline_members(data); self.assertEqual(baseline_membership_sha256(data),B0_MEMBERSHIP_SHA256); self.assertEqual([r["ordinal"] for r in data],list(range(1,570))); self.assertTrue(all(r["mapping_status"]=="PENDING_WP3_ARTIFACT_GRAPH" and r["mapped_finding_id"] is None and r["disposition"] is None for r in data))\n def test_finding_identity_and_extent(self):\n  a=finding_id("GRT-R001","repo://A","PRIMARY",None); b=finding_id("GRT-R001","repo://A","PRIMARY",None); self.assertEqual(a,b); self.assertEqual(compare_debt_extent({"x":1},{"x":1}),"UNCHANGED"); self.assertEqual(compare_debt_extent({"x":2},{"x":1}),"REDUCED"); self.assertEqual(compare_debt_extent({"x":1},{"x":2}),"EXPANDED"); self.assertEqual(compare_debt_extent({"x":2,"y":1},{"x":1,"y":2}),"MATERIAL_CHANGED")\n def test_admission_and_lineage(self):\n  self.assertEqual(classify_debt_transition(predecessor_state="ABSENT",candidate_state="ACTIONABLE"),("NEW_ACTIONABLE","FAIL")); self.assertEqual(classify_debt_transition(predecessor_state="GRANDFATHERED",candidate_state="ACTIONABLE",extent_result="REDUCED"),("BASELINE_REDUCED","PASS")); f1=finding_id("GRT-R001","repo://A","PRIMARY"); f2=finding_id("GRT-R001","repo://B","PRIMARY"); line=make_lineage([f1],[f2],"MOVE",["proof"]); validate_lineage(line)\n def test_floor_mechanics_without_gen0_activation(self):\n  c=json.loads((ROOT/"registries/governance/grt_v0_2/GRT_REPOSITORY_CONSTITUTION_v0_2.json").read_text()); f=propose_debt_floor(generation=0,predecessor_commit="1"*40,predecessor_tree="2"*40,constitution_hash=c["canonical_hash"],open_grandfathered_findings=["F1"]); validate_debt_floor(f); self.assertFalse((BASE/"GRT_DEBT_FLOOR_G0.json").exists())\n def test_current_classification_does_not_overclaim(self):\n  s=json.loads((DOCS/"GRT2_WP2_CURRENT_CLASSIFICATION_STATUS.json").read_text()); self.assertFalse(s["classification_complete"]); self.assertTrue(s["zero_transition_debt_claim_prohibited"]); self.assertEqual((BASE/"GRT_LATE_PREEXISTING_FINDINGS.jsonl").read_text(),""); self.assertEqual((BASE/"GRT_PRE_G3_TRANSITION_DEBT.jsonl").read_text(),"")\nif __name__=="__main__": unittest.main()\n'''
          (tests/'test_grt2_wp2.py').write_text(test,encoding='utf-8')
          print(json.dumps({'b0':569,'current':len(current_rows),'current_topology':current_topo},sort_keys=True))
          PY
          rm .github/workflows/grt2-wp2-materialise-temp.yml
          git config user.name "ovc-grt2-wp2"; git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/grt2-wp2-materialise-temp.yml registries/governance/grt_v0_2/baseline docs/programmes/grt-v0-2/wp2 fixtures/governance/grt_v0_2/wp2 tests/governance/grt_v0_2/test_grt2_wp2.py
          git commit -m "GRT2-WP2: materialise immutable B0 ledger and debt evidence"
          git push origin HEAD:build/grt2-wp2-finding-baseline-debtfloor-605d2ce1
