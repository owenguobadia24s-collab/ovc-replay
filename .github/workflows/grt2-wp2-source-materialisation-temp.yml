name: GRT2 WP2 exact-source materialisation temp

on:
  push:
    branches:
      - build/grt2-wp2-finding-baseline-debtfloor-49873c6e

permissions:
  contents: read

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce exact B0 and current warning payloads
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from ovc.programme_genesis.grt_v0_2.wp0 import (
              B0_SOURCE_COMMIT,
              B0_SOURCE_TREE,
              B0_TOPOLOGY_SHA256,
              B0_WARNING_COUNT,
              build_exact_topology,
              canonical_sha256,
              resolve_tree,
          )
          root = Path('.').resolve()
          output = Path('artifacts/grt2-wp2-source-materialisation')
          output.mkdir(parents=True, exist_ok=True)

          def warnings(build):
              rows=[]
              for item in build['read_model'].get('anomalies', []):
                  if item.get('severity') == 'WARNING':
                      row=dict(item)
                      row['canonical_payload_sha256']=canonical_sha256(item)
                      rows.append(row)
              return sorted(rows, key=lambda r: r['anomaly_id'])

          b0 = build_exact_topology(root, B0_SOURCE_COMMIT, verify_determinism=True)
          if b0['tree'] != B0_SOURCE_TREE:
              raise SystemExit('B0_SOURCE_TREE_MISMATCH')
          b0_topology = str(b0['manifest'].get('topology_sha256') or b0['read_model'].get('topology_sha256') or '')
          if b0_topology != B0_TOPOLOGY_SHA256:
              raise SystemExit('B0_TOPOLOGY_SHA256_MISMATCH')
          b0_rows = warnings(b0)
          if len(b0_rows) != B0_WARNING_COUNT:
              raise SystemExit(f'B0_WARNING_COUNT_MISMATCH:{len(b0_rows)}')

          current_commit = '49873c6e4efdb91d839b10b89ceb5f8fe76ee78d'
          current = build_exact_topology(root, current_commit, verify_determinism=False)
          current_rows = warnings(current)

          payload = {
              'schema':'ovc-grt2-wp2-exact-source-materialisation/v1',
              'authority_effect':'NONE_READ_ONLY_SOURCE_EVIDENCE',
              'b0':{
                  'source_commit':B0_SOURCE_COMMIT,
                  'source_tree':B0_SOURCE_TREE,
                  'topology_sha256':b0_topology,
                  'raw_warning_count':len(b0_rows),
                  'warnings':b0_rows,
              },
              'current':{
                  'source_commit':current_commit,
                  'source_tree':resolve_tree(root,current_commit),
                  'topology_sha256':str(current['manifest'].get('topology_sha256') or current['read_model'].get('topology_sha256') or ''),
                  'raw_warning_count':len(current_rows),
                  'warnings':current_rows,
              },
          }
          (output/'GRT2_WP2_EXACT_SOURCE_MATERIALISATION.json').write_text(
              json.dumps(payload, sort_keys=True, separators=(',',':'), ensure_ascii=False),
              encoding='utf-8'
          )
          print(json.dumps({'b0':len(b0_rows),'current':len(current_rows),'b0_topology':b0_topology},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: grt2-wp2-exact-source-materialisation
          path: artifacts/grt2-wp2-source-materialisation/GRT2_WP2_EXACT_SOURCE_MATERIALISATION.json
          retention-days: 1
          if-no-files-found: error
