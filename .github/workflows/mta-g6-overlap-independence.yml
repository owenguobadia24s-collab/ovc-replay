name: Market Translation Audit MTA-G6 overlap independence

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/research_operations/mta/OVC_MTA_OVERLAP_INDEPENDENCE_AUDIT_CONTRACT_v0_1.md"
      - "src/ovc/research_operations/mta/overlap_independence_audit.py"
      - "scripts/research_operations/validate_mta_wp6.py"
      - "tests/research_operations/mta/test_mta_wp6.py"
      - "docs/releases/market-translation-audit-v0-2/mta-g6/**"
      - "docs/releases/market-translation-audit-v0-2/mta-g5/MTA_G5_MERGE_RECEIPT.json"
      - "registries/research_operations/mta/OVC_MTA_PROGRAMME_STATE_v0_2.json"
      - ".github/workflows/mta-g6-overlap-independence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mta-g6:
    name: mta-g6
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'MTA-WP6')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {show-progress: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Validate compact overlap audit
        run: PYTHONPATH=src python -u scripts/research_operations/validate_mta_wp6.py
      - name: Focused MTA-WP6 tests
        run: PYTHONPATH=src python -m unittest discover -s tests/research_operations/mta -p 'test_mta_wp6.py' -v
      - name: Retained MTA assurance
        run: |
          PYTHONPATH=src python -u scripts/research_operations/validate_mta_wp5.py
          PYTHONPATH=src python -u scripts/research_operations/validate_mta_wp4.py
          PYTHONPATH=src python -u scripts/research_operations/validate_mta_wp3.py
          PYTHONPATH=src python -u scripts/research_operations/validate_mta_wp2.py
          PYTHONPATH=src python -u scripts/research_operations/validate_mta_wp1.py
          PYTHONPATH=src python -u scripts/research_operations/validate_mta_g0.py
      - name: Complete repository suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Assert audit-only authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('docs/releases/market-translation-audit-v0-2/mta-g6/MTA_WP6_OVERLAP_INDEPENDENCE_AUDIT_REFERENCE.json').read_text())
          assert v['occurrence_count']==1779
          assert v['variants_summary']['PRIMARY_OVERLAP_PLUS_1']['cluster_count']==20
          assert all(x==0 for x in v['mismatch_counts'].values())
          assert v['cluster_semantic_promotion']=='DENIED'
          assert v['validation_consumption']=='DENIED'
          PY
