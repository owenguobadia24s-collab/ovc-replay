name: OPT-A A2-G3 role release freeze

on:
  push:
    branches:
      - build/opt-a-v2-role-release-freeze
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ovc-legacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: pytest -q tests/opt_a/test_a2_g3_release_freeze.py

  freeze-role-releases:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .

      - name: Download exact A2-G2 reviewed workspaces
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30178480623
          pattern: wp5-*-workspace*
          path: a2-g2-workspaces
          merge-multiple: false

      - name: Normalize reviewed workspace roots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reviewed-workspaces
          cp -a a2-g2-workspaces/wp5-discovery-workspace/. reviewed-workspaces/discovery/
          cp -a a2-g2-workspaces/wp5-development-workspace/. reviewed-workspaces/development/
          cp -a a2-g2-workspaces/wp5-validation-workspace-locked/. reviewed-workspaces/validation/
          test -f reviewed-workspaces/discovery/workspace-manifest.json
          test -f reviewed-workspaces/development/workspace-manifest.json
          test -f reviewed-workspaces/validation/workspace-manifest.json

      - name: Freeze exact reviewed role releases
        run: |
          python scripts/opt_a/freeze_role_releases.py \
            --workspaces-root reviewed-workspaces \
            --output-root a2-g3-releases \
            --source-commit "$SOURCE_COMMIT"

      - name: Assert freeze and authority boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('a2-g3-releases/A2_G3_FREEZE_REPORT.json').read_text())
          assert report['result'] == 'PASS'
          assert set(report['roles']) == {'DISCOVERY', 'DEVELOPMENT', 'VALIDATION'}
          assert report['authority']['role_release_freeze'] == 'COMPLETE_LOCAL_ARTIFACT_ONLY'
          assert report['authority']['r2_publication'] == 'DENIED'
          assert report['authority']['selector_activation'] == 'DENIED'
          assert report['authority']['validation_consumption'] == 'LOCKED_UNCONSUMED'
          assert report['authority']['opt_b_handoff'] == 'DENIED'
          assert report['authority']['market'] == 'NONE'
          for role, receipt in report['roles'].items():
              assert receipt['result'] == 'PASS'
              assert receipt['quarantine_disposition'] == 'RETAIN_TRACE_AND_EXCLUDE_FROM_ACCEPTED_OBSERVATIONS'
              root = Path(receipt['release_root'])
              assert (root / 'release-descriptor.json').is_file()
              assert (root / 'release-inventory.json').is_file()
              assert (root / 'freeze-receipt.json').is_file()
              assert (root / 'QA' / 'quarantine-ledger.jsonl').is_file()
          PY

      - name: Upload frozen discovery release
        uses: actions/upload-artifact@v4
        with:
          name: a2-g3-opt-a-gbpusd-discovery-2021-2023-v2
          path: a2-g3-releases/OPT-A.GBPUSD.DISCOVERY.2021_2023.v2
          retention-days: 30
          compression-level: 6

      - name: Upload frozen development release
        uses: actions/upload-artifact@v4
        with:
          name: a2-g3-opt-a-gbpusd-development-2024-v2
          path: a2-g3-releases/OPT-A.GBPUSD.DEVELOPMENT.2024.v2
          retention-days: 30
          compression-level: 6

      - name: Upload frozen locked validation release
        uses: actions/upload-artifact@v4
        with:
          name: a2-g3-opt-a-gbpusd-validation-2025-v2-locked
          path: a2-g3-releases/OPT-A.GBPUSD.VALIDATION.2025.v2
          retention-days: 30
          compression-level: 6

      - name: Upload compact A2-G3 freeze report
        uses: actions/upload-artifact@v4
        with:
          name: a2-g3-role-release-freeze-report
          path: a2-g3-releases/A2_G3_FREEZE_REPORT.json
          retention-days: 90
