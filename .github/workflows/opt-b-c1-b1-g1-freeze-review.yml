name: OPT-B.C1 B1-G1 candidate freeze review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  packet-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v

  exact-candidate-review:
    needs: packet-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_ARTIFACT_ID: '8626942276'
      CANDIDATE_ARCHIVE_SHA256: fb52ea4f84fa7c1d79c9c524470d6722ab82b09a5ed4d4f0278fda4d330eabfc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact WP4 candidate archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output c1-wp4-candidate.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip"
          echo "${CANDIDATE_ARCHIVE_SHA256}  c1-wp4-candidate.zip" | sha256sum --check --strict
          mkdir candidate
          unzip -q c1-wp4-candidate.zip -d candidate

      - name: Verify every candidate byte and record identity
        run: |
          python scripts/opt_b/verify_c1_b1_g1_candidate.py \
            --artifact-root candidate \
            --archive c1-wp4-candidate.zip \
            --output b1-g1/B1_G1_VERIFICATION_RECEIPT.json
          cmp \
            docs/releases/opt-b-c1-v2/b1-g1/B1_G1_VERIFICATION_RECEIPT.json \
            b1-g1/B1_G1_VERIFICATION_RECEIPT.json

      - name: Upload reproducible B1-G1 verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: c1-b1-g1-exact-candidate-verification
          path: b1-g1/B1_G1_VERIFICATION_RECEIPT.json
          retention-days: 90
