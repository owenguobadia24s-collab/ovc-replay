name: OPT-B.C1 B1-G2 publication readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  packet-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository tests
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m unittest discover -s tests -v > unit-tests.log 2>&1
          status=$?
          tail -n 160 unit-tests.log
          exit $status

  exact-frozen-release-review:
    needs: packet-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RCLONE_CONFIG_OVC_R2_TYPE: s3
      RCLONE_CONFIG_OVC_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_OVC_R2_ACCESS_KEY_ID: ${{ secrets.RCLONE_CONFIG_OVC_R2_ACCESS_KEY_ID || secrets.OVC_R2_ACCESS_KEY_ID || secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_OVC_R2_SECRET_ACCESS_KEY: ${{ secrets.RCLONE_CONFIG_OVC_R2_SECRET_ACCESS_KEY || secrets.OVC_R2_SECRET_ACCESS_KEY || secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_OVC_R2_ENDPOINT: https://28bc1b0403ef3fdf5f08093abe3df9f4.r2.cloudflarestorage.com
      RCLONE_CONFIG_OVC_R2_REGION: auto
      RCLONE_CONFIG_OVC_R2_ACL: private
      RCLONE_CONFIG_OVC_R2_NO_CHECK_BUCKET: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rclone
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone
      - name: Require configured R2 credentials
        run: |
          set -euo pipefail
          test -n "${RCLONE_CONFIG_OVC_R2_ACCESS_KEY_ID:-}" || { echo "::error::Missing R2 access-key secret"; exit 1; }
          test -n "${RCLONE_CONFIG_OVC_R2_SECRET_ACCESS_KEY:-}" || { echo "::error::Missing R2 secret-key secret"; exit 1; }
          rclone listremotes | grep -Fx 'ovc_r2:'
      - name: Download exact WP4F Discovery release
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30187276514
          name: c1-opt-b-c1-gbpusd-discovery-2021-2023-v1-frozen
          path: b1-g2/discovery
      - name: Download exact WP4F Development release
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30187276514
          name: c1-opt-b-c1-gbpusd-development-2024-v1-frozen
          path: b1-g2/development
      - name: Download exact WP4F freeze report
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 30187276514
          name: c1-wp4f-freeze-verification-report
          path: b1-g2/report
      - name: Confirm target R2 namespaces are collision-free
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p b1-g2/output
          : > b1-g2/output/remote-collision-preflight.txt
          while IFS='|' read -r release manifest; do
            prefix="canonical/releases/${release}/${manifest}/"
            listing=$(rclone lsf --recursive --s3-no-check-bucket "ovc_r2:${prefix}" 2>/dev/null || true)
            if [ -n "$listing" ]; then
              echo "::error::Remote collision under ${prefix}"
              printf '%s\n' "$listing"
              exit 1
            fi
            printf '%s ABSENT\n' "$prefix" | tee -a b1-g2/output/remote-collision-preflight.txt
          done <<'EOF'
          OPT-B.C1.GBPUSD.DISCOVERY.2021_2023.v1|MANIFEST.C1.OPT-B.C1.GBPUSD.DISCOVERY.2021_2023.v1.r1
          OPT-B.C1.GBPUSD.DEVELOPMENT.2024.v1|MANIFEST.C1.OPT-B.C1.GBPUSD.DEVELOPMENT.2024.v1.r1
          EOF
      - name: Verify every frozen byte and publication binding
        run: |
          python scripts/opt_b/review_c1_b1_g2_release.py \
            --discovery-root b1-g2/discovery \
            --development-root b1-g2/development \
            --freeze-report b1-g2/report/WP4F_FREEZE_REPORT.json \
            --remote-collision-state PASS_ABSENT \
            --output b1-g2/output/B1_G2_PUBLICATION_READINESS_RECEIPT.json
      - name: Assert retained authority boundary
        run: |
          grep -F '"status":"PASS"' b1-g2/output/B1_G2_PUBLICATION_READINESS_RECEIPT.json
          grep -F '"selector_activation":"NONE"' b1-g2/output/B1_G2_PUBLICATION_READINESS_RECEIPT.json
          grep -F '"validation_consumption":"LOCKED_UNCONSUMED"' b1-g2/output/B1_G2_PUBLICATION_READINESS_RECEIPT.json
      - name: Upload B1-G2 verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: c1-b1-g2-publication-readiness-receipt
          path: b1-g2/output/*
          retention-days: 90
