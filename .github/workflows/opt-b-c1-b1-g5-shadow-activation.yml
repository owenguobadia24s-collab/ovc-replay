name: OPT-B.C1 B1-G5 shadow activation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-activation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify exact B1-G5 authority packet and lawful successor
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('docs/releases/opt-b-c1-v2/b1-g5')
          gate = json.loads((base / 'B1_G5_GATE_PACKET.json').read_text())
          comparison = json.loads((base / 'B1_G5_COMPARISON_PACKET.json').read_text())
          handoff = json.loads((base / 'B1_G5_C1_TO_C2_HANDOFF_VALIDATION.json').read_text())
          selectors = Path('registries/opt_b/c1/C1_ACTIVE_SELECTORS.yaml').read_text()

          assert gate['decision'] == 'PASS_SHADOW_ACTIVATION_EXACT_REMOTE_VERIFIED_RELEASES'
          assert gate['publication_evidence']['wp5_verification_run_id'] == 30190733324
          assert gate['publication_evidence']['remote_object_count'] == 194
          assert comparison['status'] == 'PASS_COMPLETE_NO_UNEXPLAINED_DIFFERENCES'
          assert comparison['historical_relabelling'] is False
          assert comparison['unexplained_difference_count'] == 0
          assert handoff['status'] == 'PASS_INTERFACE_VALIDATED_CONSUMPTION_NOT_AUTHORISED'
          assert handoff['c2_consumption'] == 'DENIED_PENDING_SEPARATE_HANDOFF_REVIEW'
          assert selectors.count('selector_state: NONE') == 1
          assert 'rollback_action: RETURN_ALL_C1_ROLE_SELECTORS_TO_NONE' in selectors
          successor = Path('registries/authority/C1_TO_C2_ACTIVE_HANDOFF_AUTHORITY.yaml')
          if successor.exists():
              text = successor.read_text()
              assert selectors.count('selector_state: ACTIVE') == 2
              assert 'status: PASS_C1_ACTIVE_C2_SCOPE_AUTHORISED' in text
              assert 'c2_activation: DENIED_PENDING_C2_GATES' in text
          else:
              authority = Path('registries/authority/ACTIVE_AUTHORITY.yaml').read_text()
              assert selectors.count('selector_state: SHADOW') == 2
              assert 'state: C1_B1_G5_PASS_SHADOW_ACTIVE_C2_DENIED' in authority
              assert '  opt_b_c1: SHADOW' in authority
          PY
