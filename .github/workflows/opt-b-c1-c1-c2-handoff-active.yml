name: OPT-B.C1 C1-to-C2 handoff and active activation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff-active-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run active handoff tests
        run: PYTHONPATH=src python -m unittest tests.opt_b.c1.test_c1_c2_handoff_active -v
      - name: Verify exact authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(Path('docs/releases/opt-b-c1-v2/c1-c2-handoff/C1_C2_HANDOFF_GATE_PACKET.json').read_text())
          selectors = Path('registries/opt_b/c1/C1_ACTIVE_SELECTORS.yaml').read_text()
          releases = Path('registries/opt_b/c1/C1_RELEASE_REGISTRY.yaml').read_text()
          assert gate['decision'] == 'PASS_C1_ACTIVE_C2_BUILD_AND_REPLAY_SCOPE_AUTHORISED'
          assert gate['blocking_issues'] == 0
          assert selectors.count('selector_state: ACTIVE') == 2
          assert 'authority_state: ACTIVE_DISCOVERY' in selectors
          assert 'authority_state: ACTIVE_DEVELOPMENT' in selectors
          assert selectors.count('selector_state: NONE') == 1
          assert 'LOCKED_UNCONSUMED' in selectors
          assert 'C1_TO_C2_HANDOFF_PASS_C1_ACTIVE_C2_SCOPE_AUTHORISED' in releases
          assert gate['c2_scope']['selector'] == 'NONE'
          assert gate['c2_scope']['activation'] == 'DENIED_PENDING_C2_GATES'
          PY
