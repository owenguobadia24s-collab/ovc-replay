name: OPT-B.C1 WP5 controlled dispatcher

on:
  push:
    branches:
      - build/opt-b-c1-v2-wp5-dispatch
    paths:
      - docs/releases/opt-b-c1-v2/wp5/WP5_EXECUTION_REQUEST.md
  pull_request:
    branches:
      - main
    paths:
      - docs/releases/opt-b-c1-v2/wp5/WP5_EXECUTION_REQUEST.md
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-publication:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'build/opt-b-c1-v2-wp5-dispatch' || github.ref_name == 'build/opt-b-c1-v2-wp5-dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical WP5 publication workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run opt-b-c1-wp5-r2-publication.yml --repo "${GITHUB_REPOSITORY}" --ref main
