name: OPT-B.C2 WP5 bounded replay readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp5-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify honest WP5 blocker and authority bounds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gate=json.loads(Path('docs/releases/opt-b-c2-v2/wp5/WP5_GATE_PACKET.json').read_text())
          authority=Path('registries/implementation/OPT_B_C2_WP5_REPLAY_AUTHORITY.yaml').read_text()
          assert gate['decision']=='BLOCKED_MISSING_EXACT_C1_RELEASE_ROOT'
          assert gate['blocking_issues']==1
          assert gate['authority']['local_candidate_release']=='NONE'
          assert gate['authority']['validation_consumption']=='LOCKED_UNCONSUMED'
          assert 'replay_runner: READY' in authority
          assert 'probability: NONE' in authority
          PY
