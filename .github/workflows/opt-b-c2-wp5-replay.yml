name: OPT-B.C2 WP5 exact-parent replay readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp5-exact-parent-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify exact-parent successor boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          gate=json.loads(Path('docs/releases/opt-b-c2-v2/wp5/WP5_GATE_PACKET.json').read_text())
          authority=Path('registries/implementation/OPT_B_C2_WP5_REPLAY_AUTHORITY.yaml').read_text()
          replay=Path('src/ovc/opt_b/c2/replay.py').read_text()
          runner=Path('scripts/opt_b/run_c2_wp5_replay.py').read_text()

          assert gate['decision']=='BLOCKED_MISSING_EXACT_OPT_A_PRICE_PARENT_ROOT'
          assert gate['blocking_issues']==1
          assert gate['required_inputs']['c1']['record_shards']==192
          assert gate['required_inputs']['c1']['manifest_bound_payload_objects']==194
          assert gate['required_inputs']['c1']['canonical_objects_including_manifests']==196
          assert gate['required_inputs']['opt_a']['required_price_files']==192
          assert gate['authority']['local_candidate_release']=='NONE'
          assert gate['authority']['validation_consumption']=='LOCKED_UNCONSUMED'
          assert 'canonical_c1_shard_intake: READY_MANIFEST_BOUND' in authority
          assert 'actual_market_replay: BLOCKED_MISSING_EXACT_OPT_A_PRICE_PARENT_ROOT' in authority
          assert 'verify_canonical_release' in replay
          assert 'VerifiedOptARelease' in replay
          assert 'OptAPriceParentIndex' in replay
          assert '--opt-a-release-root' in runner
          assert '--verify-only' in runner
          PY
