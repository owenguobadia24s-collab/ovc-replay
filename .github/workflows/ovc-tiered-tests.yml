name: OVC tiered test selection shadow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: ovc-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: OVC profile assurance
    runs-on: ubuntu-latest
    outputs:
      selected_profile: ${{ steps.select.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build changed-file inventory
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/changed-paths.txt"
          else
            git show --pretty='' --name-only HEAD > "$RUNNER_TEMP/changed-paths.txt"
          fi
          test -s "$RUNNER_TEMP/changed-paths.txt"

      - name: Select deterministic profile
        id: select
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/development/ovc_test_select.py \
            --registry registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json \
            --changed-paths-file "$RUNNER_TEMP/changed-paths.txt" \
            --output "$RUNNER_TEMP/test-selection-manifest.json" \
            > "$RUNNER_TEMP/test-selection-stdout.json"
          cmp "$RUNNER_TEMP/test-selection-manifest.json" "$RUNNER_TEMP/test-selection-stdout.json"
          profile=$(python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "test-selection-manifest.json").read_text())
          assert manifest["status"] == "PASS"
          assert manifest["final_assurance_required"] is True
          assert manifest["gate_replay_substitution"] == "PROHIBITED"
          print(manifest["selected_profile"])
          PY
          )
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "OVC_SELECTED_PROFILE=$profile" >> "$GITHUB_ENV"

      - name: FAST profile BASE_INDEPENDENT assurance
        if: steps.select.outputs.profile == 'FAST'
        run: |
          python -m compileall -q src scripts
          PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_*.py' -v

      - name: PACKET profile BASE_INDEPENDENT assurance
        if: steps.select.outputs.profile == 'PACKET'
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/development -v
          PYTHONPATH=src python -m unittest discover -s tests/authority -v

      - name: FINAL_HEAD profile BASE_INDEPENDENT assurance
        if: steps.select.outputs.profile == 'FINAL_HEAD'
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/development -v
          PYTHONPATH=src python -m unittest discover -s tests/authority -v

      - name: Validate orchestration contract as BASE_INDEPENDENT assurance
        run: |
          PYTHONPATH=src python -u scripts/development/v0_2/validate_da2_g1.py
          PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_da2_g1_orchestration.py' -v

      - name: Retain final assurance boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'required_on_stable_pr_head.*true' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json
          grep -q 'gate_replay_substitution.*PROHIBITED' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json
          grep -q 'local_success_substitutes_remote_required_check.*false' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json

  legacy-required-context:
    name: OVC tiered test selection shadow
    needs: profile
    runs-on: ubuntu-latest
    steps:
      - run: echo "Compatibility context passed after ${{ needs.profile.outputs.selected_profile }} profile assurance."

  siq-ready-admission:
    name: SIQ READY admission
    if: github.event_name == 'pull_request'
    needs: profile
    runs-on: ubuntu-latest
    timeout-minutes: 24
    outputs:
      base_sha: ${{ steps.ready.outputs.base_sha }}
      head_sha: ${{ steps.ready.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Wait for BASE_INDEPENDENT required assurance and pin current main
        id: ready
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const requiredNames = [
              'tests',
              'pytest-unittest-parity',
              'runner-parity',
              'OVC profile assurance'
            ];
            const deadline = Date.now() + 22 * 60 * 1000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const latestNamedRun = (runs, name) => {
              const matches = runs.filter(run => run.name === name).sort((a, b) => b.id - a.id);
              return matches[0];
            };

            while (Date.now() < deadline) {
              const checks = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: sha,
                per_page: 100,
                filter: 'latest'
              });
              const required = requiredNames.map(name => latestNamedRun(checks.data.check_runs, name));
              const failed = required.find(run => run && run.status === 'completed' && run.conclusion !== 'success');
              if (failed) {
                core.setFailed(`SIQ_BASE_INDEPENDENT_ASSURANCE_FAILED: ${failed.name}=${failed.conclusion}`);
                return;
              }
              const complete = required.every(run => run && run.status === 'completed' && run.conclusion === 'success');
              if (!complete) {
                await sleep(10000);
                continue;
              }

              const mainNow = await github.rest.repos.getBranch({owner, repo, branch: pr.base.ref});
              const currentMain = mainNow.data.commit.sha;
              if (currentMain !== pr.base.sha) {
                core.setFailed(
                  `OVC_BASE_MOVED_BEFORE_READINESS: event base ${pr.base.sha}, current ${pr.base.ref} ${currentMain}; ` +
                  `automatic lawful reconcile/requeue is required before SIQ READY admission.`
                );
                return;
              }
              core.setOutput('base_sha', currentMain);
              core.setOutput('head_sha', sha);
              core.info(
                `OVC_SIQ_READY_ADMITTED: ${sha} completed BASE_INDEPENDENT assurance and is pinned to ${pr.base.ref}@${currentMain}.`
              );
              return;
            }
            core.setFailed(`SIQ_READY_ADMISSION_TIMEOUT: BASE_INDEPENDENT required assurance did not complete for ${sha}.`);

      - name: Prove READY candidate contains pinned main
        shell: bash
        env:
          OVC_READY_BASE_SHA: ${{ steps.ready.outputs.base_sha }}
          OVC_READY_HEAD_SHA: ${{ steps.ready.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "${OVC_READY_BASE_SHA}"
          test -n "${OVC_READY_HEAD_SHA}"
          git cat-file -e "${OVC_READY_BASE_SHA}^{commit}"
          git cat-file -e "${OVC_READY_HEAD_SHA}^{commit}"
          if ! git merge-base --is-ancestor "${OVC_READY_BASE_SHA}" "${OVC_READY_HEAD_SHA}"; then
            echo "::error title=SIQ READY candidate not reconciled::OVC_CANDIDATE_NOT_RECONCILED_TO_CURRENT_MAIN: ${OVC_READY_HEAD_SHA} does not contain pinned main ${OVC_READY_BASE_SHA}."
            exit 1
          fi

  merge-readiness:
    name: OVC merge readiness
    if: github.event_name == 'pull_request'
    needs: [profile, siq-ready-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ovc-main-integration-lane-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Acquire SIQ BASE_SENSITIVE final-integration lease on current main
        id: acquire
        uses: actions/github-script@v9
        env:
          OVC_READY_BASE_SHA: ${{ needs.siq-ready-admission.outputs.base_sha }}
          OVC_READY_HEAD_SHA: ${{ needs.siq-ready-admission.outputs.head_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const sha = process.env.OVC_READY_HEAD_SHA;
            const readyBase = process.env.OVC_READY_BASE_SHA;
            const windowCheckName = 'OVC merge readiness';
            const startedAt = Date.now();
            const predecessorDeadline = startedAt + 4 * 60 * 1000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const latestNamedRun = runs => runs.filter(run => run.name === windowCheckName).sort((a,b) => b.id-a.id)[0];
            const emitPredecessorMetric = (result, leaseOwner = null) => core.info(
              `OVC_CI_METRIC ${JSON.stringify({schema:'ovc-ci-metric/v1',metric:'final_integration_predecessor_lease_wait_ms',value_ms:Date.now()-startedAt,head_sha:sha,predecessor_pr:leaseOwner?.number||null,result})}`
            );
            const findPassedPredecessor = async mainSha => {
              const pulls = await github.paginate(github.rest.pulls.list, {owner, repo, state:'open', base:pr.base.ref, per_page:100});
              for (const candidate of pulls) {
                if (candidate.number >= pr.number) {
                  if (candidate.number > pr.number) {
                    core.info(`OVC_FINAL_INTEGRATION_NON_PREDECESSOR_IGNORED: PR #${candidate.number} was created after current PR #${pr.number}; it cannot own the current candidate's predecessor lease.`);
                  }
                  continue;
                }
                const checks = await github.rest.checks.listForRef({owner, repo, ref:candidate.head.sha, per_page:100, filter:'latest'});
                const leaseRun = latestNamedRun(checks.data.check_runs);
                if (!(leaseRun?.status === 'completed' && leaseRun.conclusion === 'success')) continue;
                const ancestry = await github.rest.repos.compareCommits({owner, repo, base:mainSha, head:candidate.head.sha});
                if (!['ahead','identical'].includes(ancestry.data.status)) continue;
                return {number:candidate.number, headSha:candidate.head.sha, baseSha:mainSha};
              }
              return null;
            };

            let leaseOwner = null;
            while (Date.now() < predecessorDeadline) {
              const mainNow = await github.rest.repos.getBranch({owner, repo, branch:pr.base.ref});
              const currentMain = mainNow.data.commit.sha;
              if (!leaseOwner) {
                leaseOwner = await findPassedPredecessor(currentMain);
                if (!leaseOwner) {
                  emitPredecessorMetric('NO_HELD_PREDECESSOR');
                  break;
                }
                core.info(`OVC_FINAL_INTEGRATION_PREDECESSOR_LEASE_HELD: PR #${leaseOwner.number} head ${leaseOwner.headSha}.`);
              }
              const terminal = await github.rest.pulls.get({owner, repo, pull_number:leaseOwner.number});
              const mainAfter = await github.rest.repos.getBranch({owner, repo, branch:pr.base.ref});
              const newMain = mainAfter.data.commit.sha;
              if (terminal.data.merged_at && newMain !== leaseOwner.baseSha) {
                emitPredecessorMetric('MERGED', leaseOwner);
                core.info(`OVC_FINAL_INTEGRATION_PREDECESSOR_MERGED: PR #${leaseOwner.number}; successor advances.`);
                leaseOwner = null;
                continue;
              }
              if (terminal.data.state === 'closed') {
                emitPredecessorMetric('RELEASED', leaseOwner);
                core.info(`OVC_FINAL_INTEGRATION_PREDECESSOR_RELEASED: PR #${leaseOwner.number}.`);
                leaseOwner = null;
                continue;
              }
              if (newMain !== leaseOwner.baseSha) {
                emitPredecessorMetric('INVALIDATED', leaseOwner);
                core.info(`OVC_FINAL_INTEGRATION_PREDECESSOR_INVALIDATED: PR #${leaseOwner.number}.`);
                leaseOwner = null;
                continue;
              }
              await sleep(5000);
            }
            if (leaseOwner) {
              emitPredecessorMetric('TIMEOUT', leaseOwner);
              core.setFailed(`OVC_FINAL_INTEGRATION_PREDECESSOR_TERMINAL_TIMEOUT: PR #${leaseOwner.number} still owns the final-PASS lease.`);
              return;
            }

            const mainAtStart = await github.rest.repos.getBranch({owner, repo, branch:pr.base.ref});
            const mainSnapshot = mainAtStart.data.commit.sha;
            if (mainSnapshot !== readyBase || mainSnapshot !== pr.base.sha) {
              core.setFailed(
                `OVC_BASE_MOVED_BEFORE_READINESS: READY base ${readyBase}, event base ${pr.base.sha}, current ${mainSnapshot}; ` +
                `release and automatic lawful reconcile/requeue are required.`
              );
              return;
            }
            core.setOutput('base_sha', mainSnapshot);
            core.setOutput('head_sha', sha);
            core.info(`OVC_SIQ_BASE_SENSITIVE_LEASE_ACQUIRED: ${pr.base.ref}@${mainSnapshot} for ${sha}.`);
            core.info(`OVC_CI_METRIC ${JSON.stringify({schema:'ovc-ci-metric/v1',metric:'final_integration_window_acquisition_ms',value_ms:Date.now()-startedAt,head_sha:sha,base_sha:mainSnapshot,result:'ACQUIRED_BASE_SENSITIVE_ONLY'})}`);

      - name: Prove candidate contains acquired current main
        shell: bash
        env:
          OVC_WINDOW_BASE_SHA: ${{ steps.acquire.outputs.base_sha }}
          OVC_WINDOW_HEAD_SHA: ${{ steps.acquire.outputs.head_sha }}
        run: |
          set -euo pipefail
          test -n "${OVC_WINDOW_BASE_SHA}"
          test -n "${OVC_WINDOW_HEAD_SHA}"
          git cat-file -e "${OVC_WINDOW_BASE_SHA}^{commit}"
          git cat-file -e "${OVC_WINDOW_HEAD_SHA}^{commit}"
          if ! git merge-base --is-ancestor "${OVC_WINDOW_BASE_SHA}" "${OVC_WINDOW_HEAD_SHA}"; then
            echo "::error title=Candidate not reconciled::OVC_CANDIDATE_NOT_RECONCILED_TO_CURRENT_MAIN: ${OVC_WINDOW_HEAD_SHA} does not contain acquired main ${OVC_WINDOW_BASE_SHA}."
            exit 1
          fi

      - name: Run mandatory SIQ/PDC exact-final assurance inside lease
        shell: bash
        env:
          OVC_LEASE_REQUIRED: true
          OVC_LEASE_BASE_SHA: ${{ steps.acquire.outputs.base_sha }}
          OVC_LEASE_HEAD_SHA: ${{ steps.acquire.outputs.head_sha }}
          OVC_LEASE_BRANCH: main
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=src python3 tools/ci/ovc_run_with_main_lease.py -- \
            bash -lc "PYTHONPATH=src python -m unittest tests.development.test_siq_queue tests.development.test_siq_controls tests.development.test_siq_reconciliation tests.development.test_siq_receipts tests.development.test_siq_pdc_contract -v"

      - name: Verify stable main and release SIQ lease
        uses: actions/github-script@v9
        env:
          OVC_WINDOW_BASE_SHA: ${{ steps.acquire.outputs.base_sha }}
          OVC_WINDOW_HEAD_SHA: ${{ steps.acquire.outputs.head_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const mainSnapshot = process.env.OVC_WINDOW_BASE_SHA;
            const sha = process.env.OVC_WINDOW_HEAD_SHA;
            const startedAt = Date.now();
            const mainNow = await github.rest.repos.getBranch({owner, repo, branch:pr.base.ref});
            const finalMain = mainNow.data.commit.sha;
            if (finalMain !== mainSnapshot) {
              core.setFailed(
                `OVC_BASE_MOVED_DURING_READINESS: ${pr.base.ref} moved from ${mainSnapshot} to ${finalMain}; ` +
                `lease releases and automatic lawful reconcile/requeue are required.`
              );
              return;
            }
            core.info(`OVC_FINAL_INTEGRATION_WINDOW_PASS: mandatory exact-final assurance passed on ${sha} while ${pr.base.ref} remained ${mainSnapshot}.`);
            core.info(`OVC_SIQ_BASE_SENSITIVE_LEASE_RELEASED: ${sha}; immediate successor advancement is eligible.`);
            core.info(`OVC_CI_METRIC ${JSON.stringify({schema:'ovc-ci-metric/v1',metric:'final_integration_window_hold_ms',value_ms:Date.now()-startedAt,head_sha:sha,base_sha:mainSnapshot,required_checks:['SIQ/PDC exact-final assurance'],result:'PASS_RELEASED'})}`);