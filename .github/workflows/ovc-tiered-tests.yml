name: OVC tiered test selection shadow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: ovc-pr-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  profile:
    name: OVC profile assurance
    runs-on: ubuntu-latest
    outputs:
      selected_profile: ${{ steps.select.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - name: Build changed-file inventory
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/changed-paths.txt"
          else
            git show --pretty='' --name-only HEAD > "$RUNNER_TEMP/changed-paths.txt"
          fi
          test -s "$RUNNER_TEMP/changed-paths.txt"
      - name: Select deterministic profile
        id: select
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/development/ovc_test_select.py \
            --registry registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json \
            --changed-paths-file "$RUNNER_TEMP/changed-paths.txt" \
            --output "$RUNNER_TEMP/test-selection-manifest.json" \
            > "$RUNNER_TEMP/test-selection-stdout.json"
          cmp "$RUNNER_TEMP/test-selection-manifest.json" "$RUNNER_TEMP/test-selection-stdout.json"
          profile=$(python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "test-selection-manifest.json").read_text())
          assert manifest["status"] == "PASS"
          assert manifest["final_assurance_required"] is True
          assert manifest["gate_replay_substitution"] == "PROHIBITED"
          print(manifest["selected_profile"])
          PY
          )
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "OVC_SELECTED_PROFILE=$profile" >> "$GITHUB_ENV"
      - name: FAST profile BASE_INDEPENDENT assurance
        if: steps.select.outputs.profile == 'FAST'
        run: |
          python -m compileall -q src scripts
          PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_*.py' -v
      - name: PACKET profile BASE_INDEPENDENT assurance
        if: steps.select.outputs.profile == 'PACKET'
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/development -v
          PYTHONPATH=src python -m unittest discover -s tests/authority -v
      - name: FINAL_HEAD profile BASE_INDEPENDENT assurance
        if: steps.select.outputs.profile == 'FINAL_HEAD'
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/development -v
          PYTHONPATH=src python -m unittest discover -s tests/authority -v
      - name: Validate orchestration contract as BASE_INDEPENDENT assurance
        run: |
          PYTHONPATH=src python -u scripts/development/v0_2/validate_da2_g1.py
          PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_da2_g1_orchestration.py' -v
      - name: Retain final assurance boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'required_on_stable_pr_head.*true' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json
          grep -q 'gate_replay_substitution.*PROHIBITED' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json
          grep -q 'local_success_substitutes_remote_required_check.*false' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json

  legacy-required-context:
    name: OVC tiered test selection shadow
    needs: profile
    runs-on: ubuntu-latest
    steps:
      - run: echo "Compatibility context passed after ${{ needs.profile.outputs.selected_profile }} profile assurance."

  siq-ready-admission:
    name: SIQ READY admission
    if: github.event_name == 'pull_request'
    needs: profile
    runs-on: ubuntu-latest
    timeout-minutes: 24
    outputs:
      base_sha: ${{ steps.ready.outputs.base_sha }}
      source_head_sha: ${{ steps.ready.outputs.source_head_sha }}
      frontier_generation_id: ${{ steps.ready.outputs.frontier_generation_id }}
      placement_id: ${{ steps.ready.outputs.placement_id }}
      predecessor_commit_sha: ${{ steps.ready.outputs.predecessor_commit_sha }}
      predecessor_tree: ${{ steps.ready.outputs.predecessor_tree }}
      prospective_result_tree: ${{ steps.ready.outputs.prospective_result_tree }}
      frontier_lineage_b64: ${{ steps.ready.outputs.frontier_lineage_b64 }}
      assurance_generation_id: ${{ steps.ready.outputs.assurance_generation_id }}
      assurance_generation_b64: ${{ steps.ready.outputs.assurance_generation_b64 }}
      tests_run_id: ${{ steps.ready.outputs.tests_run_id }}
      profile_run_id: ${{ steps.ready.outputs.profile_run_id }}
      movement_disposition: ${{ steps.ready.outputs.movement_disposition }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Bind PIP-bound A0 and current VIT frontier generation
        id: ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
        run: python3 tools/ci/prvitr_live_admission.py ready
      - name: Prove READY binds source, PIP placement and prospective tree without PR-head ancestry
        shell: bash
        env:
          OVC_SOURCE_HEAD_SHA: ${{ steps.ready.outputs.source_head_sha }}
          OVC_FRONTIER_GENERATION_ID: ${{ steps.ready.outputs.frontier_generation_id }}
          OVC_PLACEMENT_ID: ${{ steps.ready.outputs.placement_id }}
          OVC_PREDECESSOR_TREE: ${{ steps.ready.outputs.predecessor_tree }}
          OVC_PROSPECTIVE_RESULT_TREE: ${{ steps.ready.outputs.prospective_result_tree }}
        run: |
          set -euo pipefail
          [[ "${#OVC_SOURCE_HEAD_SHA}" -eq 40 ]]
          [[ "${#OVC_FRONTIER_GENERATION_ID}" -eq 64 ]]
          [[ "${#OVC_PLACEMENT_ID}" -eq 64 ]]
          [[ "${#OVC_PREDECESSOR_TREE}" -eq 40 ]]
          [[ "${#OVC_PROSPECTIVE_RESULT_TREE}" -eq 40 ]]
          git cat-file -e "${OVC_SOURCE_HEAD_SHA}^{commit}"
          test "$(git cat-file -t "${OVC_PREDECESSOR_TREE}")" = "tree"
          test "$(git cat-file -t "${OVC_PROSPECTIVE_RESULT_TREE}")" = "tree"
          echo "OVC_READY_FRONTIER_PROOF=PASS source_head_is_provenance_only"

  merge-readiness:
    name: OVC merge readiness
    if: github.event_name == 'pull_request'
    needs: [profile, siq-ready-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ovc-main-integration-lane-v1
      cancel-in-progress: false
    outputs:
      admission_receipt_id: ${{ steps.finalize.outputs.admission_receipt_id }}
      assurance_generation_id: ${{ steps.finalize.outputs.assurance_generation_id }}
      a2_proof_id: ${{ steps.finalize.outputs.a2_proof_id }}
      transaction_id: ${{ steps.finalize.outputs.transaction_id }}
      frontier_ledger_envelope_id: ${{ steps.finalize.outputs.frontier_ledger_envelope_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Acquire late physical-main lease and re-resolve exact VIT generation
        id: acquire
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
          OVC_READY_SOURCE_HEAD_SHA: ${{ needs.siq-ready-admission.outputs.source_head_sha }}
          OVC_READY_ASSURANCE_GENERATION_ID: ${{ needs.siq-ready-admission.outputs.assurance_generation_id }}
        run: python3 tools/ci/prvitr_live_admission.py acquire
      - name: Checkout exact qualified prospective materialisation tree
        shell: bash
        env:
          OVC_PROSPECTIVE_COMMIT_SHA: ${{ steps.acquire.outputs.prospective_commit_sha }}
          OVC_PROSPECTIVE_RESULT_TREE: ${{ steps.acquire.outputs.prospective_result_tree }}
          OVC_SOURCE_HEAD_SHA: ${{ steps.acquire.outputs.source_head_sha }}
        run: |
          set -euo pipefail
          [[ "${#OVC_PROSPECTIVE_COMMIT_SHA}" -eq 40 ]]
          [[ "${#OVC_PROSPECTIVE_RESULT_TREE}" -eq 40 ]]
          [[ "${#OVC_SOURCE_HEAD_SHA}" -eq 40 ]]
          git cat-file -e "${OVC_PROSPECTIVE_COMMIT_SHA}^{commit}"
          test "$(git rev-parse "${OVC_PROSPECTIVE_COMMIT_SHA}^{tree}")" = "${OVC_PROSPECTIVE_RESULT_TREE}"
          git checkout --detach "${OVC_PROSPECTIVE_COMMIT_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${OVC_PROSPECTIVE_RESULT_TREE}"
          echo "OVC_A2_PROSPECTIVE_CHECKOUT=PASS source=${OVC_SOURCE_HEAD_SHA} tree=${OVC_PROSPECTIVE_RESULT_TREE}"
      - name: Run mandatory SIQ/PDC A2 exact-final assurance inside lease
        shell: bash
        env:
          OVC_LEASE_REQUIRED: true
          OVC_LEASE_BASE_SHA: ${{ steps.acquire.outputs.base_sha }}
          OVC_LEASE_BASE_TREE: ${{ steps.acquire.outputs.base_tree }}
          OVC_LEASE_SOURCE_HEAD_SHA: ${{ steps.acquire.outputs.source_head_sha }}
          OVC_LEASE_PROSPECTIVE_COMMIT_SHA: ${{ steps.acquire.outputs.prospective_commit_sha }}
          OVC_LEASE_RESULT_TREE: ${{ steps.acquire.outputs.prospective_result_tree }}
          OVC_LEASE_BRANCH: main
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=src python3 tools/ci/ovc_run_with_main_lease.py -- \
            bash -lc "PYTHONPATH=src python -m unittest tests.development.test_siq_queue tests.development.test_siq_controls tests.development.test_siq_reconciliation tests.development.test_siq_receipts tests.development.test_siq_pdc_contract tests.development.test_prvitr_vit_frontier_decoupling -v"
      - name: Bind frontier admission receipt and emit one late physical transaction freeze
        id: finalize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
          OVC_WINDOW_SOURCE_HEAD_SHA: ${{ steps.acquire.outputs.source_head_sha }}
          OVC_WINDOW_BASE_SHA: ${{ steps.acquire.outputs.base_sha }}
          OVC_WINDOW_BASE_TREE: ${{ steps.acquire.outputs.base_tree }}
          OVC_WINDOW_PROSPECTIVE_COMMIT_SHA: ${{ steps.acquire.outputs.prospective_commit_sha }}
          OVC_WINDOW_PROSPECTIVE_RESULT_TREE: ${{ steps.acquire.outputs.prospective_result_tree }}
          OVC_ASSURANCE_GENERATION_ID: ${{ steps.acquire.outputs.assurance_generation_id }}
          OVC_ASSURANCE_GENERATION_B64: ${{ steps.acquire.outputs.assurance_generation_b64 }}
          OVC_FRONTIER_LINEAGE_B64: ${{ steps.acquire.outputs.frontier_lineage_b64 }}
        run: python3 tools/ci/prvitr_live_admission.py finalize
