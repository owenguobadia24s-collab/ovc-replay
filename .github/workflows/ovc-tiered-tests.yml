# Historical workflow identity is retained because post-merge custody binds it.
# The required OVC merge readiness job below now treats its selected profile as
# normal blocking assurance; "shadow" survives only as a compatibility name.
name: OVC tiered test selection shadow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: ovc-pr-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  vit-routing-preflight:
    name: VIT routing preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Verify VIT-owned physical-main protection
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.base.ref;
            if (branch !== 'main') {
              core.setFailed(`PHYSICAL_MAIN_EXCLUSIVITY_TARGET_INVALID:${branch}`);
              return;
            }
            const effective = await github.request('GET /repos/{owner}/{repo}/rules/branches/{branch}', {
              owner, repo, branch,
              headers: {'X-GitHub-Api-Version':'2022-11-28'}
            });
            const rules = effective.data;
            const byType = type => rules.filter(rule => rule.type === type);
            if (!byType('pull_request').length || !byType('non_fast_forward').length || !byType('deletion').length) {
              core.setFailed('PHYSICAL_MAIN_EXCLUSIVITY_GUARDS_MISSING');
              return;
            }
            const methods = byType('pull_request')[0].parameters?.allowed_merge_methods || [];
            const contexts = byType('required_status_checks').flatMap(rule => rule.parameters?.required_status_checks || []).map(row => row.context);
            if (methods.length !== 1 || methods[0] !== 'squash' || !contexts.includes('OVC merge readiness')) {
              core.setFailed(`PHYSICAL_MAIN_EXCLUSIVITY_RULESET_INVALID:${methods.join(',')}:${contexts.join(',')}`);
              return;
            }
            const rulesetIds = [...new Set(rules.map(rule => rule.ruleset_id).filter(Boolean))];
            if (rulesetIds.length !== 1) {
              core.setFailed(`PHYSICAL_MAIN_EXCLUSIVITY_RULESET_AMBIGUOUS:${rulesetIds.join(',')}`);
              return;
            }
            const ruleset = await github.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}', {
              owner, repo, ruleset_id: rulesetIds[0],
              headers: {'X-GitHub-Api-Version':'2022-11-28'}
            });
            if (ruleset.data.enforcement !== 'active' || (ruleset.data.bypass_actors || []).length !== 0) {
              core.setFailed('PHYSICAL_MAIN_EXCLUSIVITY_ENFORCEMENT_INVALID');
            }
      - name: Resolve exact-head VIT assurance identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
        run: python3 tools/ci/vit_assurance_preflight.py
      - name: Require canonical VIT placement before permanent PR admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
        run: python3 tools/ci/vit_routing_preflight.py

  profile:
    name: OVC profile assurance
    needs: vit-routing-preflight
    runs-on: ubuntu-latest
    outputs:
      selected_profile: ${{ steps.select.outputs.profile }}
      complete_sweep_required: ${{ steps.select.outputs.complete_sweep_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - name: Build changed-file inventory
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/changed-paths.txt"
          else
            git show --pretty='' --name-only HEAD > "$RUNNER_TEMP/changed-paths.txt"
          fi
          test -s "$RUNNER_TEMP/changed-paths.txt"
      - name: Select deterministic profile
        id: select
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/development/ovc_test_select.py \
            --registry registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_2.json \
            --changed-paths-file "$RUNNER_TEMP/changed-paths.txt" \
            --output "$RUNNER_TEMP/test-selection-manifest.json" \
            > "$RUNNER_TEMP/test-selection-stdout.json"
          cmp "$RUNNER_TEMP/test-selection-manifest.json" "$RUNNER_TEMP/test-selection-stdout.json"
          profile=$(python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "test-selection-manifest.json").read_text())
          assert manifest["status"] == "PASS"
          assert manifest["schema"] == "ovc-test-selection-manifest/v2"
          assert manifest["blocking_assurance_profile"] == manifest["selected_profile"]
          assert manifest["final_assurance_required"] is manifest["complete_sweep_required"]
          assert manifest["pytest_unittest_parity_required"] is manifest["complete_sweep_required"]
          assert manifest["gate_replay_substitution"] == "PROHIBITED"
          print(manifest["selected_profile"])
          PY
          )
          complete_sweep_required=$(python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "test-selection-manifest.json").read_text())
          print("true" if manifest["complete_sweep_required"] else "false")
          PY
          )
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "complete_sweep_required=$complete_sweep_required" >> "$GITHUB_OUTPUT"
          echo "OVC_SELECTED_PROFILE=$profile" >> "$GITHUB_ENV"
      - name: Install packet test dependencies
        if: steps.select.outputs.profile != 'FAST'
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt
      - name: FAST profile BASE_INDEPENDENT assurance
        if: steps.select.outputs.profile == 'FAST'
        run: PYTHONPATH=src:. python3 tools/ci/tiered_profile_runner.py --profile FAST --changed-paths-file "$RUNNER_TEMP/changed-paths.txt"
      - name: PACKET profile BASE_INDEPENDENT assurance
        if: steps.select.outputs.profile == 'PACKET'
        run: PYTHONPATH=src:. python3 tools/ci/tiered_profile_runner.py --profile PACKET --changed-paths-file "$RUNNER_TEMP/changed-paths.txt"
      - name: FINAL_HEAD profile BASE_INDEPENDENT assurance
        if: steps.select.outputs.profile == 'FINAL_HEAD'
        run: PYTHONPATH=src:. python3 tools/ci/tiered_profile_runner.py --profile FINAL_HEAD --changed-paths-file "$RUNNER_TEMP/changed-paths.txt"
      - name: Validate orchestration contract as BASE_INDEPENDENT assurance
        run: |
          PYTHONPATH=src python -u scripts/development/v0_2/validate_da2_g1.py
          PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_da2_g1_orchestration.py' -v
      - name: Retain final assurance boundary as trigger-only
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ordinary_blocking_assurance.*SELECTED_TIERED_PROFILE' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_2.json
          grep -q 'pytest_unittest_parity.*COMPLETE_SWEEP_ONLY' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_2.json
          grep -q 'gate_replay_substitution.*PROHIBITED' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_2.json
          grep -q 'local_success_substitutes_remote_required_check.*false' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_2.json

  legacy-required-context:
    name: OVC tiered test selection shadow
    needs: profile
    runs-on: ubuntu-latest
    steps:
      - run: echo "Compatibility context passed after ${{ needs.profile.outputs.selected_profile }} profile assurance."

  siq-ready-admission:
    name: SIQ READY admission
    if: github.event_name == 'pull_request'
    needs: profile
    runs-on: ubuntu-latest
    timeout-minutes: 24
    outputs:
      head_sha: ${{ steps.ready.outputs.head_sha }}
      pip_id: ${{ steps.ready.outputs.pip_id }}
      qualification_id: ${{ steps.ready.outputs.qualification_id }}
      assurance_generation_id: ${{ steps.ready.outputs.assurance_generation_id }}
      tests_run_id: ${{ steps.ready.outputs.tests_run_id }}
      profile_run_id: ${{ steps.ready.outputs.profile_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Bind stable payload assurance without physical-main placement
        id: ready
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
          OVC_SELECTED_PROFILE: ${{ needs.profile.outputs.selected_profile }}
          OVC_COMPLETE_SWEEP_REQUIRED: ${{ needs.profile.outputs.complete_sweep_required }}
        run: python3 tools/ci/prvitr_rac_ready.py
      - name: Prove READY identity is payload-bound rather than main-bound
        shell: bash
        env:
          OVC_READY_HEAD_SHA: ${{ steps.ready.outputs.head_sha }}
          OVC_READY_PIP_ID: ${{ steps.ready.outputs.pip_id }}
          OVC_READY_QUALIFICATION_ID: ${{ steps.ready.outputs.qualification_id }}
        run: |
          set -euo pipefail
          test -n "${OVC_READY_HEAD_SHA}"
          test -n "${OVC_READY_PIP_ID}"
          test -n "${OVC_READY_QUALIFICATION_ID}"
          test "${#OVC_READY_HEAD_SHA}" -eq 40
          test "${#OVC_READY_PIP_ID}" -eq 64
          test "${#OVC_READY_QUALIFICATION_ID}" -eq 64
          git cat-file -e "${OVC_READY_HEAD_SHA}^{commit}"
          echo "OVC_READY_PHYSICAL_BASE_BINDING=NONE"

  merge-readiness:
    name: OVC merge readiness
    if: github.event_name == 'pull_request'
    needs: [profile, siq-ready-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ovc-main-integration-lane-v1
      cancel-in-progress: false
    outputs:
      admission_receipt_id: ${{ steps.finalize.outputs.admission_receipt_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Acquire one-writer lease and late-bind current physical main
        id: acquire
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
          OVC_READY_HEAD_SHA: ${{ needs.siq-ready-admission.outputs.head_sha }}
          OVC_READY_PIP_ID: ${{ needs.siq-ready-admission.outputs.pip_id }}
          OVC_READY_QUALIFICATION_ID: ${{ needs.siq-ready-admission.outputs.qualification_id }}
        run: python3 tools/ci/prvitr_live_admission.py acquire
      - name: Materialize ephemeral prospective tree for exact-final assurance
        shell: bash
        env:
          OVC_PLACEMENT_COMMIT_SHA: ${{ steps.acquire.outputs.placement_commit_sha }}
          OVC_PLACEMENT_TREE_SHA: ${{ steps.acquire.outputs.placement_tree_sha }}
        run: |
          set -euo pipefail
          test -n "${OVC_PLACEMENT_COMMIT_SHA}"
          test -n "${OVC_PLACEMENT_TREE_SHA}"
          git cat-file -e "${OVC_PLACEMENT_COMMIT_SHA}^{commit}"
          test "$(git rev-parse "${OVC_PLACEMENT_COMMIT_SHA}^{tree}")" = "${OVC_PLACEMENT_TREE_SHA}"
          git checkout --detach "${OVC_PLACEMENT_COMMIT_SHA}"
      - name: Re-select profile against the late-bound physical base
        shell: bash
        env:
          OVC_LATE_BASE_SHA: ${{ steps.acquire.outputs.base_sha }}
          OVC_PLACEMENT_COMMIT_SHA: ${{ steps.acquire.outputs.placement_commit_sha }}
          OVC_EXPECTED_PROFILE: ${{ needs.profile.outputs.selected_profile }}
          OVC_EXPECTED_COMPLETE_SWEEP: ${{ needs.profile.outputs.complete_sweep_required }}
        run: |
          set -euo pipefail
          git diff --name-only "${OVC_LATE_BASE_SHA}" "${OVC_PLACEMENT_COMMIT_SHA}" > "$RUNNER_TEMP/late-bound-changed-paths.txt"
          test -s "$RUNNER_TEMP/late-bound-changed-paths.txt"
          PYTHONPATH=src python3 scripts/development/ovc_test_select.py \
            --registry registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_2.json \
            --changed-paths-file "$RUNNER_TEMP/late-bound-changed-paths.txt" \
            --output "$RUNNER_TEMP/late-bound-test-selection-manifest.json" \
            > "$RUNNER_TEMP/late-bound-test-selection-stdout.json"
          cmp "$RUNNER_TEMP/late-bound-test-selection-manifest.json" "$RUNNER_TEMP/late-bound-test-selection-stdout.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "late-bound-test-selection-manifest.json").read_text())
          expected_profile = os.environ["OVC_EXPECTED_PROFILE"]
          expected_sweep = os.environ["OVC_EXPECTED_COMPLETE_SWEEP"].lower() == "true"
          if manifest["selected_profile"] != expected_profile or manifest["complete_sweep_required"] is not expected_sweep:
              raise SystemExit(
                  "OVC_LATE_BOUND_PROFILE_CHANGED:"
                  f"expected={expected_profile}/{expected_sweep}:"
                  f"actual={manifest['selected_profile']}/{manifest['complete_sweep_required']}"
              )
          print(f"OVC_LATE_BOUND_PROFILE_RESELECTION=PASS:{expected_profile}")
          PY
      - name: Run mandatory SIQ/PDC exact-final assurance inside lease
        shell: bash
        env:
          OVC_LEASE_REQUIRED: true
          OVC_LEASE_BASE_SHA: ${{ steps.acquire.outputs.base_sha }}
          OVC_LEASE_HEAD_SHA: ${{ steps.acquire.outputs.placement_commit_sha }}
          OVC_LEASE_BRANCH: main
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=src python3 tools/ci/ovc_run_with_main_lease.py -- \
            bash -lc "PYTHONPATH=src python -m unittest tests.development.test_siq_queue tests.development.test_siq_controls tests.development.test_siq_reconciliation tests.development.test_siq_receipts tests.development.test_siq_pdc_contract tests.development.test_prvitr_late_binding_integration -v"
      - name: Bind exact late-placement IntegrationAdmissionReceipt
        id: finalize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
          OVC_WINDOW_BASE_SHA: ${{ steps.acquire.outputs.base_sha }}
          OVC_CANDIDATE_HEAD_SHA: ${{ steps.acquire.outputs.candidate_head_sha }}
          OVC_PLACEMENT_TREE_SHA: ${{ steps.acquire.outputs.placement_tree_sha }}
          OVC_PLACEMENT_ID: ${{ steps.acquire.outputs.placement_id }}
          OVC_QUALIFICATION_ID: ${{ needs.siq-ready-admission.outputs.qualification_id }}
          OVC_ASSURANCE_GENERATION_ID: ${{ needs.siq-ready-admission.outputs.assurance_generation_id }}
        run: python3 tools/ci/prvitr_live_admission.py finalize
