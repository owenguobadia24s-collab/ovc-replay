name: OVC tiered test selection shadow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: ovc-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: OVC profile assurance
    runs-on: ubuntu-latest
    outputs:
      selected_profile: ${{ steps.select.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build changed-file inventory
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/changed-paths.txt"
          else
            git show --pretty='' --name-only HEAD > "$RUNNER_TEMP/changed-paths.txt"
          fi
          test -s "$RUNNER_TEMP/changed-paths.txt"
      - name: Select deterministic profile
        id: select
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/development/ovc_test_select.py \
            --registry registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json \
            --changed-paths-file "$RUNNER_TEMP/changed-paths.txt" \
            --output "$RUNNER_TEMP/test-selection-manifest.json" \
            > "$RUNNER_TEMP/test-selection-stdout.json"
          cmp "$RUNNER_TEMP/test-selection-manifest.json" "$RUNNER_TEMP/test-selection-stdout.json"
          profile=$(python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "test-selection-manifest.json").read_text())
          assert manifest["status"] == "PASS"
          assert manifest["final_assurance_required"] is True
          assert manifest["gate_replay_substitution"] == "PROHIBITED"
          print(manifest["selected_profile"])
          PY
          )
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "OVC_SELECTED_PROFILE=$profile" >> "$GITHUB_ENV"
      - name: FAST profile
        if: steps.select.outputs.profile == 'FAST'
        run: |
          python -m compileall -q src scripts
          PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_*.py' -v
      - name: PACKET profile
        if: steps.select.outputs.profile == 'PACKET'
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/development -v
          PYTHONPATH=src python -m unittest discover -s tests/authority -v
      - name: FINAL_HEAD profile without duplicate complete suite
        if: steps.select.outputs.profile == 'FINAL_HEAD'
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/development -v
          PYTHONPATH=src python -m unittest discover -s tests/authority -v
      - name: Validate orchestration contract
        run: |
          PYTHONPATH=src python -u scripts/development/v0_2/validate_da2_g1.py
          PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_da2_g1_orchestration.py' -v
      - name: Retain final assurance boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'required_on_stable_pr_head.*true' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json
          grep -q 'gate_replay_substitution.*PROHIBITED' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json
          grep -q 'local_success_substitutes_remote_required_check.*false' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json

  legacy-required-context:
    name: OVC tiered test selection shadow
    needs: profile
    runs-on: ubuntu-latest
    steps:
      - run: echo "Compatibility context passed after ${{ needs.profile.outputs.selected_profile }} profile assurance."

  canonical-tests-observed:
    name: OVC canonical tests observed
    needs: profile
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Observe required Python checks before integration-lane acquisition
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const sha = pr?.head?.sha || context.sha;
            const requiredNames = ['tests', 'pytest-unittest-parity', 'runner-parity'];
            const startedAt = Date.now();
            const deadline = startedAt + 20 * 60 * 1000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const emitMetric = result => core.info(`OVC_CI_METRIC ${JSON.stringify({
              schema: 'ovc-ci-metric/v1',
              metric: 'canonical_tests_observation_wait_ms',
              value_ms: Date.now() - startedAt,
              head_sha: sha,
              required_checks: requiredNames,
              result
            })}`);

            while (Date.now() < deadline) {
              const response = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: sha,
                per_page: 100,
                filter: 'latest'
              });
              const required = requiredNames.map(name => response.data.check_runs.find(run => run.name === name));
              const failed = required.find(run => run && run.status === 'completed' && !['success', 'neutral', 'skipped'].includes(run.conclusion));
              if (failed) {
                emitMetric(`FAIL_${failed.name}_${failed.conclusion}`);
                core.setFailed(`Required Python check ${failed.name} concluded ${failed.conclusion}.`);
                return;
              }
              const allSuccessful = required.every(run => run && run.status === 'completed' && run.conclusion === 'success');
              if (allSuccessful) {
                emitMetric('PASS');
                core.info(`All required Python checks observed successful on ${sha}; final integration lane may now be acquired.`);
                return;
              }
              await sleep(10000);
            }
            emitMetric('TIMEOUT');
            core.setFailed(`Required Python checks did not all complete successfully within the observation window for ${sha}.`);

  merge-readiness:
    name: OVC merge readiness
    needs: [profile, canonical-tests-observed]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: ovc-main-integration-lane-v1
      cancel-in-progress: false
    steps:
      - name: Evaluate exact-head checks on a stable main snapshot
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const sha = pr?.head?.sha || context.sha;
            const requiredNames = ['tests', 'pytest-unittest-parity', 'runner-parity'];
            const startedAt = Date.now();
            const emitMetric = result => core.info(`OVC_CI_METRIC ${JSON.stringify({
              schema: 'ovc-ci-metric/v1',
              metric: 'integration_lane_evaluation_ms',
              value_ms: Date.now() - startedAt,
              head_sha: sha,
              required_checks: requiredNames,
              result
            })}`);

            let mainSnapshot = null;
            if (pr) {
              const mainAtStart = await github.rest.repos.getBranch({ owner, repo, branch: pr.base.ref });
              mainSnapshot = mainAtStart.data.commit.sha;
              if (mainSnapshot !== pr.base.sha) {
                emitMetric('FAIL_BASE_MOVED_BEFORE');
                core.setFailed(`OVC_BASE_MOVED_BEFORE_READINESS: event base ${pr.base.sha}, current ${pr.base.ref} ${mainSnapshot}. Rerun against the current base before merge readiness.`);
                return;
              }
              core.info(`OVC integration lane acquired at ${pr.base.ref}@${mainSnapshot} after required Python checks were observed successful.`);
            }

            const response = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha,
              per_page: 100,
              filter: 'latest'
            });
            const required = requiredNames.map(name => response.data.check_runs.find(run => run.name === name));
            const failed = required.find(run => run && run.status === 'completed' && !['success', 'neutral', 'skipped'].includes(run.conclusion));
            const allSuccessful = required.every(run => run && run.status === 'completed' && run.conclusion === 'success');
            if (!allSuccessful) {
              emitMetric(failed ? `FAIL_REQUIRED_${failed.name}_${failed.conclusion}` : 'FAIL_REQUIRED_NOT_ALL_SUCCESSFUL');
              core.setFailed(failed ? `Required Python check ${failed.name} concluded ${failed.conclusion}.` : `Required Python checks were not all successful at final readiness evaluation for ${sha}.`);
              return;
            }

            if (pr) {
              const mainAtEnd = await github.rest.repos.getBranch({ owner, repo, branch: pr.base.ref });
              const finalMain = mainAtEnd.data.commit.sha;
              if (finalMain !== mainSnapshot) {
                emitMetric('FAIL_BASE_MOVED_DURING');
                core.setFailed(`OVC_BASE_MOVED_DURING_READINESS: ${pr.base.ref} moved from ${mainSnapshot} to ${finalMain}. Fresh integration assurance is required.`);
                return;
              }
            }

            emitMetric('PASS');
            core.info(`Required Python checks passed on ${sha} with stable main snapshot ${mainSnapshot || 'NOT_APPLICABLE'}.`);
