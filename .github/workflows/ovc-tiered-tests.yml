name: OVC tiered test selection shadow

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: ovc-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: OVC profile assurance
    runs-on: ubuntu-latest
    outputs:
      selected_profile: ${{ steps.select.outputs.profile }}
    steps:
      - name: Wait for serialized final-integration window acquisition
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.pull_request.head.sha;
            const windowCheckName = 'OVC merge readiness';
            const deadline = Date.now() + 23 * 60 * 1000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const latestNamedRun = runs => {
              const matches = runs.filter(run => run.name === windowCheckName).sort((a, b) => b.id - a.id);
              return matches[0];
            };

            while (Date.now() < deadline) {
              const response = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: sha,
                per_page: 100,
                filter: 'latest'
              });
              const windowRun = latestNamedRun(response.data.check_runs);
              if (windowRun?.status === 'in_progress') {
                core.info(`OVC_PROFILE_FINAL_INTEGRATION_WINDOW_ADMITTED: ${windowCheckName} is in progress for ${sha}.`);
                return;
              }
              if (windowRun?.status === 'completed') {
                core.setFailed(`OVC_PROFILE_FINAL_INTEGRATION_WINDOW_NOT_ADMITTED: ${windowCheckName} completed ${windowRun.conclusion} before profile assurance was admitted for ${sha}.`);
                return;
              }
              await sleep(5000);
            }

            core.setFailed(`OVC_PROFILE_FINAL_INTEGRATION_WINDOW_ADMISSION_TIMEOUT: ${windowCheckName} did not acquire the serialized lane for ${sha}.`);
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build changed-file inventory
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/changed-paths.txt"
          else
            git show --pretty='' --name-only HEAD > "$RUNNER_TEMP/changed-paths.txt"
          fi
          test -s "$RUNNER_TEMP/changed-paths.txt"
      - name: Select deterministic profile
        id: select
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python scripts/development/ovc_test_select.py \
            --registry registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json \
            --changed-paths-file "$RUNNER_TEMP/changed-paths.txt" \
            --output "$RUNNER_TEMP/test-selection-manifest.json" \
            > "$RUNNER_TEMP/test-selection-stdout.json"
          cmp "$RUNNER_TEMP/test-selection-manifest.json" "$RUNNER_TEMP/test-selection-stdout.json"
          profile=$(python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["RUNNER_TEMP"]) / "test-selection-manifest.json").read_text())
          assert manifest["status"] == "PASS"
          assert manifest["final_assurance_required"] is True
          assert manifest["gate_replay_substitution"] == "PROHIBITED"
          print(manifest["selected_profile"])
          PY
          )
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "OVC_SELECTED_PROFILE=$profile" >> "$GITHUB_ENV"
      - name: FAST profile
        if: steps.select.outputs.profile == 'FAST'
        run: |
          python -m compileall -q src scripts
          PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_*.py' -v
      - name: PACKET profile
        if: steps.select.outputs.profile == 'PACKET'
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/development -v
          PYTHONPATH=src python -m unittest discover -s tests/authority -v
      - name: FINAL_HEAD profile without duplicate complete suite
        if: steps.select.outputs.profile == 'FINAL_HEAD'
        run: |
          PYTHONPATH=src python -m unittest discover -s tests/development -v
          PYTHONPATH=src python -m unittest discover -s tests/authority -v
      - name: Validate orchestration contract
        run: |
          PYTHONPATH=src python -u scripts/development/v0_2/validate_da2_g1.py
          PYTHONPATH=src python -m unittest discover -s tests/development -p 'test_da2_g1_orchestration.py' -v
      - name: Retain final assurance boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'required_on_stable_pr_head.*true' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json
          grep -q 'gate_replay_substitution.*PROHIBITED' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json
          grep -q 'local_success_substitutes_remote_required_check.*false' registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json

  legacy-required-context:
    name: OVC tiered test selection shadow
    needs: profile
    runs-on: ubuntu-latest
    steps:
      - run: echo "Compatibility context passed after ${{ needs.profile.outputs.selected_profile }} profile assurance."

  merge-readiness:
    name: OVC merge readiness
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    concurrency:
      group: ovc-main-integration-lane-v1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Acquire serialized final-integration window on current main
        id: acquire
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const startedAt = Date.now();
            const mainAtStart = await github.rest.repos.getBranch({ owner, repo, branch: pr.base.ref });
            const mainSnapshot = mainAtStart.data.commit.sha;
            const emitMetric = result => core.info(`OVC_CI_METRIC ${JSON.stringify({
              schema: 'ovc-ci-metric/v1',
              metric: 'final_integration_window_acquisition_ms',
              value_ms: Date.now() - startedAt,
              head_sha: sha,
              base_sha: mainSnapshot,
              result
            })}`);

            if (mainSnapshot !== pr.base.sha) {
              emitMetric('FAIL_BASE_MOVED_BEFORE');
              core.setFailed(`OVC_BASE_MOVED_BEFORE_READINESS: event base ${pr.base.sha}, current ${pr.base.ref} ${mainSnapshot}. Reconcile the candidate to current main before final required-check assurance.`);
              return;
            }

            core.setOutput('base_sha', mainSnapshot);
            core.setOutput('head_sha', sha);
            emitMetric('ACQUIRED');
            core.info(`OVC_FINAL_INTEGRATION_WINDOW_ACQUIRED: ${pr.base.ref}@${mainSnapshot} for ${sha}. Final assurance may now start.`);
      - name: Prove candidate contains the acquired main base
        shell: bash
        env:
          OVC_WINDOW_BASE_SHA: ${{ steps.acquire.outputs.base_sha }}
          OVC_WINDOW_HEAD_SHA: ${{ steps.acquire.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${OVC_WINDOW_BASE_SHA}" || -z "${OVC_WINDOW_HEAD_SHA}" ]]; then
            echo "::error title=Final integration window not acquired::Missing acquired base/head identity."
            exit 1
          fi
          git cat-file -e "${OVC_WINDOW_BASE_SHA}^{commit}"
          git cat-file -e "${OVC_WINDOW_HEAD_SHA}^{commit}"
          if ! git merge-base --is-ancestor "${OVC_WINDOW_BASE_SHA}" "${OVC_WINDOW_HEAD_SHA}"; then
            echo "::error title=Candidate not reconciled to current main::OVC_CANDIDATE_NOT_RECONCILED_TO_CURRENT_MAIN: ${OVC_WINDOW_HEAD_SHA} does not contain acquired main ${OVC_WINDOW_BASE_SHA}. Reconcile before final assurance."
            exit 1
          fi
      - name: Hold window through final required-check assurance and stable-main readiness
        uses: actions/github-script@v9
        env:
          OVC_WINDOW_BASE_SHA: ${{ steps.acquire.outputs.base_sha }}
          OVC_WINDOW_HEAD_SHA: ${{ steps.acquire.outputs.head_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const sha = process.env.OVC_WINDOW_HEAD_SHA;
            const mainSnapshot = process.env.OVC_WINDOW_BASE_SHA;
            const requiredNames = ['tests', 'pytest-unittest-parity', 'runner-parity', 'OVC profile assurance'];
            const startedAt = Date.now();
            const deadline = startedAt + 20 * 60 * 1000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const emitMetric = result => core.info(`OVC_CI_METRIC ${JSON.stringify({
              schema: 'ovc-ci-metric/v1',
              metric: 'final_integration_window_hold_ms',
              value_ms: Date.now() - startedAt,
              head_sha: sha,
              base_sha: mainSnapshot,
              required_checks: requiredNames,
              result
            })}`);
            const latestNamedRun = (runs, name) => {
              const matches = runs.filter(run => run.name === name).sort((a, b) => b.id - a.id);
              return matches[0];
            };

            while (Date.now() < deadline) {
              const mainNow = await github.rest.repos.getBranch({ owner, repo, branch: pr.base.ref });
              const currentMain = mainNow.data.commit.sha;
              if (currentMain !== mainSnapshot) {
                emitMetric('FAIL_BASE_MOVED_DURING');
                core.setFailed(`OVC_BASE_MOVED_DURING_READINESS: ${pr.base.ref} moved from ${mainSnapshot} to ${currentMain} while the serialized final-integration window was active. Fresh reconciliation and assurance are required.`);
                return;
              }

              const response = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: sha,
                per_page: 100,
                filter: 'latest'
              });
              const required = requiredNames.map(name => latestNamedRun(response.data.check_runs, name));
              const failed = required.find(run => run && run.status === 'completed' && !['success', 'neutral', 'skipped'].includes(run.conclusion));
              if (failed) {
                emitMetric(`FAIL_REQUIRED_${failed.name}_${failed.conclusion}`);
                core.setFailed(`Required final-assurance check ${failed.name} concluded ${failed.conclusion} while the serialized window was held.`);
                return;
              }
              const allSuccessful = required.every(run => run && run.status === 'completed' && run.conclusion === 'success');
              if (allSuccessful) {
                const mainAtEnd = await github.rest.repos.getBranch({ owner, repo, branch: pr.base.ref });
                const finalMain = mainAtEnd.data.commit.sha;
                if (finalMain !== mainSnapshot) {
                  emitMetric('FAIL_BASE_MOVED_DURING');
                  core.setFailed(`OVC_BASE_MOVED_DURING_READINESS: ${pr.base.ref} moved from ${mainSnapshot} to ${finalMain}. Fresh integration assurance is required.`);
                  return;
                }
                emitMetric('PASS');
                core.info(`OVC_FINAL_INTEGRATION_WINDOW_PASS: required checks passed on ${sha} while ${pr.base.ref} remained ${mainSnapshot}.`);
                return;
              }
              await sleep(10000);
            }

            emitMetric('TIMEOUT');
            core.setFailed(`Required final-assurance checks did not all complete successfully within the serialized window for ${sha}.`);
