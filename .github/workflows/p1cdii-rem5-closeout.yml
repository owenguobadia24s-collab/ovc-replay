name: P1CDII WP4 remediation-5 closeout apply

on:
  push:
    branches:
      - build/p1cdii-wp4-remediation-5-20260820

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact remediation branch
        uses: actions/checkout@v4
        with:
          ref: build/p1cdii-wp4-remediation-5-20260820
          fetch-depth: 0
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          check-latest: false
      - name: Apply exact bounded closeout patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/remaining.patch.gz.b64" <<'OVC_PATCH'
          
          OVC_PATCH
          tr -d '[:space:]' < "${RUNNER_TEMP}/remaining.patch.gz.b64" | base64 -d | gzip -d > "${RUNNER_TEMP}/remaining.patch"
          test "$(sha256sum "${RUNNER_TEMP}/remaining.patch" | cut -d' ' -f1)" = "72af5d6cda0cea213d65a8f0500e31f1bd7fc636e2763ec07489ca933ed5b72a"
          git apply --check "${RUNNER_TEMP}/remaining.patch"
          git apply --index "${RUNNER_TEMP}/remaining.patch"
      - name: Install test dependencies
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt
      - name: Run complete P1CDII namespace
        env:
          PYTHONPATH: src:.
        run: python3 -m pytest tests/research_operations/p1cdi -q --tb=short
      - name: Prove deterministic reference runner
        env:
          PYTHONPATH: src:.
        run: |
          set -euo pipefail
          python3 scripts/research_operations/run_p1cdii_wp4_reference.py > "${RUNNER_TEMP}/p1cdii-rem5-one.json"
          python3 scripts/research_operations/run_p1cdii_wp4_reference.py > "${RUNNER_TEMP}/p1cdii-rem5-two.json"
          cmp "${RUNNER_TEMP}/p1cdii-rem5-one.json" "${RUNNER_TEMP}/p1cdii-rem5-two.json"
          test "$(sha256sum "${RUNNER_TEMP}/p1cdii-rem5-one.json" | cut -d' ' -f1)" = "4ff86f58bfe5e5f64ebbc403cbcf579eb4a166cdc3c93d1ed01c169a1e410106"
          test "$(wc -c < "${RUNNER_TEMP}/p1cdii-rem5-one.json")" = "15215"
      - name: Remove one-shot closeout workflow
        run: rm -f .github/workflows/p1cdii-rem5-closeout.yml
      - name: Commit and push bounded closeout
        run: |
          set -euo pipefail
          git config user.name "OVC P1CDII WP4 Remediation 5"
          git config user.email "p1cdii-wp4-remediation-5@invalid.local"
          git add -A
          git diff --cached --check
          git commit -m "P1CDII-WP4 remediation-5: close PASS_REMEDIATION and ready review-5"
          git push origin HEAD:build/p1cdii-wp4-remediation-5-20260820
