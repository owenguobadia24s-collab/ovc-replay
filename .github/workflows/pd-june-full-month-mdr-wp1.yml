name: PD-JUNE-FULL-MONTH-MDR WP1 intake tooling

on:
  pull_request:
    branches:
      - main
      - build/pd-june-full-month-mdr-00-source-boundary
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp1-intake-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse WP1 court records and provider plan
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from ovc.research_operations.prospective_source.dukascopy_full_month_mdr import provider_request_plan

          base = Path('docs/releases/pattern-discovery-v0-3/pd-june-full-month-mdr')
          authority = json.loads((base / 'PD_JUNE_FULL_MONTH_MDR_OPERATOR_AUTHORITY.json').read_text())
          qa = json.loads((base / 'PD_JUNE_FULL_MONTH_MDR_WP1_QA_PACKET.json').read_text())
          state = json.loads(Path('registries/research_operations/pattern_discovery/PD_JUNE_FULL_MONTH_MDR_PROGRAMME_STATE_v0_1.json').read_text())
          plan = provider_request_plan()

          assert authority['decision'] == 'PASS'
          assert authority['authority_delta'] == 'READ_ONLY_PROVIDER_INTAKE_REPLAY_AND_REVIEW_CONSTRUCTION_ONLY'
          assert plan['provider_object_count'] == 74
          assert plan['provider_execution_in_ci'] == 'DENIED'
          assert state['packet_id'] == 'PD-JUNE-FM-WP1'
          assert state['status'] == 'GATE_READY'
          assert state['next_packet'] == 'PD-JUNE-FM-WP2'
          assert state['next_packet_status'] == 'BLOCKED_PENDING_FROZEN_LOCAL_SOURCE_SLICE_AND_COMPACT_RECEIPTS'
          assert qa['status'] == 'GATE_READY_EXTERNAL_EXECUTION_REQUIRED'
          PY
      - name: Run focused full-month and intake tests
        run: |
          PYTHONPATH=src python -m unittest \
            tests.research_operations.pattern_discovery.test_pd_june_full_month_mdr \
            tests.research_operations.prospective_source.test_pd_june_full_month_mdr_intake \
            -v
      - name: Run complete repository suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Enforce local-only provider boundary
        run: |
          PYTHONPATH=src python - <<'PY'
          import tempfile
          from pathlib import Path
          from ovc.research_operations.prospective_source import dukascopy_full_month_mdr as subject

          with tempfile.TemporaryDirectory() as repository, tempfile.TemporaryDirectory() as external:
              result = subject.preflight(
                  repository_root=Path(repository),
                  environ={'OVC_EXTERNAL_ARTIFACT_ROOT': external},
              )
              assert result['provider_network_access_performed'] is False
              try:
                  subject.execute_intake(
                      repository_root=Path(repository),
                      gate='PD-JUNE-FM-G1',
                      environ={
                          'OVC_EXTERNAL_ARTIFACT_ROOT': external,
                          'GITHUB_ACTIONS': 'true',
                      },
                  )
              except subject.IntakeError as exc:
                  assert 'prohibited in CI' in str(exc)
              else:
                  raise AssertionError('provider execution unexpectedly allowed in CI')
          PY
