name: PD-JUNE-FULL-MONTH-MDR WP1 intake tooling

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp1-intake-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse current A2 court records and provider plan
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from ovc.research_operations.prospective_source import dukascopy_full_month_mdr_a2 as subject

          base = Path('docs/releases/pattern-discovery-v0-3/pd-june-full-month-mdr')
          authority = json.loads((base / 'PD_JUNE_FULL_MONTH_MDR_OPERATOR_AUTHORITY.json').read_text())
          a1 = json.loads((base / 'PD_JUNE_FULL_MONTH_MDR_A1_OPERATOR_DECISION.json').read_text())
          a2 = json.loads((base / 'PD_JUNE_FULL_MONTH_MDR_A2_OPERATOR_DECISION.json').read_text())
          diagnostic = json.loads((base / 'PD_JUNE_FULL_MONTH_MDR_A2_SOURCE_DIAGNOSTIC_SUMMARY.json').read_text())
          qa = json.loads((base / 'PD_JUNE_FULL_MONTH_MDR_A2_QA_PACKET.json').read_text())
          state = json.loads(Path('registries/research_operations/pattern_discovery/PD_JUNE_FULL_MONTH_MDR_PROGRAMME_STATE_v0_1.json').read_text())
          plan = subject.provider_request_plan()

          assert authority['decision'] == 'PASS'
          assert a1['decision'] == 'PASS'
          assert a2['decision'] == 'PASS'
          assert a2['decision_authority'] == 'OPERATOR'
          assert diagnostic['observations']['m1_bid_ask_timestamp_pairing'] == 'PASS_EXACT'
          assert diagnostic['observations']['native_may_june_ohlc_mismatches'] == 0
          assert plan['provider_object_count'] == 72
          assert plan['plan_amendment'] == 'PD-JUNE-FM-A2-PAIRED-SPARSE-M1-ACCEPTANCE'
          assert plan['paired_sparse_m1_policy'] == 'ACCEPT_EXACTLY_PAIRED_PROVIDER_ABSENCE_WITH_EXPLICIT_CENSORING'
          assert plan['provider_execution_in_ci'] == 'DENIED'
          assert state['packet_id'] == 'PD-JUNE-FM-WP1'
          assert state['plan_amendment'] == 'PD-JUNE-FM-A2-PAIRED-SPARSE-M1-ACCEPTANCE'
          assert state['next_packet_status'] == 'BLOCKED_PENDING_FROZEN_LOCAL_SOURCE_SLICE_AND_COMPACT_RECEIPTS'
          assert qa['status'] in {'IMPLEMENTED_PENDING_CI', 'PASS_FINAL_HEAD_CI', 'COMPLETED_SQUASH_MERGED_TO_MAIN'}
          PY
      - name: Run focused full-month intake tests
        run: |
          PYTHONPATH=src python -m unittest \
            tests.research_operations.pattern_discovery.test_pd_june_full_month_mdr \
            tests.research_operations.prospective_source.test_pd_june_full_month_mdr_intake \
            tests.research_operations.prospective_source.test_pd_june_full_month_mdr_a2 \
            -v
      - name: Run complete repository suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
