name: PD-JUNE-FM-WP2 deterministic full-month replay tooling

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ovc/research_operations/prospective_source/full_month_mdr_compute.py'
      - 'src/ovc/research_operations/prospective_source/full_month_mdr_replay.py'
      - 'scripts/run_pd_june_full_month_mdr_wp2.ps1'
      - 'tests/research_operations/prospective_source/test_pd_june_full_month_mdr_wp2.py'
      - 'schemas/research_operations/pattern_discovery/pd_june_full_month_mdr_wp2_replay_v0_1.schema.json'
      - 'docs/releases/pattern-discovery-v0-3/pd-june-full-month-mdr/PD_JUNE_FULL_MONTH_MDR_WP2_*.json'
      - 'docs/releases/pattern-discovery-v0-3/pd-june-full-month-mdr/PD_JUNE_FULL_MONTH_MDR_WP2_WINDOWS_OPERATOR_GUIDE.md'
      - 'registries/research_operations/pattern_discovery/PD_JUNE_FULL_MONTH_MDR_PROGRAMME_STATE_v0_1.json'
      - '.github/workflows/pd-june-full-month-mdr-wp2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp2-replay-tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and parse WP2 tooling court records
        run: |
          PYTHONPATH=src:. python -m py_compile \
            src/ovc/research_operations/prospective_source/full_month_mdr_compute.py \
            src/ovc/research_operations/prospective_source/full_month_mdr_replay.py
          PYTHONPATH=src:. python - <<'PY'
          import json
          from pathlib import Path
          from ovc.research_operations.prospective_source import full_month_mdr_replay as subject

          base = Path('docs/releases/pattern-discovery-v0-3/pd-june-full-month-mdr')
          qa = json.loads((base / 'PD_JUNE_FULL_MONTH_MDR_WP2_TOOLING_QA_PACKET.json').read_text())
          decision = json.loads((base / 'PD_JUNE_FULL_MONTH_MDR_WP2_TOOLING_DELEGATED_DECISION.json').read_text())
          state = json.loads(Path('registries/research_operations/pattern_discovery/PD_JUNE_FULL_MONTH_MDR_PROGRAMME_STATE_v0_1.json').read_text())
          schema = json.loads(Path('schemas/research_operations/pattern_discovery/pd_june_full_month_mdr_wp2_replay_v0_1.schema.json').read_text())
          index = subject.load_source_acceptance_index(Path.cwd())

          assert index['acceptance']['decision'] == 'PASS'
          assert index['manifest']['logical_sha256'] == subject.SOURCE_MANIFEST_LOGICAL_SHA256
          assert qa['packet_id'] == 'PD-JUNE-FM-WP2'
          assert qa['authority_delta'] == 'DETERMINISTIC_LOCAL_C1_C2_REPLAY_TOOLING_ONLY'
          assert decision['decision_authority'] == 'DELEGATED_BY_OPERATOR_APPROVED_PLAN'
          assert decision['reserved_authority_delta'] == 'NONE'
          assert state['packet_id'] == 'PD-JUNE-FM-WP2'
          assert state['status'] == 'APPROVED'
          assert state['next_packet'] == 'PD-JUNE-FM-WP3'
          assert state['next_packet_status'] == 'BLOCKED_PENDING_WP2_LOCAL_REPLAY_AND_COMPACT_RECEIPTS'
          assert schema['properties']['slice_id']['const'] == subject.SLICE_ID
          assert subject.EXPECTED_C1_RECORDS == 4958
          assert subject.EXPECTED_TARGET_C1_RECORDS == 4526
          assert subject.EXPECTED_C2_STATES == 9420
          assert subject.EXPECTED_TARGET_C2_STATES == 8598
          PY
      - name: Run focused WP2 tooling tests
        run: PYTHONPATH=src:. python -m unittest tests.research_operations.prospective_source.test_pd_june_full_month_mdr_wp2 -v
      - name: Run retained full-month source and A2 tests
        run: |
          PYTHONPATH=src:. python -m unittest \
            tests.research_operations.pattern_discovery.test_pd_june_full_month_mdr \
            tests.research_operations.pattern_discovery.test_pd_june_full_month_mdr_wp1_source_acceptance \
            tests.research_operations.prospective_source.test_pd_june_full_month_mdr_intake \
            tests.research_operations.prospective_source.test_pd_june_full_month_mdr_a2 \
            -v
      - name: Run complete repository suite
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v
      - name: Enforce local-only and repository authority boundary
        shell: bash
        run: |
          set -euo pipefail
          ! find . -type f \( -name '*.bi5' -o -name 'GBPUSD_M1_*_20260530_20260703_UTC.csv' -o -name 'GBPUSD_H1_*_20260530_20260703_UTC.csv' -o -name 'replay-run.json' -o -name 'replay-receipt.json' \) -not -path './.git/*' | grep -q .
          PYTHONPATH=src:. python - <<'PY'
          import tempfile
          from pathlib import Path
          from ovc.research_operations.prospective_source import full_month_mdr_replay as subject

          with tempfile.TemporaryDirectory() as repository:
              try:
                  subject.execute(Path(repository), authority_gate=subject.AUTHORITY_GATE, environ={'GITHUB_ACTIONS':'true'})
              except subject.ComputeError as exc:
                  assert 'prohibited in CI' in str(exc)
              else:
                  raise AssertionError('WP2 replay unexpectedly allowed in CI')
          assert subject.OPERATION_MODE == 'TIME_GATED_REPLAY'
          assert subject.DERIVED_AUTHORITY == 'TIME_GATED_REPLAY_DERIVED'
          PY
          grep -q 'FORMULA_CHANGE' registries/research_operations/pattern_discovery/PD_JUNE_FULL_MONTH_MDR_PROGRAMME_STATE_v0_1.json
          grep -q 'SELECTOR_OR_RELEASE_MUTATION' registries/research_operations/pattern_discovery/PD_JUNE_FULL_MONTH_MDR_PROGRAMME_STATE_v0_1.json
          grep -q 'R2_PUBLICATION' registries/research_operations/pattern_discovery/PD_JUNE_FULL_MONTH_MDR_PROGRAMME_STATE_v0_1.json
          grep -q 'VALIDATION_CONSUMPTION' registries/research_operations/pattern_discovery/PD_JUNE_FULL_MONTH_MDR_PROGRAMME_STATE_v0_1.json
