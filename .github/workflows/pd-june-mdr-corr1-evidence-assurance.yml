name: PD-JUNE-MDR-CORR1 corrective evidence assurance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corrective-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse CORR1 return-gate court records
        run: |
          python - <<'PY'
          import base64
          import gzip
          import json
          from pathlib import Path
          base = Path('docs/releases/pattern-discovery-v0-3/pd-june-mdr-corr1')
          paths = [
              base / 'PD_JUNE_MDR_CORR1_SOURCE_TO_C2_V2_BINDING_RECEIPT.json',
              base / 'PD_JUNE_MDR_CORR1_CHRONOLOGY_PROJECTION.json',
              base / 'PD_JUNE_MDR_CORR1_REVIEWED_STRUCTURAL_ASSURANCE.json',
              base / 'PD_JUNE_MDR_CORR1_OPERATOR_UPLOAD_ASSESSMENT.json',
              base / 'PD_JUNE_MDR_CORR1_DRIVE_EVIDENCE_INVENTORY.json',
              base / 'PD_JUNE_MDR_CORR1_CLAIM_TRIGGER_REPRODUCTION_SUMMARY.json',
              base / 'PD_JUNE_MDR_CORR1_CLAIM_TRIGGER_DIGEST.json',
              base / 'PD_JUNE_MDR_CORR1_EVIDENCE_GAP_MANIFEST.json',
              base / 'PD_JUNE_MDR_CORR1_QA_PACKET.json',
              base / 'PD_JUNE_MDR_G1_RETURN_GATE_PACKET.json',
              Path('registries/research_operations/pattern_discovery/PD_JUNE_2026_REVIEW_ASSURANCE_STATE_v0_1.json'),
              Path('schemas/research_operations/pattern_discovery/pd_june_mdr_corr1_return_gate_v0_1.schema.json'),
          ]
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
          compressed = base64.b64decode(
              (base / 'PD_JUNE_MDR_CORR1_REVIEWED_STRUCTURAL_ASSURANCE.json.gz.b64').read_text().strip(),
              validate=True,
          )
          json.loads(gzip.decompress(compressed).decode('utf-8'))
          PY
      - name: Run focused CORR1 tests
        run: |
          PYTHONPATH=src python -m unittest \
            tests.research_operations.pattern_discovery.test_pd_june_mdr_corr1_evidence_assurance \
            tests.research_operations.pattern_discovery.test_pd_june_mdr_corr1_operator_upload_assessment \
            -v
      - name: Run dependent Pattern Discovery tests
        run: |
          PYTHONPATH=src python -m unittest \
            tests.research_operations.pattern_discovery.test_pd_wp1_transition_candidate_engine \
            tests.research_operations.pattern_discovery.test_pd_wp3_fingerprint_clustering \
            tests.research_operations.pattern_discovery.test_pd_wp4_simple_ui_evidence_bridge \
            -v
      - name: Run complete repository suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Enforce return-gate and retained-authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path('docs/releases/pattern-discovery-v0-3/pd-june-mdr-corr1')
          binding = json.loads((base / 'PD_JUNE_MDR_CORR1_SOURCE_TO_C2_V2_BINDING_RECEIPT.json').read_text())
          chronology = json.loads((base / 'PD_JUNE_MDR_CORR1_CHRONOLOGY_PROJECTION.json').read_text())
          structural = json.loads((base / 'PD_JUNE_MDR_CORR1_REVIEWED_STRUCTURAL_ASSURANCE.json').read_text())
          drive = json.loads((base / 'PD_JUNE_MDR_CORR1_DRIVE_EVIDENCE_INVENTORY.json').read_text())
          repro = json.loads((base / 'PD_JUNE_MDR_CORR1_CLAIM_TRIGGER_REPRODUCTION_SUMMARY.json').read_text())
          digest = json.loads((base / 'PD_JUNE_MDR_CORR1_CLAIM_TRIGGER_DIGEST.json').read_text())
          gaps = json.loads((base / 'PD_JUNE_MDR_CORR1_EVIDENCE_GAP_MANIFEST.json').read_text())
          qa = json.loads((base / 'PD_JUNE_MDR_CORR1_QA_PACKET.json').read_text())
          gate = json.loads((base / 'PD_JUNE_MDR_G1_RETURN_GATE_PACKET.json').read_text())
          state = json.loads(Path('registries/research_operations/pattern_discovery/PD_JUNE_2026_REVIEW_ASSURANCE_STATE_v0_1.json').read_text())
          assert binding['status'] == 'PASS_SOURCE_BYTES_AND_REPLAY_ACCEPTANCE_CARRIED_FORWARD_TO_EXPLICIT_C2_V2_PILOT_IDENTITY'
          assert binding['interpretation']['replay_performed_by_corr1'] is False
          assert chronology['candidate_count'] == 208
          assert chronology['corrected_projection_nonchronological_count'] == 0
          assert structural['exact_distance_recomputation_count'] == 24
          assert structural['unassigned_small_sample_count'] == 2
          assert drive['source_compute_manifest']['verification'] == 'PASS_21_OF_21_HASH_AND_SIZE'
          assert len(drive['source_manifest_members']) == 21
          assert digest['status'] == 'PASS_EXACT_EVIDENCE_DIGESTS_BOUND'
          assert digest['state_claims']['exact_core_match_count'] == 48
          assert digest['trigger_reproduction']['recorded_event_match_count'] == 26
          assert repro['population_state_reproduction']['exact_core_match_count'] == 1144
          assert repro['population_state_reproduction']['mismatch_count'] == 0
          assert repro['review_claim_evidence']['state_claim_exact_match_count'] == 48
          assert repro['review_claim_evidence']['trigger_reproduction_count'] == 26
          assert repro['review_claim_evidence']['history_dependent_exact_reproduction_count'] == 11
          assert repro['c1_formula_assurance']['opposite_sign_count'] == 589
          assert repro['c1_formula_assurance']['c2_semantic_dependency'] == 'NONE'
          assert gaps['status'] == 'GATE_READY_CONTROL_AND_AGREEMENT_EVIDENCE_REQUIRED'
          assert {item['code'] for item in gaps['open_blockers']} == {'PD-JUNE-MDR-006'}
          assert qa['recommendation'] == 'DEFER_TO_OPERATOR_REQUIRED_READ_ONLY_CONTROL_AND_AGREEMENT_ASSURANCE'
          assert gate['gate_status'] == 'GATE_READY_OPERATOR_DECISION_REQUIRED'
          assert gate['recommended_decision'] == 'DEFER'
          assert gate['overall_answer']['verdict'] == 'NOT_ESTABLISHED'
          assert state['status'] == 'GATE_READY'
          assert state['next_packet_on_defer'] == 'PD-JUNE-MDR-CORR2-CONTROL-AND-AGREEMENT-ASSURANCE'
          assert state['canonical_2021_2023_discovery'] == 'DEFERRED_NOT_AUTHORISED'
          assert state['second_june_replay'] == 'DENIED_NOT_REQUIRED'
          for prohibited in ('PROVIDER_INTAKE', 'MACHINE_REPLAY', 'CANONICAL_2021_2023_DISCOVERY_PROCESSING_OR_APPEND', 'R2_PUBLICATION', 'VALIDATION_CONSUMPTION'):
              assert prohibited in state['retained_prohibitions']
          PY
