name: PD-WP2 Trigger Control and Novelty Shadow

on:
  pull_request:
    paths:
      - "src/ovc/research_operations/pattern_discovery/**"
      - "contracts/research_operations/pattern_discovery/PATTERN_DISCOVERY_TRIGGER_CONTROL_AND_NOVELTY_SHADOW_CONTRACT_v0_1.md"
      - "tests/research_operations/pattern_discovery/**"
      - "registries/research_operations/pattern_discovery/**"
      - "docs/releases/pattern-discovery-v0-3/pd-wp2/**"
      - ".github/workflows/pd-wp2-trigger-control-novelty.yml"
  workflow_dispatch:

jobs:
  pd-wp2:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: PD-WP2 structural trigger cases
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp2_trigger_control_novelty.PatternDiscoveryWP2Tests.test_structural_triggers_have_fired_negative_and_not_evaluable_results

      - name: PD-WP2 persistence and switching cases
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp2_trigger_control_novelty.PatternDiscoveryWP2Tests.test_return_inside_persistence_and_switching_are_first_crossing_only

      - name: PD-WP2 deterministic controls
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp2_trigger_control_novelty.PatternDiscoveryWP2Tests.test_control_selection_and_representation_are_deterministic

      - name: PD-WP2 novelty authority boundary
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp2_trigger_control_novelty.PatternDiscoveryWP2Tests.test_novelty_baseline_and_shadow_never_change_queue_authority

      - name: PD-WP2 queue backpressure
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp2_trigger_control_novelty.PatternDiscoveryWP2Tests.test_queue_projection_enforces_caps_and_control_reservation

      - name: PD-WP2 latency degradation
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp2_trigger_control_novelty.PatternDiscoveryWP2Tests.test_latency_degradation_is_explicit

      - name: Run full PD-WP2 focused suite
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp2_trigger_control_novelty

      - name: Run PD-WP1 retained-foundation tests
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp1_transition_candidate_engine

      - name: Run PD-G0 retained-boundary tests
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_g0_design_freeze

      - name: Run canonical repository tests
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_*.py' > canonical-tests.log 2>&1
          status=$?
          cat canonical-tests.log
          exit $status

      - name: Upload canonical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pd-wp2-canonical-tests
          path: canonical-tests.log
          if-no-files-found: ignore
