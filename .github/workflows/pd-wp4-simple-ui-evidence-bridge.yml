name: PD-WP4 Simple UI and Evidence Bridge Candidate

on:
  pull_request:
    paths:
      - "src/ovc/research_operations/pattern_discovery/**"
      - "apps/research_console/pattern_discovery*.py"
      - "tests/research_operations/pattern_discovery/**"
      - "registries/research_operations/pattern_discovery/**"
      - "docs/releases/pattern-discovery-v0-3/pd-wp4/**"
      - ".github/workflows/pd-wp4-simple-ui-evidence-bridge.yml"
  workflow_dispatch:

jobs:
  pd-wp4:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: PD-WP4 three-view UI
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp4_simple_ui_evidence_bridge.PatternDiscoveryWP4Tests.test_simple_ui_has_exactly_three_views_and_write_is_disabled
      - name: PD-WP4 review lineage
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp4_simple_ui_evidence_bridge.PatternDiscoveryWP4Tests.test_review_projections_preserve_lineage_and_permitted_classes
      - name: PD-WP4 price strip
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp4_simple_ui_evidence_bridge.PatternDiscoveryWP4Tests.test_price_strip_uses_exact_opt_a_release_and_cannot_outrun_c2
      - name: PD-WP4 source resolver
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp4_simple_ui_evidence_bridge.PatternDiscoveryWP4Tests.test_source_resolver_prevents_manual_or_mismatched_ids
      - name: PD-WP4 disabled bridge
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp4_simple_ui_evidence_bridge.PatternDiscoveryWP4Tests.test_bridge_is_disabled_until_operator_gate
      - name: PD-WP4 atomic idempotent bridge
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp4_simple_ui_evidence_bridge.PatternDiscoveryWP4Tests.test_candidate_bridge_is_atomic_idempotent_and_audit_chained
      - name: PD-WP4 rejection paths
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp4_simple_ui_evidence_bridge.PatternDiscoveryWP4Tests.test_bridge_rejects_replay_duplicate_body_sequence_and_exposure_fields
      - name: Run full PD-WP4 focused tests
        run: python -m unittest tests.research_operations.pattern_discovery.test_pd_wp4_simple_ui_evidence_bridge
      - name: Run retained Pattern Discovery tests
        run: |
          python -m unittest tests.research_operations.pattern_discovery.test_pd_wp3_fingerprint_clustering
          python -m unittest tests.research_operations.pattern_discovery.test_pd_wp2_trigger_control_novelty
          python -m unittest tests.research_operations.pattern_discovery.test_pd_wp1_transition_candidate_engine
          python -m unittest tests.research_operations.pattern_discovery.test_pd_g0_design_freeze
      - name: Run canonical repository tests
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_*.py' > canonical-tests.log 2>&1
          status=$?
          cat canonical-tests.log
          exit $status
      - name: Upload canonical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pd-wp4-canonical-tests
          path: canonical-tests.log
          if-no-files-found: ignore
