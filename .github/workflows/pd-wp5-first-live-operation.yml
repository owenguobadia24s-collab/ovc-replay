name: PD-WP5 first LIVE_PROSPECTIVE operation readiness

on:
  pull_request:
    paths:
      - "src/ovc/research_operations/pattern_discovery/first_live_operation.py"
      - "scripts/run_pd_wp5_first_live_operation.ps1"
      - "contracts/research_operations/pattern_discovery/PD_WP5_FIRST_LIVE_PROSPECTIVE_OPERATION_CONTRACT_v0_1.md"
      - "contracts/research_operations/pattern_discovery/PD_WP5_PILOT_DISCOVERY_OPERATION_CONTRACT_v0_1.md"
      - "docs/releases/pattern-discovery-v0-3/pd-wp5/**"
      - "registries/research_operations/pattern_discovery/PD_WP5_STATE_v0_1.json"
      - "registries/research_operations/pattern_discovery/PD_G4B_PILOT_DISCOVERY_GATE_STATE_v0_1.json"
      - "registries/research_operations/prospective_source/RPS_G4A_GATE_STATE_v0_1.json"
      - "tests/research_operations/pattern_discovery/test_pd_wp5_first_live_operation.py"
      - "tests/research_operations/pattern_discovery/test_pd_wp5_pilot_discovery_amendment.py"
      - ".github/workflows/pd-wp5-first-live-operation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Historical first-live diagnostic tests
        run: >-
          PYTHONPATH=src python -m unittest discover
          -s tests/research_operations/pattern_discovery
          -p 'test_pd_wp5_first_live_operation.py'
          -v
      - name: Pilot amendment tests
        run: >-
          PYTHONPATH=src python -m unittest discover
          -s tests/research_operations/pattern_discovery
          -p 'test_pd_wp5_pilot_discovery_amendment.py'
          -v
      - name: Canonical repository tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Assert historical diagnostic does not access provider
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'urllib|requests\.|urlopen|datafeed\.dukascopy|historicalPrices' \
            src/ovc/research_operations/pattern_discovery/first_live_operation.py; then
            echo "Provider-network code found in PD-WP5 diagnostic."
            exit 1
          fi
      - name: Assert historical live blocker is preserved but superseded for pilot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          packet = json.loads(Path('registries/research_operations/pattern_discovery/PD_WP5_STATE_v0_1.json').read_text())
          rps = json.loads(Path('registries/research_operations/prospective_source/RPS_G4A_GATE_STATE_v0_1.json').read_text())
          amendment = json.loads(Path('registries/research_operations/pattern_discovery/PD_G4B_PILOT_DISCOVERY_GATE_STATE_v0_1.json').read_text())
          historical = packet['superseded_first_operation']
          assert historical['operation'] == 'FIRST_LIVE_PROSPECTIVE_PATTERN_DISCOVERY_BATCH'
          assert historical['status'] == 'SUPERSEDED_FOR_PILOT_DISCOVERY'
          assert historical['blocker_code'] == 'ACTIVE_BINDING_HAS_NO_POST_ACTIVATION_MARKET_COVERAGE'
          assert rps['gate_status'] == 'SUPERSEDED_FOR_PILOT_DISCOVERY'
          assert rps['provider_request_authority'] == 'DENIED'
          assert rps['future_live_gate'] == 'RPS-LIVE-G1'
          assert amendment['gate_status'] == 'GATE_READY'
          assert amendment['operator_approval_required'] is True
          assert packet['decision'] is None
          PY
      - name: Assert Pilot Discovery is not live relabelling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(Path('registries/research_operations/pattern_discovery/PD_G4B_PILOT_DISCOVERY_GATE_STATE_v0_1.json').read_text())
          assert gate['research_role'] == 'PILOT_DISCOVERY'
          assert gate['operation_mode'] == 'TIME_GATED_REPLAY'
          assert gate['pilot_only'] is True
          assert gate['promotion_eligibility'] == 'NON_PROMOTABLE'
          assert gate['canonical_discovery_population'] is False
          assert gate['live_prospective_relabelling'] == 'DENIED'
          assert gate['canonical_append'] == 'DENIED'
          assert gate['identity_reset_before_canonical'] == 'REQUIRED'
          PY
      - name: Assert retained prohibitions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('registries/research_operations/pattern_discovery/PD_WP5_STATE_v0_1.json').read_text())
          assert state['automatic_evidence_creation'] is False
          for field in ('active_novelty_ranking', 'semantic_promotion', 'family_promotion', 'probability_authority', 'risk_authority', 'exposure_authority', 'trading_authority', 'execution_authority', 'agent_write_authority'):
              assert state[field] == 'NONE', (field, state[field])
          assert state['selector_mutation'] == 'DENIED'
          assert state['release_mutation'] == 'DENIED'
          assert state['r2_publication'] == 'DENIED'
          assert state['validation_consumption'] == 'DENIED'
          PY
