name: PRVITR frontier narrow harness correction

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: prvitr-frontier-narrow-harness-temp
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'fix/prvitr-vit-frontier-decoupling-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prvitr-vit-frontier-decoupling-20260818
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Narrow integration-harness invalidation and add live regression
        shell: bash
        run: |
          set -euo pipefail
          source_head=$(git rev-parse HEAD)
          python3 - <<'PY'
          from pathlib import Path

          core = Path('src/ovc/development/skills/vit_frontier_decoupling.py')
          text = core.read_text(encoding='utf-8')
          old = '''DEFAULT_GLOBAL_INTEGRATION_PATTERNS = (
              ".github/workflows/**",
              "tools/ci/**",
              "src/ovc/development/**",
              "tests/development/**",
              "registries/development/**",
          )'''
          new = '''DEFAULT_GLOBAL_INTEGRATION_PATTERNS = (
              ".github/workflows/tests.yml",
              ".github/workflows/ovc-tiered-tests.yml",
              "tools/ci/prvitr_live_admission.py",
              "tools/ci/vit_*.py",
              "tools/ci/ovc_run_with_main_lease.py",
              "src/ovc/development/head_churn.py",
              "src/ovc/development/skills/vit_*.py",
              "src/ovc/development/skills/siq_*.py",
              "src/ovc/development/skills/orch345_active.py",
              "tests/development/test_prvitr_*.py",
              "tests/development/test_siq_*.py",
              "tests/development_skills/test_vit_*.py",
              "tests/development_skills/test_dsai3v_vit_*.py",
              "registries/development/OVC_DEVELOPMENT_ACCELERATION_TEST_PROFILE_REGISTRY_v0_1.json",
              "registries/development/skills/orch345_operational_capacity_v0_2.json",
          )'''
          if old not in text and new not in text:
              raise SystemExit('expected integration pattern block not found')
          if old in text:
              text = text.replace(old, new, 1)
              core.write_text(text, encoding='utf-8')

          test = Path('tests/development/test_prvitr_vit_frontier_decoupling.py')
          t = test.read_text(encoding='utf-8')
          marker = '    def test_global_integration_movement_reuses_a0_and_renews_a1_a2(self) -> None:\n'
          method = '''    def test_unrelated_development_skill_main_movement_is_placement_only(self) -> None:
              _, new_tree = self.fx.advance_main(
                  "src/ovc/development/skills/cers/runtime.py", "# unrelated development skill\\n"
              )
              movement = classify_frontier_movement(
                  pip=self.fx.pip,
                  source_predecessor_tree=self.fx.base_tree,
                  current_predecessor_tree=new_tree,
                  changed_paths=diff_tree_paths(self.fx.root, self.fx.base_tree, new_tree),
              )
              self.assertEqual(movement.disposition, "PLACEMENT_RECOMPUTE_ONLY")
              self.assertTrue(movement.a0_reuse_allowed)
              self.assertTrue(movement.a1_renewal_required)
              self.assertTrue(movement.a2_renewal_required)
              self.assertFalse(movement.payload_rebuild_required)

'''
          if 'def test_unrelated_development_skill_main_movement_is_placement_only' not in t:
              if marker not in t:
                  raise SystemExit('test insertion marker not found')
              t = t.replace(marker, method + marker, 1)
              test.write_text(t, encoding='utf-8')
          PY
          PYTHONPATH=src python -m unittest \
            tests.development.test_prvitr_vit_frontier_decoupling.PRVITRVITFrontierDecouplingTests.test_unrelated_development_skill_main_movement_is_placement_only \
            tests.development.test_prvitr_vit_frontier_decoupling.PRVITRVITFrontierDecouplingTests.test_global_integration_movement_reuses_a0_and_renews_a1_a2 -v
          git add src/ovc/development/skills/vit_frontier_decoupling.py tests/development/test_prvitr_vit_frontier_decoupling.py
          if git diff --cached --quiet; then
            echo OVC_FRONTIER_NARROW_HARNESS_ALREADY_APPLIED=true
            exit 0
          fi
          git config user.name 'OVC PRVITR Frontier Repair'
          git config user.email 'ovc-prvitr-frontier-repair@localhost'
          git commit -m 'DSAI3V: distinguish unrelated development movement from integration harness'
          git fetch --no-tags origin fix/prvitr-vit-frontier-decoupling-20260818
          test "$(git rev-parse FETCH_HEAD)" = "$source_head"
          git push origin HEAD:refs/heads/fix/prvitr-vit-frontier-decoupling-20260818
