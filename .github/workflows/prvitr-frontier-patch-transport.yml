name: PRVITR frontier patch transport

on:
  push:
    branches:
      - transport/prvitr-vit-frontier-decoupling-20260818
    paths:
      - .github/workflows/prvitr-frontier-patch-transport.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prvitr-frontier-patch-transport-v1
  cancel-in-progress: false

jobs:
  materialise:
    name: Materialise exact frontier-decoupling patch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: fix/prvitr-vit-frontier-decoupling-20260818
      TRANSPORT_BRANCH: transport/prvitr-vit-frontier-decoupling-20260818
      EXPECTED_SHA256: 3a421f593035d452f5778e2d02e68ca0c595283c64e08bb4a67b69d787d6032f
      EXPECTED_BYTES: "62248"
      EXPECTED_FILE_COUNT: "32"
    steps:
      - name: Check out the existing packet branch without reanchoring
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ github.token }}
          show-progress: false

      - name: Reconstruct and verify the exact local patch archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "${TRANSPORT_BRANCH}:refs/remotes/origin/${TRANSPORT_BRANCH}"

          b64="$RUNNER_TEMP/frontier_patch.b64"
          archive="$RUNNER_TEMP/frontier_patch.tar.gz"
          : > "$b64"
          for number in $(seq 0 10); do
            part=$(printf '%03d' "$number")
            git show \
              "refs/remotes/origin/${TRANSPORT_BRANCH}:bundle2/part-${part}.b64" \
              >> "$b64"
          done
          base64 --decode "$b64" > "$archive"

          test "$(stat -c %s "$archive")" = "$EXPECTED_BYTES"
          echo "${EXPECTED_SHA256}  ${archive}" | sha256sum --check --strict

          ARCHIVE="$archive" EXPECTED_PATHS="$RUNNER_TEMP/expected-paths.txt" \
          EXPECTED_FILE_COUNT="$EXPECTED_FILE_COUNT" python3 - <<'PY'
          import os
          import pathlib
          import tarfile

          archive = pathlib.Path(os.environ["ARCHIVE"])
          expected_paths = pathlib.Path(os.environ["EXPECTED_PATHS"])
          expected_count = int(os.environ["EXPECTED_FILE_COUNT"])
          files: list[str] = []
          with tarfile.open(archive, "r:gz") as handle:
              for member in handle.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  parts = tuple(part for part in path.parts if part not in {"", "."})
                  if path.is_absolute() or ".." in parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(f"non-regular archive member: {member.name}")
                  if member.isfile():
                      files.append(pathlib.PurePosixPath(*parts).as_posix())
          files = sorted(files)
          if len(files) != expected_count or len(files) != len(set(files)):
              raise SystemExit(
                  f"archive file population mismatch: observed={len(files)} expected={expected_count}"
              )
          expected_paths.write_text("\n".join(files) + "\n", encoding="utf-8")
          print(f"OVC_FRONTIER_ARCHIVE_VERIFIED files={len(files)}")
          PY

      - name: Materialise and byte-verify every archive file
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/frontier_patch.tar.gz"
          source_root="$RUNNER_TEMP/frontier_patch_source"
          expected_paths="$RUNNER_TEMP/expected-paths.txt"
          mkdir -p "$source_root"
          tar -xzf "$archive" -C "$source_root" --no-same-owner --no-same-permissions
          cp -a "$source_root"/. "$GITHUB_WORKSPACE"/

          SOURCE_ROOT="$source_root" WORKSPACE="$GITHUB_WORKSPACE" \
          EXPECTED_PATHS="$expected_paths" python3 - <<'PY'
          import hashlib
          import os
          import pathlib

          source_root = pathlib.Path(os.environ["SOURCE_ROOT"])
          workspace = pathlib.Path(os.environ["WORKSPACE"])
          paths = pathlib.Path(os.environ["EXPECTED_PATHS"]).read_text(
              encoding="utf-8"
          ).splitlines()

          def digest(path: pathlib.Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          failures: list[str] = []
          for relative in paths:
              source = source_root / relative
              target = workspace / relative
              if not target.is_file() or digest(source) != digest(target):
                  failures.append(relative)
          if failures:
              raise SystemExit("materialised-file mismatch: " + ",".join(failures))
          print(f"OVC_FRONTIER_MATERIALISATION_VERIFIED files={len(paths)}")
          PY

          git add -A
          EXPECTED_PATHS="$expected_paths" python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          expected = set(
              pathlib.Path(os.environ["EXPECTED_PATHS"])
              .read_text(encoding="utf-8")
              .splitlines()
          )
          raw = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "-z"]
          )
          changed = {
              item.decode("utf-8") for item in raw.split(b"\0") if item
          }
          unexpected = sorted(changed - expected)
          if unexpected:
              raise SystemExit(
                  "transport attempted out-of-bundle mutation: " + ",".join(unexpected)
              )
          print(
              "OVC_FRONTIER_STAGED_SUBSET_VERIFIED "
              f"changed={len(changed)} archive_files={len(expected)}"
          )
          PY

      - name: Commit and fast-forward the same permanent packet branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "OVC_FRONTIER_PATCH_ALREADY_MATERIALISED"
            exit 0
          fi
          git config user.name "OVC PRVITR Frontier Transport"
          git config user.email "ovc-prvitr-frontier-transport@localhost"
          git commit -m "DSAI3V: materialise exact PRVITR frontier-decoupling patch"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "OVC_FRONTIER_PATCH_PUSHED=$(git rev-parse HEAD)"
