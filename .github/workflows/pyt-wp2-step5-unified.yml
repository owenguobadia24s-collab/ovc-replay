name: PYT-WP2 Step 5 unified pytest diagnostic

on:
  push:
    branches:
      - build/python-test-runner-step5-current-main-20260813

permissions:
  contents: read

jobs:
  pytest-unified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maintained test dependencies
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt
      - name: Run unified pytest surface
        run: PYTHONPATH=src:. python3 -m pytest -q --continue-on-collection-errors --tb=short --junitxml=pytest-unified-results.xml
      - name: Upload unified pytest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyt-wp2-step5-pytest-unified-results
          path: pytest-unified-results.xml
          if-no-files-found: warn
          retention-days: 1

  final-head-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run compact development and authority surface
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m unittest discover -s tests/development -q > /tmp/final-head.log 2>&1
          s1=$?
          PYTHONPATH=src python -m unittest discover -s tests/authority -q >> /tmp/final-head.log 2>&1
          s2=$?
          cat /tmp/final-head.log
          if [ "$s1" -ne 0 ] || [ "$s2" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/final-head.log').read_text(encoding='utf-8', errors='replace')
          tail = text[-12000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::error title=PYT WP2 FINAL_HEAD diagnostic::{tail}')
          PY
            exit 1
          fi
