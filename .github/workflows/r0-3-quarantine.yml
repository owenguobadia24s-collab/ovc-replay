name: R0 Exact-Path Quarantine Migration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r0-3-quarantine.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out reset branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute approved exact-path moves
        run: python tools/r0/migrate_quarantine.py migrate
      - name: Compile active source tree
        run: python -m compileall -q src
      - name: Test active tree after quarantine
        run: |
          set -o pipefail
          PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee docs/history/repository-freezes/ovc-replay-v1-c0ad7ba/R0_3_POST_MOVE_TESTS.log
      - name: Commit quarantine migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'R0-3 quarantine legacy ABCD engine'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
