name: R0 Active-Tree Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r0-4-foundation.yml'

permissions:
  contents: write

jobs:
  foundation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out reset branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build active-tree foundation
        run: python tools/r0/build_active_tree_foundation.py build
      - name: Validate active-tree foundation
        run: python tools/r0/build_active_tree_foundation.py test
      - name: Seal R0-4 packet
        run: python tools/r0/build_active_tree_foundation.py seal
      - name: Commit active-tree foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No R0-4 changes to commit.'
          else
            git commit -m 'R0-4 establish active-tree foundation'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
