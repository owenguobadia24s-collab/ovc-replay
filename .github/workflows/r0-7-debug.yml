name: R0 Final Validation Debug

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/r0-7-debug.yml'

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture R0-7 test output
        run: |
          python tools/r0/finalize_reset.py execute
          set +e
          PYTHONPATH=src python -m unittest discover -s tests -v > /tmp/R0_7_DEBUG_TEST_OUTPUT.log 2>&1
          status=$?
          git reset --hard HEAD
          git clean -fd
          cp /tmp/R0_7_DEBUG_TEST_OUTPUT.log docs/history/repository-freezes/ovc-replay-v1-c0ad7ba/R0_7_DEBUG_TEST_OUTPUT.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/history/repository-freezes/ovc-replay-v1-c0ad7ba/R0_7_DEBUG_TEST_OUTPUT.log
          git commit -m 'R0-7 capture final validation test output'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit 0
