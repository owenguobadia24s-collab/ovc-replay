name: R0 Baseline Freeze

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/r0-baseline-freeze.yml"

permissions:
  contents: write

jobs:
  freeze-baseline:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'build/v2-foundation-reset'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out reset branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build baseline freeze packet
        id: freeze
        shell: bash
        env:
          BASELINE_SHA: c0ad7ba22618babdde731e2a338f68f688d4210c
          ARCHIVE_BRANCH: archive/ovc-replay-v1-c0ad7ba-20260725
          PACKET_DIR: docs/history/repository-freezes/ovc-replay-v1-c0ad7ba
        run: |
          set -uo pipefail
          mkdir -p "$PACKET_DIR"
          git fetch origin main "$ARCHIVE_BRANCH" --no-tags

          ORIGIN_MAIN_SHA="$(git rev-parse origin/main)"
          ARCHIVE_SHA="$(git rev-parse "origin/$ARCHIVE_BRANCH")"
          RESET_HEAD_SHA="$(git rev-parse HEAD)"
          RESET_COMMITS="$(git rev-list --reverse "$BASELINE_SHA"..HEAD | tr '\n' ' ' | sed 's/ $//')"

          MAIN_MATCH=false
          ARCHIVE_MATCH=false
          BASELINE_PRESENT=false
          git cat-file -e "$BASELINE_SHA^{commit}" && BASELINE_PRESENT=true
          [[ "$ORIGIN_MAIN_SHA" == "$BASELINE_SHA" ]] && MAIN_MATCH=true
          [[ "$ARCHIVE_SHA" == "$BASELINE_SHA" ]] && ARCHIVE_MATCH=true

          rm -rf /tmp/ovc-baseline
          git worktree add --detach /tmp/ovc-baseline "$BASELINE_SHA"

          set +e
          python -m pip install --upgrade pip setuptools wheel pytest >"$PACKET_DIR/PYTHON_ENVIRONMENT.log" 2>&1
          ENV_STATUS=$?
          if [[ $ENV_STATUS -eq 0 ]]; then
            python -m pip install -e /tmp/ovc-baseline >>"$PACKET_DIR/PYTHON_ENVIRONMENT.log" 2>&1
            INSTALL_STATUS=$?
          else
            INSTALL_STATUS=99
          fi
          if [[ $ENV_STATUS -eq 0 && $INSTALL_STATUS -eq 0 ]]; then
            (
              cd /tmp/ovc-baseline
              python -m compileall -q src
            ) >"$PACKET_DIR/COMPILEALL.log" 2>&1
            COMPILE_STATUS=$?
            (
              cd /tmp/ovc-baseline
              python -m pytest -q
            ) >"$PACKET_DIR/PYTEST_BASELINE.log" 2>&1
            TEST_STATUS=$?
          else
            COMPILE_STATUS=99
            TEST_STATUS=99
            printf 'Tests not run because environment or editable installation failed.\n' >"$PACKET_DIR/PYTEST_BASELINE.log"
            printf 'Compile check not run because environment or editable installation failed.\n' >"$PACKET_DIR/COMPILEALL.log"
          fi
          set -e

          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          baseline = os.environ["BASELINE_SHA"]
          packet_dir = Path(os.environ["PACKET_DIR"])

          raw = subprocess.check_output(
              ["git", "ls-tree", "-r", "-l", "--full-tree", baseline],
              text=True,
          )
          inventory = []
          hashes = []
          selector_snapshot = []
          selector_name = re.compile(r"selector|active|current_status", re.IGNORECASE)
          selector_terms = (b"active_selector", b"ACTIVE_DISCOVERY", b"authority_state")
          total_bytes = 0

          for line in raw.splitlines():
              meta, path = line.split("\t", 1)
              mode, obj_type, blob_sha, size_text = meta.split(None, 3)
              size = None if size_text == "-" else int(size_text)
              content = subprocess.check_output(["git", "cat-file", "-p", blob_sha])
              digest = hashlib.sha256(content).hexdigest()
              if size is not None:
                  total_bytes += size
              inventory.append(
                  {
                      "path": path,
                      "mode": mode,
                      "object_type": obj_type,
                      "git_blob_sha1": blob_sha,
                      "size_bytes": size,
                  }
              )
              hashes.append(
                  {
                      "path": path,
                      "git_blob_sha1": blob_sha,
                      "sha256": digest,
                      "size_bytes": size,
                  }
              )

              name_match = bool(selector_name.search(Path(path).name))
              content_match = any(term in content for term in selector_terms)
              canonical_status = path.lower() == "docs/current_status.md"
              if name_match or content_match or canonical_status:
                  record = {
                      "path": path,
                      "git_blob_sha1": blob_sha,
                      "sha256": digest,
                      "size_bytes": size,
                      "match_basis": {
                          "filename": name_match,
                          "content_term": content_match,
                          "canonical_status": canonical_status,
                      },
                  }
                  if len(content) <= 262144:
                      try:
                          record["utf8_content"] = content.decode("utf-8")
                      except UnicodeDecodeError:
                          record["utf8_content"] = None
                  selector_snapshot.append(record)

          inventory_document = {
              "schema": "OVC_R0_TRACKED_FILE_INVENTORY_v0_1",
              "repository": "owenguobadia24s-collab/ovc-replay",
              "baseline_commit": baseline,
              "file_count": len(inventory),
              "total_blob_bytes": total_bytes,
              "files": inventory,
          }
          hash_document = {
              "schema": "OVC_R0_TRACKED_FILE_HASHES_v0_1",
              "repository": "owenguobadia24s-collab/ovc-replay",
              "baseline_commit": baseline,
              "algorithm": "SHA-256 over exact Git blob bytes",
              "file_count": len(hashes),
              "files": hashes,
          }
          selector_document = {
              "schema": "OVC_R0_ACTIVE_SELECTOR_SNAPSHOT_v0_1",
              "repository": "owenguobadia24s-collab/ovc-replay",
              "baseline_commit": baseline,
              "selection_method": "filename selector/active/current_status, canonical docs/CURRENT_STATUS.md, or exact active_selector/ACTIVE_DISCOVERY/authority_state content terms",
              "candidate_count": len(selector_snapshot),
              "candidates": selector_snapshot,
          }

          for name, document in (
              ("TRACKED_FILE_INVENTORY.json", inventory_document),
              ("TRACKED_FILE_HASHES.json", hash_document),
              ("ACTIVE_SELECTOR_SNAPSHOT.json", selector_document),
          ):
              (packet_dir / name).write_text(
                  json.dumps(document, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          aggregate = hashlib.sha256()
          for record in hashes:
              aggregate.update(record["path"].encode("utf-8"))
              aggregate.update(b"\0")
              aggregate.update(record["sha256"].encode("ascii"))
              aggregate.update(b"\n")
          (packet_dir / "TRACKED_TREE_SHA256.txt").write_text(
              aggregate.hexdigest() + "\n", encoding="ascii"
          )
          PY

          FILE_COUNT="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["PACKET_DIR"],"TRACKED_FILE_INVENTORY.json")))["file_count"])')"
          TOTAL_BYTES="$(python -c 'import json,os; print(json.load(open(os.path.join(os.environ["PACKET_DIR"],"TRACKED_FILE_INVENTORY.json")))["total_blob_bytes"])')"
          TREE_SHA256="$(cat "$PACKET_DIR/TRACKED_TREE_SHA256.txt")"
          PYTEST_SUMMARY="$(tail -n 3 "$PACKET_DIR/PYTEST_BASELINE.log" | sed 's/[`]/\\`/g')"

          if [[ "$BASELINE_PRESENT" == true && "$MAIN_MATCH" == true && "$ARCHIVE_MATCH" == true && $ENV_STATUS -eq 0 && $INSTALL_STATUS -eq 0 && $COMPILE_STATUS -eq 0 && $TEST_STATUS -eq 0 ]]; then
            R0_1_STATUS=PASS
          else
            R0_1_STATUS=BLOCKED
          fi

          cat >"$PACKET_DIR/REPOSITORY_FREEZE_RECORD.md" <<EOF
          # OVC Repository Freeze Record

          - Repository: \`owenguobadia24s-collab/ovc-replay\`
          - Frozen baseline commit: \`$BASELINE_SHA\`
          - Historical archive branch: \`$ARCHIVE_BRANCH\`
          - Archive branch commit: \`$ARCHIVE_SHA\`
          - Main observed commit: \`$ORIGIN_MAIN_SHA\`
          - Reset branch observed commit before packet commit: \`$RESET_HEAD_SHA\`
          - Tracked file count: **$FILE_COUNT**
          - Total tracked Git blob bytes: **$TOTAL_BYTES**
          - Deterministic tracked-tree SHA-256: \`$TREE_SHA256\`
          - R0-1 result: **$R0_1_STATUS**

          ## Historical authority

          The baseline is frozen as the historical v1 court record. It may be used for historical audit, source crosswalks, defect-fixture derivation and legacy-result reference. It may not become an active parent, new discovery seed, parameter source, selector fallback or rollback target for the v2 discovery line.

          ## Reset-branch ancestry

          Commits after the frozen baseline and before this packet were generated:

          \`$RESET_COMMITS\`
          EOF

          cat >"$PACKET_DIR/PREFLIGHT_REPORT.md" <<EOF
          # R0-1 Baseline Preflight Report

          | Check | Result | Evidence |
          |---|---:|---|
          | Baseline commit is present | $BASELINE_PRESENT | \`git cat-file -e $BASELINE_SHA^{commit}\` |
          | Remote main equals approved baseline | $MAIN_MATCH | \`$ORIGIN_MAIN_SHA\` |
          | Archive branch equals approved baseline | $ARCHIVE_MATCH | \`$ARCHIVE_SHA\` |
          | Python environment setup | $ENV_STATUS | \`PYTHON_ENVIRONMENT.log\` |
          | Editable baseline install | $INSTALL_STATUS | \`PYTHON_ENVIRONMENT.log\` |
          | Source compile check | $COMPILE_STATUS | \`COMPILEALL.log\` |
          | Baseline pytest suite | $TEST_STATUS | \`PYTEST_BASELINE.log\` |
          | Inventory generated | PASS | $FILE_COUNT tracked files |
          | Exact SHA-256 ledger generated | PASS | \`TRACKED_FILE_HASHES.json\` |
          | Selector/status snapshot generated | PASS | \`ACTIVE_SELECTOR_SNAPSHOT.json\` |

          ## Pytest tail

          \`\`\`
          $PYTEST_SUMMARY
          \`\`\`

          **R0-1 status: $R0_1_STATUS**
          EOF

          cat >"$PACKET_DIR/TEST_BASELINE.md" <<EOF
          # Historical Baseline Test Record

          - Commit tested: \`$BASELINE_SHA\`
          - Python: 3.11
          - Environment setup status: \`$ENV_STATUS\`
          - Editable installation status: \`$INSTALL_STATUS\`
          - Compile status: \`$COMPILE_STATUS\`
          - Pytest status: \`$TEST_STATUS\`

          Full command output is retained in \`PYTHON_ENVIRONMENT.log\`, \`COMPILEALL.log\`, and \`PYTEST_BASELINE.log\`.

          ## Summary

          \`\`\`
          $PYTEST_SUMMARY
          \`\`\`
          EOF

          cat >"$PACKET_DIR/EXTERNAL_ARTIFACT_STATUS.md" <<'EOF'
          # External Artifact Status at Repository Freeze

          ## Evaluated

          - The Git repository boundary was inventoried at the exact frozen commit.
          - Repository-tracked files and their exact SHA-256 values are recorded in this packet.
          - No external payload was copied into Git during R0-1.

          ## Not evaluated by this GitHub runner

          - The operator-local `OVC_EXTERNAL_ARTIFACT_ROOT` and Windows filesystem.
          - Exact availability of historical provider payload bytes outside Git.
          - Current R2 object inventory, retention state or remote byte verification.

          These states remain `NOT_EVALUATED` in R0-1. R0-1 freezes repository truth; it does not claim external-byte availability or publish anything to R2.
          EOF

          cat >"$PACKET_DIR/FREEZE_DECISION_RECORD.md" <<EOF
          # R0-1 Freeze Decision Record

          **Decision:** $R0_1_STATUS

          The repository baseline \`$BASELINE_SHA\` is preserved by the remote branch \`$ARCHIVE_BRANCH\` and described by a complete tracked-file inventory and exact SHA-256 ledger. Main was observed at the approved baseline during execution: \`$ORIGIN_MAIN_SHA\`.

          R0-1 grants no new market, model, selector, publication, probability, exposure or execution authority. No legacy file has been moved. R0-2 classification remains the next bounded work packet.
          EOF

          git worktree remove /tmp/ovc-baseline --force

          git config user.name "OVC R0 Freeze Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$PACKET_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "R0-1 freeze repository baseline"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

          echo "r0_1_status=$R0_1_STATUS" >> "$GITHUB_OUTPUT"
          if [[ "$R0_1_STATUS" != PASS ]]; then
            exit 1
          fi
