name: R0 Tracked File Classification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  classify:
    if: github.head_ref == 'build/v2-foundation-reset'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reset branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate deterministic R0-2 classification packet
        run: |
          python tools/r0/classify_tracked_files.py \
            --inventory docs/history/repository-freezes/ovc-replay-v1-c0ad7ba/TRACKED_FILE_INVENTORY.json \
            --hashes docs/history/repository-freezes/ovc-replay-v1-c0ad7ba/TRACKED_FILE_HASHES.json \
            --output-dir docs/history/repository-freezes/ovc-replay-v1-c0ad7ba

      - name: Validate packet invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('docs/history/repository-freezes/ovc-replay-v1-c0ad7ba')
          classification = json.loads((root / 'TRACKED_FILE_CLASSIFICATION.json').read_text(encoding='utf-8'))
          validation = json.loads((root / 'R0_2_VALIDATION.json').read_text(encoding='utf-8'))
          assert classification['classified_file_count'] == 339
          assert sum(classification['counts'].values()) == 339
          assert classification['counts']['UNRESOLVED'] == 0
          assert validation['result'] == 'PASS'
          assert validation['move_operations_executed'] == 0
          assert validation['duplicate_source_paths'] == 0
          assert validation['duplicate_quarantine_targets'] == 0
          PY

      - name: Commit generated classification packet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/history/repository-freezes/ovc-replay-v1-c0ad7ba/TRACKED_FILE_CLASSIFICATION.json \
            docs/history/repository-freezes/ovc-replay-v1-c0ad7ba/TRACKED_FILE_CLASSIFICATION.csv \
            docs/history/repository-freezes/ovc-replay-v1-c0ad7ba/QUARANTINE_MOVE_PLAN.json \
            docs/history/repository-freezes/ovc-replay-v1-c0ad7ba/CLASSIFICATION_SUMMARY.md \
            docs/history/repository-freezes/ovc-replay-v1-c0ad7ba/R0_2_VALIDATION.json
          if git diff --cached --quiet; then
            echo "classification packet already current"
          else
            git commit -m "R0-2 classify tracked repository files"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
