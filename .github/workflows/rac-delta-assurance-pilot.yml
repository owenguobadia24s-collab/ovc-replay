name: RAC delta assurance pilot diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-pilot-diagnostic:
    name: RAC bounded pilot diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - name: Exercise bounded pilot contracts without creating a PR admission listener
        env:
          PYTHONPATH: src:.
        run: |
          python -m unittest tests.development.test_dsai3v_rac_bounded_pilot -v
          python -m unittest tests.development.test_dsai3v_rac_pilot_approval -v
