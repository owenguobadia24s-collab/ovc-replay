name: Research Console v0.3 RC-A0 amendment preflight

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amendment-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify RC-A0 amendment packet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          packet = json.loads(Path('docs/releases/research-console-v0-3/rc-a0/RC_A0_AMENDMENT_PREFLIGHT_PACKET.json').read_text())
          workspaces = Path('registries/research_operations/RESEARCH_CONSOLE_WORKSPACE_REGISTRY_v0_3.yaml').read_text()
          migration = Path('registries/research_operations/RESEARCH_CONSOLE_ROUTE_MIGRATION_REGISTRY_v0_3.yaml').read_text()
          context = Path('registries/research_operations/RESEARCH_CONSOLE_CONTEXT_STATE_REGISTRY_v0_3.yaml').read_text()
          surfaces = Path('registries/research_operations/RESEARCH_CONSOLE_GLOBAL_SURFACE_REGISTRY_v0_3.yaml').read_text()
          implementation = Path('registries/research_operations/RESEARCH_OPERATIONS_IMPLEMENTATION_REGISTRY_v0_1.yaml').read_text()

          assert packet['rc_a0_disposition'] == 'COMPLETE_RC_A1_REVIEW_READY'
          assert packet['blocking_issues'] == 0
          assert all(check['status'] == 'PASS' for check in packet['checks'])
          assert workspaces.count('workspace_id:') == 3
          assert migration.count('v0_2_route_id:') == 14
          assert 'post_cutoff_access: DENIED' in context
          assert 'surface_id: COMMAND_PALETTE' in surfaces
          assert 'surface_id: CONTEXTUAL_DETAIL_DRAWER' in surfaces
          assert 'rc_wp1_authority: REVOKED_SUPERSEDED_BEFORE_MERGE' in implementation
          assert 'shell_implementation_authority: DENIED_PENDING_RC_A1' in implementation
          PY
