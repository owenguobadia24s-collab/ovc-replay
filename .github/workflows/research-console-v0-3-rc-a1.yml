name: Research Console v0.3 RC-A1 amendment acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  amendment-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify RC-A1 acceptance packet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          packet = json.loads(Path('docs/releases/research-console-v0-3/rc-a1/RC_A1_GATE_PACKET.json').read_text())
          registry = Path('registries/research_operations/RESEARCH_OPERATIONS_IMPLEMENTATION_REGISTRY_v0_1.yaml').read_text()
          workspace = Path('registries/research_operations/RESEARCH_CONSOLE_WORKSPACE_REGISTRY_v0_3.yaml').read_text()
          migration = Path('registries/research_operations/RESEARCH_CONSOLE_ROUTE_MIGRATION_REGISTRY_v0_3.yaml').read_text()
          context = Path('registries/research_operations/RESEARCH_CONSOLE_CONTEXT_STATE_REGISTRY_v0_3.yaml').read_text()
          surfaces = Path('registries/research_operations/RESEARCH_CONSOLE_GLOBAL_SURFACE_REGISTRY_v0_3.yaml').read_text()
          assert packet['decision'] == 'PASS_V0_3_INFORMATION_ARCHITECTURE_ACCEPTED'
          assert packet['blocking_issues'] == 0
          assert packet['authority_delta']['rc_wp1_v0_3'] == 'AUTHORISED_FIXTURE_ONLY_LOCAL_PRESENTATION'
          assert workspace.count('workspace_id:') == 3
          assert migration.count('v0_2_route_id:') == 14
          assert 'post_cutoff_access: DENIED' in context
          assert 'command_palette_cannot_bypass_action_registry: true' in surfaces
          assert 'stage: RC_A1_PASS_RC_WP1_V0_3_AUTHORISED' in registry
          assert 'research_write_authority: DENIED_PENDING_SEPARATE_GATE' in registry
          PY
