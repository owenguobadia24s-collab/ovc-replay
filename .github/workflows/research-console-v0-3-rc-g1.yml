name: Research Console v0.3 RC-G1 shell acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Verify exact RC-G1 v0.3 packet
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          packet = json.loads(Path('docs/releases/research-console-v0-3/rc-g1/RC_G1_GATE_PACKET.json').read_text())
          registry = Path('registries/research_operations/RESEARCH_OPERATIONS_IMPLEMENTATION_REGISTRY_v0_1.yaml').read_text()
          design = Path('registries/research_operations/RESEARCH_CONSOLE_DESIGN_TOKEN_REGISTRY_v0_3.yaml').read_text()
          components = Path('registries/research_operations/RESEARCH_CONSOLE_COMPONENT_REGISTRY_v0_3.yaml').read_text()
          css = Path('apps/research_console/assets/console.css').read_text()
          shell = Path('apps/research_console/shell.py').read_text()

          assert packet['decision'] == 'PASS_SHELL_CONTEXT_AND_RESPONSIVE_CONTRACT_ACCEPTED'
          assert packet['review']['implementation_merge_commit'] == 'fa210386378db684419fe6a38b89870dbf72de2d'
          assert packet['blocking_issues'] == 0
          assert packet['disposition'] == 'RC_G1_PASS_RC_WP2_V0_3_AUTHORISED'
          assert all(check['status'] == 'PASS' for check in packet['checks'])
          assert 'stage: RC_G1_PASS_RC_WP2_V0_3_AUTHORISED' in registry
          assert 'active_live_projection_authority: DENIED_PENDING_RC_G2' in registry
          assert 'live_research_surface_authority: DENIED_PENDING_RC_G3' in registry
          assert 'research_write_authority: DENIED_PENDING_SEPARATE_GATE' in registry
          assert 'status: ACCEPTED_BY_RC_G1_V0_3' in design
          assert 'target_widths: [1280, 1440, 1920]' in design
          assert 'narrow_screen_fallback: 1100' in design
          assert 'status: ACCEPTED_BY_RC_G1_V0_3' in components
          assert '@media (max-width: 1100px)' in css
          assert 'st.columns([0.32, 4.7, 1.55]' in shell
          assert 'st.sidebar' not in shell
          PY
