name: Research Console v0.3 RC-G3 adapter consumption acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/research_console/**'
      - 'tests/research_operations/test_rc_g3_v0_3_ro2_adapter_acceptance.py'
      - 'docs/releases/research-console-v0-3/rc-g3/**'
      - 'registries/research_operations/**'
      - '.github/workflows/research-console-v0-3-rc-g3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc-g3-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run RC-G3 focused acceptance tests
        run: PYTHONPATH=src:. python -m unittest tests.research_operations.test_rc_g3_v0_3_ro2_adapter_acceptance -v
      - name: Run RO2 adapter tests
        run: PYTHONPATH=src:. python -m unittest discover -s tests/research_operations/v0_2 -p 'test_*.py' -v
      - name: Run full repository suite
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v
