name: RC-G4 C1 consumption operator gate

on:
  pull_request:
    paths:
      - "docs/releases/research-console-v0-3/rc-g4/**"
      - "docs/releases/research-operations-foundation-v0-3/ro3-g4/RO3_G4_MERGE_RECEIPT.json"
      - "registries/research_operations/v0_3/RO3_PROGRAMME_STATE_v0_1.json"
      - "registries/research_operations/v0_3/RO3_IMPLEMENTATION_REGISTRY_v0_1.yaml"
      - "tests/research_operations/v0_3/test_rc_g4_operator_gate.py"
      - ".github/workflows/research-console-v0-3-rc-g4-operator-gate.yml"
  push:
    branches:
      - "gate/rc-g4-c1-live-consumption"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate RC-G4 operator PASS record
        env:
          PYTHONPATH: src
        run: python -m unittest tests.research_operations.v0_3.test_rc_g4_operator_gate -v
      - name: Run complete repository suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Enforce operator decision and lawful bounded activation continuity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          packet = json.loads(Path('docs/releases/research-console-v0-3/rc-g4/RC_G4_C1_CONSUMPTION_OPERATOR_GATE_PACKET.json').read_text())
          state = json.loads(Path('registries/research_operations/v0_3/RO3_PROGRAMME_STATE_v0_1.json').read_text())
          decision = Path('docs/releases/research-console-v0-3/rc-g4/RC_G4_OPERATOR_DECISION.md').read_text()
          rcg4 = next(item for item in state['packets'] if item['packet_id'] == 'RC-G4')
          activation = next(item for item in state['packets'] if item['packet_id'] == 'RC-G4-ACTIVATION')

          # The signed gate packet remains the historical pre-activation court record.
          assert packet['status'] == 'APPROVED_PENDING_ACTIVATION'
          assert packet['operator_approval_required'] is False
          assert packet['operator_decision']['decision'] == 'PASS'
          assert packet['operator_decision']['authority'] == 'OPERATOR'
          assert packet['classification'] == 'OPERATOR_REQUIRED_NOT_AUTO_RATIFIABLE'
          assert packet['route_and_capability_delta']['current']['route_enabled'] is False
          assert packet['route_and_capability_delta']['current']['route_state'] == 'DISABLED_PENDING_RC_G4_ACTIVATION'

          # Programme state may lawfully advance after the immutable operator decision.
          assert rcg4['status'] in {'APPROVED', 'COMPLETED'}
          assert rcg4['decision'] == 'PASS'
          assert rcg4['decision_authority'] == 'OPERATOR'
          assert activation['status'] in {'READY', 'RUNNING', 'APPROVED', 'COMPLETED'}
          assert activation['authority_delta'] == 'LOCAL_READ_ONLY_C1_PRESENTATION'
          assert activation['authority_required'] == 'AUTO_EXECUTABLE_WITHIN_OPERATOR_APPROVED_DELTA'
          assert packet['current_authority']['validation_consumption'] == 'LOCKED_UNCONSUMED'
          assert packet['current_authority']['c2_pattern_discovery_authority'] == 'UNCHANGED'
          assert 'Decision:** `PASS`' in decision
          PY
