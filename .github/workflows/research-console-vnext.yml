name: Research Console vNext
on:
  pull_request:
    paths:
      - 'apps/research_api/**'
      - 'src/ovc/console_vnext/**'
      - 'contracts/research_console_vnext/**'
      - 'schemas/research_console_vnext/**'
      - 'registries/research_console_vnext/**'
      - 'fixtures/research_console_vnext/**'
      - 'tests/research_console_vnext/**'
      - 'requirements-console-vnext.txt'
      - '.github/workflows/research-console-vnext.yml'
  push:
    branches: [main]
    paths:
      - 'apps/research_api/**'
      - 'src/ovc/console_vnext/**'
      - 'contracts/research_console_vnext/**'
      - 'schemas/research_console_vnext/**'
      - 'registries/research_console_vnext/**'
      - 'fixtures/research_console_vnext/**'
      - 'tests/research_console_vnext/**'
      - 'requirements-console-vnext.txt'
      - '.github/workflows/research-console-vnext.yml'
jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check -r requirements-console-vnext.txt
      - run: PYTHONPATH=src:. python -m unittest tests.research_console_vnext.test_wp2_fastapi_contract -v
