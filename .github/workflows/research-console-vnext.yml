name: Research Console vNext
on:
  push:
    branches:
      - main
      - 'build/rc-vnext-*'
    paths:
      - 'apps/research_api/**'
      - 'apps/research_console_vnext/**'
      - 'src/ovc/console_vnext/**'
      - 'contracts/research_console_vnext/**'
      - 'schemas/research_console_vnext/**'
      - 'registries/research_console_vnext/**'
      - 'fixtures/research_console_vnext/**'
      - 'artifacts/research_console_vnext/**'
      - 'tests/research_console_vnext/**'
      - 'requirements-console-vnext.txt'
      - '.github/workflows/research-console-vnext.yml'
  workflow_dispatch:
concurrency:
  group: research-console-vnext-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check -r requirements-console-vnext.txt
      - run: PYTHONPATH=src:. python -m unittest discover -s tests/research_console_vnext -v
  frontend-foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/research_console_vnext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.17.0'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check -r ../../requirements-console-vnext.txt
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run types:generate
      - run: grep -q '"/api/v1/identity"' src/api/generated/schema.d.ts && grep -q 'CapabilityDependencyStatus' src/api/generated/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload G3V candidate fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcn-g3v-candidate-screenshots-${{ github.sha }}
          path: artifacts/research_console_vnext/g3v_candidate_screenshots
          if-no-files-found: error
          retention-days: 30
