name: RO3-G0 C1 fact-assurance design freeze

on:
  pull_request:
    paths:
      - "contracts/research_operations/v0_3/**"
      - "schemas/research_operations/v0_3/**"
      - "registries/research_operations/v0_3/**"
      - "fixtures/research_operations/v0_3/**"
      - "docs/research-console/v0_3/RO3_C1_CONSOLE_PROJECTION_MAP_v0_1.md"
      - "docs/releases/research-operations-foundation-v0-3/**"
      - "scripts/research_operations/validate_ro3_g0_design.py"
      - "tests/research_operations/v0_3/test_ro3_g0_design.py"
      - ".github/workflows/research-operations-v0-3-ro3-g0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ro3-g0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Runtime identity
        run: python --version
      - name: Capture RO3-G0 validator result
        shell: bash
        run: |
          set +e
          python -u scripts/research_operations/validate_ro3_g0_design.py > ro3-g0-validator.log 2>&1
          status=$?
          printf '%s\n' "$status" > ro3-g0-validator.status
          cat ro3-g0-validator.log
          exit 0
      - name: Upload validator diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ro3-g0-validator-diagnostics
          path: |
            ro3-g0-validator.log
            ro3-g0-validator.status
          if-no-files-found: error
      - name: Require validator PASS
        shell: bash
        run: test "$(cat ro3-g0-validator.status)" = "0"
      - name: Focused RO3-G0 tests
        run: PYTHONPATH=src python -m unittest discover -s tests/research_operations/v0_3 -p 'test_ro3_g0_design.py' -v
      - name: Canonical repository tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Assert design boundary remains unactivated
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'runtime_implementation_started.*NO' docs/releases/research-operations-foundation-v0-3/ro3-g0/RO3_G0_GATE_PACKET.json
          grep -q 'live_console_c1_route: DISABLED_PENDING_RC_G4' registries/research_operations/v0_3/RO3_IMPLEMENTATION_REGISTRY_v0_1.yaml
          grep -q 'OPERATOR_REQUIRED_NOT_AUTO_RATIFIABLE' registries/research_operations/v0_3/RO3_PROGRAMME_STATE_v0_1.json
          grep -q 'c1_formulas_releases_selectors: IMMUTABLE' registries/research_operations/v0_3/RO3_IMPLEMENTATION_REGISTRY_v0_1.yaml
