name: RO4-G0 design and evidence-boundary freeze

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/research_operations/v0_4/**"
      - "schemas/research_operations/v0_4/**"
      - "registries/research_operations/v0_4/**"
      - "fixtures/research_operations/v0_4/**"
      - "docs/research-console/v0_4/**"
      - "docs/releases/research-operations-foundation-v0-4/**"
      - "scripts/research_operations/validate_ro4_g0_design.py"
      - "tests/research_operations/v0_4/**"
      - ".github/workflows/research-operations-v0-4-ro4-g0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ro4-g0:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.pull_request.title, 'RO4-G0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Runtime identity
        run: python --version
      - name: Capture RO4-G0 validator result
        shell: bash
        run: |
          set +e
          python -u scripts/research_operations/validate_ro4_g0_design.py > ro4-g0-validator.log 2>&1
          status=$?
          printf '%s\n' "$status" > ro4-g0-validator.status
          cat ro4-g0-validator.log
          exit 0
      - name: Upload validator diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ro4-g0-validator-diagnostics
          path: |
            ro4-g0-validator.log
            ro4-g0-validator.status
          if-no-files-found: error
      - name: Require validator PASS
        shell: bash
        run: test "$(cat ro4-g0-validator.status)" = "0"
      - name: Focused RO4-G0 tests
        run: PYTHONPATH=src python -m unittest discover -s tests/research_operations/v0_4 -p 'test_ro4_g0_design.py' -v
      - name: Complete repository suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Assert frozen G0 packet remains non-activating
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'route_state: DISABLED_PENDING_RC_G5' registries/research_operations/v0_4/RO4_IMPLEMENTATION_REGISTRY_v0_1.yaml
          grep -q 'state: DISABLED_PENDING_RC_G5' registries/research_operations/v0_4/RO4_ROUTE_REGISTRY_v0_1.yaml
          grep -q 'writes: NONE' registries/research_operations/v0_4/RO4_ROUTE_REGISTRY_v0_1.yaml
          test -e docs/releases/research-operations-foundation-v0-4/ro4-g0/RO4_G0_OPERATOR_DECISION.json
          grep -q '"decision": "PASS"' docs/releases/research-operations-foundation-v0-4/ro4-g0/RO4_G0_OPERATOR_DECISION.json
          grep -q 'canonical_annotation_or_friction_record_active.*NO' docs/releases/research-operations-foundation-v0-4/ro4-g0/RO4_G0_QA_PACKET.json
          grep -q 'operator_facing_schemas: DENY' registries/research_operations/v0_4/RO4_AXIS_ABLATION_ASSURANCE_POLICY_v0_1.yaml
          grep -q 'joint_review_batch: DENIED' registries/research_operations/v0_4/RO4_PD_TRACE_ALLOWLIST_v0_1.yaml
          grep -q 'derived_share_values: DENIED' registries/research_operations/v0_4/RO4_SIGNATURE_DIVERSITY_POLICY_v0_1.yaml
          grep -q 'silent_substitution: PROHIBITED' registries/research_operations/v0_4/RO4_PERFORMANCE_AND_SAMPLE_POLICY_v0_1.yaml
          grep -q 'DRAFT_SEPARATE_C2E_IMPLEMENTATION_PLAN_ONLY' registries/research_operations/v0_4/RO4_C2E_DESIGN_OPENING_THRESHOLD_v0_1.yaml
