name: RO4-G1 exact state and transition index acceptance

on:
  pull_request:
    paths:
      - 'src/ovc/research_operations/v0_4/**'
      - 'scripts/research_operations/build_ro4_state_transition_index.py'
      - 'scripts/research_operations/validate_ro4_g1.py'
      - 'tests/research_operations/v0_4/test_ro4_g1_state_transition_index.py'
      - 'fixtures/research_operations/v0_4/RO4_G1_SYNTHETIC_SOURCE_FIXTURE_v0_1.json'
      - 'registries/research_operations/v0_4/**'
      - 'schemas/research_operations/v0_4/**'
      - 'docs/releases/research-operations-foundation-v0-4/ro4-wp1/**'
      - 'docs/releases/research-operations-foundation-v0-4/ro4-g1/**'
      - '.github/workflows/research-operations-v0-4-ro4-g1.yml'

jobs:
  ro4-g1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate RO4-G1 packet
        run: python -u scripts/research_operations/validate_ro4_g1.py
      - name: Focused RO4-G1 tests
        run: PYTHONPATH=src python -m unittest discover -s tests/research_operations/v0_4 -p 'test_ro4_g1_state_transition_index.py' -v
      - name: Complete repository suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Authority and repository-boundary assertions
        shell: bash
        run: |
          set -euo pipefail
          test -e src/ovc/research_operations/v0_4/state_transition_index.py
          test ! -e apps/research_console/pages/C2_Sequence_Evidence.py
          ! find . -type f \( -name '*.sqlite' -o -name '*.db' -o -name '*.parquet' \) -not -path './.git/*' | grep -q .
          grep -q 'route_state: DISABLED_PENDING_RC_G5' registries/research_operations/v0_4/RO4_IMPLEMENTATION_REGISTRY_v0_1.yaml
          grep -q '"validation_consumption": "LOCKED_UNCONSUMED"' registries/research_operations/v0_4/RO4_G1_SOURCE_INVENTORY_v0_1.json
          grep -q '"sampling_mode":"FULL_CORPUS_NO_SAMPLING"' docs/releases/research-operations-foundation-v0-4/ro4-wp1/RO4_G1_INDEX_MANIFEST.json
          grep -q '"operator_decision_required": false' docs/releases/research-operations-foundation-v0-4/ro4-g1/RO4_G1_GATE_PACKET.json
