name: RO4-G5 disabled console projection acceptance

on:
  pull_request:
    paths:
      - 'src/ovc/research_operations/v0_4/**'
      - 'apps/research_console/ro4_projection_source.py'
      - 'scripts/research_operations/validate_ro4_g5.py'
      - 'tests/research_operations/v0_4/test_ro4_g5_console_projection.py'
      - 'fixtures/research_operations/v0_4/RO4_WP5_CONSOLE_PROJECTION_FIXTURE_v0_1.json'
      - 'contracts/research_operations/v0_4/**'
      - 'schemas/research_operations/v0_4/**'
      - 'registries/research_operations/v0_4/**'
      - 'docs/releases/research-operations-foundation-v0-4/ro4-wp5/**'
      - 'docs/releases/research-operations-foundation-v0-4/ro4-g5/**'
      - '.github/workflows/research-operations-v0-4-ro4-g5.yml'

permissions:
  contents: read

jobs:
  ro4-g5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate RO4-G5 packet
        run: PYTHONPATH=src:. python -u scripts/research_operations/validate_ro4_g5.py
      - name: Focused RO4-G5 tests
        run: PYTHONPATH=src:. python -m unittest discover -s tests/research_operations/v0_4 -p 'test_ro4_g5_console_projection.py' -v
      - name: Complete repository suite
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v
      - name: Authority and repository-boundary assertions
        shell: bash
        run: |
          set -euo pipefail
          test -e src/ovc/research_operations/v0_4/console_projection.py
          test -e apps/research_console/ro4_projection_source.py
          test ! -e apps/research_console/pages/C2_Sequence_Evidence.py
          test ! -e apps/research_console/pages/RO4_Sequence_Evidence.py
          python - <<'PY'
          import json
          from pathlib import Path
          gate=json.loads(Path('docs/releases/research-operations-foundation-v0-4/ro4-g5/RO4_G5_GATE_PACKET.json').read_text())
          schema=json.loads(Path('schemas/research_operations/v0_4/ro4_console_projection_v0_1.schema.json').read_text())
          assert gate['operator_decision_required'] is False
          assert gate['auto_ratifiable'] is True
          assert gate['proposed_authority_delta']=='DISABLED_LOCAL_READ_ONLY_PRESENTATION_ADAPTERS'
          assert schema['properties']['route_state']['const']=='DISABLED_PENDING_RC_G5'
          assert schema['properties']['writes']['const']=='NONE'
          assert schema['properties']['remote_deployment']['const']=='DENIED'
          PY
