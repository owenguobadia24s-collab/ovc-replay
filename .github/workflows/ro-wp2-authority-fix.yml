name: RO-WP2 authority correction

on:
  push:
    branches:
      - build/research-operations-cli-catalogue-v2
    paths:
      - tools/ro_wp2_authority_fix.ready

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/research-operations-cli-catalogue-v2
          fetch-depth: 0
      - name: Correct and validate authority structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('registries/authority/ACTIVE_AUTHORITY.yaml')
          text = path.read_text(encoding='utf-8')
          start = text.index('  research_operations:\n')
          end = text.index('  opt_b_c2_v2:\n')
          lines = text[start:end].splitlines()
          corrected = [lines[0]] + [('  ' + line) if line.startswith('  ') and not line.startswith('    ') else line for line in lines[1:]]
          text = text[:start] + '\n'.join(corrected) + '\n' + text[end:]
          path.write_text(text, encoding='utf-8')
          check = path.read_text(encoding='utf-8')
          block = check[check.index('  research_operations:\n'):check.index('  opt_b_c2_v2:\n')]
          for line in block.splitlines()[1:]:
              if line.strip() and not line.startswith('    '):
                  raise SystemExit(f'invalid Research Operations indentation: {line!r}')
          PY
          rm -f .github/workflows/ro-wp2-authority-fix.yml tools/ro_wp2_authority_fix.ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
      - name: Run canonical validation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          python3 - <<'PY'
          from pathlib import Path
          text = Path('registries/authority/ACTIVE_AUTHORITY.yaml').read_text(encoding='utf-8')
          block = text[text.index('  research_operations:\n'):text.index('  opt_b_c2_v2:\n')]
          assert all(not line.strip() or line.startswith('    ') for line in block.splitlines()[1:])
          assert '    state: RO_WP2_IMPLEMENTED_AWAITING_RO_G2_REVIEW' in block
          assert '    active_research: NONE' in block
          PY
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "fix(ro-wp2): preserve authority registry structure"
          git push origin HEAD:build/research-operations-cli-catalogue-v2
