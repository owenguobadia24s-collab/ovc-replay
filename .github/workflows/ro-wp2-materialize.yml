name: RO-WP2 materialize

on:
  push:
    branches:
      - build/research-operations-cli-catalogue
    paths:
      - tools/ro_wp2_payload.ready

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/research-operations-cli-catalogue
          fetch-depth: 0
      - name: Decode bounded RO-WP2 payload
        shell: bash
        run: |
          set -euo pipefail
          cat tools/ro_wp2_payload.part-* > "$RUNNER_TEMP/ro_wp2_payload.b64"
          base64 --decode "$RUNNER_TEMP/ro_wp2_payload.b64" > "$RUNNER_TEMP/ro_wp2_payload.tar.gz"
          echo "5a054a21ba8887d7b99578e39642f7fdcafad3935be9208928838edea25b6064  $RUNNER_TEMP/ro_wp2_payload.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/ro_wp2_payload.tar.gz" -C .
          rm -f .github/workflows/ro-wp2-materialize.yml tools/ro_wp2_payload.part-* tools/ro_wp2_payload.ready
      - name: Validate staged package
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 -m unittest \
            tests.research_operations.test_ro_wp2_service \
            tests.research_operations.test_ro_wp2_catalogue \
            tests.research_operations.test_ro_wp2_cli \
            tests.research_operations.test_ro_wp2_contracts -v
          python3 -m json.tool registries/research_operations/RESEARCH_OPERATIONS_PATH_REGISTRY_v0_1.json >/dev/null
          python3 -m json.tool registries/research_operations/RESEARCH_OPERATIONS_COMMAND_REGISTRY_v0_1.json >/dev/null
          python3 -m json.tool schemas/research_operations/artifact_catalogue_v0_1.schema.json >/dev/null
          python3 -m json.tool docs/releases/research-operations-foundation/ro-wp2/RO_WP2_GATE_PACKET.json >/dev/null
          python3 -m json.tool docs/releases/research-operations-foundation/ro-wp2/RO_G2_CANDIDATE_GATE_PACKET.json >/dev/null
      - name: Commit final RO-WP2 packet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RO-WP2: add governed research CLI and artifact catalogue"
          git push origin HEAD:build/research-operations-cli-catalogue
