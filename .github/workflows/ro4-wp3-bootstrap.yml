name: RO4-WP3 bounded packet materialization

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ro4-wp3-bootstrap.yml'
      - 'tmp/ro4-wp3-packet.part*.b64'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/ro4-wp3-sequence-windows-neutral-candidates
          fetch-depth: 0
      - name: Synchronize latest lawful main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Decode and verify bounded packet
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/ro4-wp3-packet.part1.b64 \
              tmp/ro4-wp3-packet.part2.b64 \
              tmp/ro4-wp3-packet.part3.b64 \
              tmp/ro4-wp3-packet.part4.b64 > /tmp/ro4-wp3-packet.tar.xz.b64
          echo 'e9f3984b8847b626f1d0df5df8dc30808d63a3b6f3720fd647a5f8c5584ca2b0  /tmp/ro4-wp3-packet.tar.xz.b64' | sha256sum --check
          base64 --decode /tmp/ro4-wp3-packet.tar.xz.b64 > /tmp/ro4-wp3-packet.tar.xz
          echo '10db31db253fd7c628f7260868ef34f2085e841695157cc15c1aa16cdb3bcbef  /tmp/ro4-wp3-packet.tar.xz' | sha256sum --check
          if tar -tJf /tmp/ro4-wp3-packet.tar.xz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe archive path detected' >&2
            exit 1
          fi
          tar -xJf /tmp/ro4-wp3-packet.tar.xz -C .
          test -f scripts/research_operations/validate_ro4_g3.py
          test -f tests/research_operations/v0_4/test_ro4_g3_sequence_recurrence.py
          ! find . -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) -not -path './.git/*' | grep -q .
      - name: Remove bootstrap transport
        shell: bash
        run: |
          set -euo pipefail
          rm -f tmp/ro4-wp3-packet.part1.b64 \
                tmp/ro4-wp3-packet.part2.b64 \
                tmp/ro4-wp3-packet.part3.b64 \
                tmp/ro4-wp3-packet.part4.b64
          rmdir tmp 2>/dev/null || true
          rm -f .github/workflows/ro4-wp3-bootstrap.yml
      - name: Commit exact packet
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'RO4-WP3 — materialize sequence-window and neutral recurrence packet'
          git push origin HEAD:build/ro4-wp3-sequence-windows-neutral-candidates
