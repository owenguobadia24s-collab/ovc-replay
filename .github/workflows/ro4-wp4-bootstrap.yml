name: RO4-WP4 bounded packet materialization

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/ro4-wp4-bootstrap.yml'
      - 'tmp/ro4-wp4-packet.part*.b64'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/ro4-wp4-annotations-c2e-friction
          fetch-depth: 0
      - name: Synchronize latest lawful main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Decode and verify bounded packet
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/ro4-wp4-packet.part0.b64 \
              tmp/ro4-wp4-packet.part1.b64 \
              tmp/ro4-wp4-packet.part2.b64 > /tmp/ro4-wp4-packet.tar.xz.b64
          echo '5c2bc744d7314548c4de2ccf275cd83869b38adacd9666c234b822ee259ee30e  /tmp/ro4-wp4-packet.tar.xz.b64' | sha256sum --check
          base64 --decode /tmp/ro4-wp4-packet.tar.xz.b64 > /tmp/ro4-wp4-packet.tar.xz
          echo 'e7d264e7e20b27b2ec4895ab0c83355e28cfb6fb7ceaaad35367384a283a16b6  /tmp/ro4-wp4-packet.tar.xz' | sha256sum --check
          if tar -tJf /tmp/ro4-wp4-packet.tar.xz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe archive path detected' >&2
            exit 1
          fi
          tar -xJf /tmp/ro4-wp4-packet.tar.xz -C .
          test -f scripts/research_operations/validate_ro4_g4.py
          test -f tests/research_operations/v0_4/test_ro4_g4_annotation_friction.py
          test -f src/ovc/research_operations/v0_4/annotation_friction_service.py
          ! find . -type f \( -name '*.pyc' -o -path '*/__pycache__/*' \) -not -path './.git/*' | grep -q .
      - name: Remove transport and defer permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f tmp/ro4-wp4-packet.part0.b64 \
                tmp/ro4-wp4-packet.part1.b64 \
                tmp/ro4-wp4-packet.part2.b64
          rmdir tmp 2>/dev/null || true
          rm -f .github/workflows/research-operations-v0-4-ro4-g4.yml
      - name: Commit bounded gate-disabled packet
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m 'RO4-WP4 — materialize gate-disabled annotation and friction service'
          git push origin HEAD:build/ro4-wp4-annotations-c2e-friction
