name: RPS-G1A June source amendment

on:
  pull_request:
    paths:
      - "src/ovc/research_operations/prospective_source/dukascopy_intake_rps_g1a.py"
      - "tests/research_operations/prospective_source/test_dukascopy_intake_rps_g1a.py"
      - "scripts/run_rps_wp2_intake.ps1"
      - "docs/releases/prospective-source-v0-1/rps-g1a/**"
      - "docs/releases/prospective-source-v0-1/rps-wp2/RPS_WP2_WINDOWS_OPERATOR_GUIDE.md"
      - "registries/research_operations/prospective_source/REAL_PROSPECTIVE_SOURCE_IMPLEMENTATION_REGISTRY_v0_1.yaml"
      - ".github/workflows/rps-g1a-june-source-amendment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-amendment-without-provider-access:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      OVC_EXTERNAL_ARTIFACT_ROOT: ${{ runner.temp }}/ovc-rps-g1a-external

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository package
        run: python -m pip install -e .

      - name: Run exact amendment profile tests
        run: >-
          python -m unittest discover
          -s tests/research_operations/prospective_source
          -p "test_dukascopy_intake_rps_g1a.py"
          -v

      - name: Run original bounded-intake regression tests
        run: >-
          python -m unittest discover
          -s tests/research_operations/prospective_source
          -p "test_dukascopy_intake.py"
          -v

      - name: Run canonical repository suite
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Verify no-network amendment preflight
        run: |
          mkdir -p "$OVC_EXTERNAL_ARTIFACT_ROOT"
          python -m ovc.research_operations.prospective_source.dukascopy_intake_rps_g1a \
            preflight \
            --repository-root .

      - name: Prove provider execution remains denied in CI
        run: |
          set +e
          python -m ovc.research_operations.prospective_source.dukascopy_intake_rps_g1a \
            execute \
            --repository-root . \
            --gate RPS-G1A
          status=$?
          set -e
          test "$status" -eq 2
