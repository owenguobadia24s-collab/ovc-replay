name: RPS-G1B gapped-source amendment

on:
  pull_request:
    paths:
      - "contracts/research_operations/prospective_source/RPS_GAPPED_SOURCE_ACCEPTANCE_CONTRACT_v0_1.md"
      - "schemas/research_operations/prospective_source/quarantine_checksum_inventory_v0_1.schema.json"
      - "schemas/research_operations/prospective_source/gapped_source_qa_v0_1.schema.json"
      - "src/ovc/research_operations/prospective_source/gapped_source_contract.py"
      - "src/ovc/research_operations/prospective_source/gapped_source_qa.py"
      - "src/ovc/research_operations/prospective_source/dukascopy_gapped_recovery.py"
      - "tests/research_operations/prospective_source/test_dukascopy_gapped_recovery.py"
      - "scripts/run_rps_wp2_intake.ps1"
      - "docs/releases/prospective-source-v0-1/rps-g1b/**"
      - "registries/research_operations/prospective_source/REAL_PROSPECTIVE_SOURCE_IMPLEMENTATION_REGISTRY_v0_1.yaml"
      - ".github/workflows/rps-g1b-gapped-source-amendment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-gapped-source-amendment:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      OVC_EXTERNAL_ARTIFACT_ROOT: ${{ runner.temp }}/ovc-rps-g1b-external

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository package
        run: python -m pip install -e .

      - name: Parse added JSON schemas
        run: |
          python -m json.tool schemas/research_operations/prospective_source/quarantine_checksum_inventory_v0_1.schema.json >/dev/null
          python -m json.tool schemas/research_operations/prospective_source/gapped_source_qa_v0_1.schema.json >/dev/null

      - name: Run focused RPS-G1B tests
        run: >-
          python -m unittest discover
          -s tests/research_operations/prospective_source
          -p "test_dukascopy_gapped_recovery.py"
          -v

      - name: Run RPS-G1A regression tests
        run: >-
          python -m unittest discover
          -s tests/research_operations/prospective_source
          -p "test_dukascopy_intake_rps_g1a.py"
          -v

      - name: Run base bounded-intake regression tests
        run: >-
          python -m unittest discover
          -s tests/research_operations/prospective_source
          -p "test_dukascopy_intake.py"
          -v

      - name: Run canonical repository suite
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Prove provider-free recovery execution is denied in CI
        run: |
          mkdir -p "$OVC_EXTERNAL_ARTIFACT_ROOT"
          set +e
          python -m ovc.research_operations.prospective_source.dukascopy_gapped_recovery \
            freeze \
            --repository-root . \
            --gate RPS-G1B
          status=$?
          set -e
          test "$status" -eq 2
