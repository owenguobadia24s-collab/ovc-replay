name: RPS-G4 operator gate evidence

on:
  pull_request:
    paths:
      - "docs/releases/prospective-source-v0-1/rps-wp4/evidence/**"
      - "docs/releases/prospective-source-v0-1/rps-wp4/RPS_WP4_COMPACT_SIGNING_EVIDENCE_INDEX.json"
      - "docs/releases/prospective-source-v0-1/rps-wp4/RPS_WP4_SIGNED_ACCEPTANCE_QA_PACKET.md"
      - "docs/releases/prospective-source-v0-1/rps-wp4/RPS_G4_OPERATOR_GATE_PACKET.md"
      - "docs/releases/prospective-source-v0-1/rps-wp4/RPS_G4_OPERATOR_DECISION.md"
      - "registries/research_operations/prospective_source/RPS_G4_GATE_STATE_v0_1.json"
      - "registries/research_operations/prospective_source/RPS_WP4_COMMAND_STATE_v0_1.json"
      - "tests/research_operations/prospective_source/test_rps_g4_signed_replay_evidence.py"
      - ".github/workflows/rps-g4-operator-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify compact byte inventory
        run: >-
          PYTHONPATH=src python -m unittest discover
          -s tests/research_operations/prospective_source
          -p 'test_rps_g4_signed_replay_evidence.py'
          -k compact_file_byte_inventory
          -v
      - name: Verify signing binding and public key
        run: >-
          PYTHONPATH=src python -m unittest discover
          -s tests/research_operations/prospective_source
          -p 'test_rps_g4_signed_replay_evidence.py'
          -k signing_binding_identity
          -v
      - name: Verify acceptance identities
        run: >-
          PYTHONPATH=src python -m unittest discover
          -s tests/research_operations/prospective_source
          -p 'test_rps_g4_signed_replay_evidence.py'
          -k acceptance_and_signed_payload
          -v
      - name: Verify Ed25519 SSHSIG
        run: >-
          PYTHONPATH=src python -m unittest discover
          -s tests/research_operations/prospective_source
          -p 'test_rps_g4_signed_replay_evidence.py'
          -k ed25519_sshsig
          -v
      - name: Verify exact cross-record bindings
        run: >-
          PYTHONPATH=src python -m unittest discover
          -s tests/research_operations/prospective_source
          -p 'test_rps_g4_signed_replay_evidence.py'
          -k exact_source_compute
          -v
      - name: Verify signed gate input remains non-activating
        run: >-
          PYTHONPATH=src python -m unittest discover
          -s tests/research_operations/prospective_source
          -p 'test_rps_g4_signed_replay_evidence.py'
          -k gate_is_operator_required
          -v
      - name: Verify approved gate state remains non-activating before merge
        run: >-
          PYTHONPATH=src python -m unittest discover
          -s tests/research_operations/prospective_source
          -p 'test_rps_g4_signed_replay_evidence.py'
          -k programme_state_stops
          -v
      - name: Canonical repository tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Assert no private key material is committed
        shell: bash
        run: |
          set -euo pipefail
          if find docs/releases/prospective-source-v0-1/rps-wp4 -type f \
            \( -name 'id_ed25519' -o -name '*.key' -o -name '*.pem' \) | grep -q .; then
            echo "Private-key-shaped file found in RPS-WP4 evidence."
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'BEGIN OPENSSH PRIVATE KEY' \
            docs/releases/prospective-source-v0-1/rps-wp4 \
            registries/research_operations/prospective_source; then
            echo "Private key material found."
            exit 1
          fi
      - name: Assert approved gate remains non-activating pending activation packet
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('registries/research_operations/prospective_source/RPS_G4_GATE_STATE_v0_1.json').read_text())
          assert state['gate_status'] == 'APPROVED_PENDING_MERGE'
          assert state['decision'] == 'PASS'
          assert state['decision_authority'] == 'OPERATOR'
          assert state['operator_approval_required'] is False
          assert state['active_binding_id'] is None
          assert state['active_research_triage'] is False
          assert state['live_prospective_append'] == 'DENIED_PENDING_ACTIVATION_PACKET'
          assert state['write_authority'] is False
          PY
