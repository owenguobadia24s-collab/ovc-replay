name: RPS-WP2 local intake command

on:
  pull_request:
    paths:
      - "src/ovc/research_operations/prospective_source/dukascopy_intake.py"
      - "tests/research_operations/prospective_source/test_dukascopy_intake.py"
      - "scripts/run_rps_wp2_intake.ps1"
      - "docs/releases/prospective-source-v0-1/rps-wp2/**"
      - "registries/research_operations/prospective_source/REAL_PROSPECTIVE_SOURCE_IMPLEMENTATION_REGISTRY_v0_1.yaml"
      - ".github/workflows/rps-wp2-local-intake-command.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-command-without-provider-access:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      OVC_EXTERNAL_ARTIFACT_ROOT: ${{ runner.temp }}/ovc-rps-wp2-external

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository package
        run: python -m pip install -e .

      - name: Run focused fake-provider tests
        run: >-
          python -m unittest discover
          -s tests/research_operations/prospective_source
          -p "test_dukascopy_intake.py"
          -v

      - name: Run canonical repository suite
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Verify no-network preflight
        run: |
          mkdir -p "$OVC_EXTERNAL_ARTIFACT_ROOT"
          python -m ovc.research_operations.prospective_source.dukascopy_intake \
            preflight \
            --repository-root .

      - name: Prove provider execution is denied in CI
        run: |
          set +e
          python -m ovc.research_operations.prospective_source.dukascopy_intake \
            execute \
            --repository-root . \
            --gate RPS-G1
          status=$?
          set -e
          test "$status" -eq 2
