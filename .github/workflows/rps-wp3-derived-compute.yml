name: RPS-WP3 derived prospective compute

on:
  pull_request:
    paths:
      - 'contracts/research_operations/prospective_source/RPS_DERIVED_COMPUTE_AND_BINDING_CONTRACT_v0_1.md'
      - 'schemas/research_operations/prospective_source/prospective_compute_receipt_v0_1.schema.json'
      - 'src/ovc/opt_b/c1/adapter.py'
      - 'src/ovc/opt_b/c2/adapter.py'
      - 'src/ovc/research_operations/prospective_source/prospective_compute.py'
      - 'tests/research_operations/prospective_source/test_rps_wp3_prospective_compute.py'
      - 'scripts/run_rps_wp3_compute.ps1'
      - '.github/workflows/rps-wp3-derived-compute.yml'
  push:
    branches: [main]
    paths:
      - 'src/ovc/research_operations/prospective_source/prospective_compute.py'
      - 'tests/research_operations/prospective_source/test_rps_wp3_prospective_compute.py'

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused prospective compute tests
        run: PYTHONPATH=src python -m unittest tests.research_operations.prospective_source.test_rps_wp3_prospective_compute -v
      - name: Canonical repository tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Assert external execute denied in CI
        env:
          CI: 'true'
          OVC_EXTERNAL_ARTIFACT_ROOT: /tmp/ovc-rps-wp3-external
        run: |
          set +e
          PYTHONPATH=src python -m ovc.research_operations.prospective_source.prospective_compute execute --repository-root "$PWD" --gate RPS-G2
          code=$?
          set -e
          test "$code" -eq 2
