name: SRFDI G8R H0 evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ovc/opt_b/srfd/**'
      - 'tools/srfd/**'
      - 'tests/srfd/g8r/**'
      - 'contracts/research/srfd/**'
      - '.github/workflows/srfdi-g8r-h0.yml'

concurrency:
  group: srfdi-g8r-h0-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  h0-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture exact-head H0 and reference component evidence
        env:
          PYTHONPATH: src
          G8R_H0_OUTPUT: g8r-h0-evidence
        run: python tools/srfd/g8r_capture_h0.py
      - name: Upload H0 evidence
        uses: actions/upload-artifact@v4
        with:
          name: srfdi-g8r-h0-${{ github.sha }}
          path: g8r-h0-evidence
          if-no-files-found: error
          retention-days: 14
