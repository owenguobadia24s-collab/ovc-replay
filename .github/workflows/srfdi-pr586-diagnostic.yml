name: OPS SRFDI PR586 diagnostic

on:
  push:
    branches:
      - remediate/srfdi-wp10-v11-env-profile-supersession-20260811
    paths:
      - '.github/workflows/srfdi-pr586-diagnostic.yml'
      - 'tests/srfd/**'
      - 'src/ovc/opt_b/srfd/**'
      - 'registries/implementation/srfd/**'
      - 'docs/releases/srfd-benchmark-v0-1/**'

jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Repository suite with captured output
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest-pr586.log"
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: SRFDI_PR586_PYTEST_DIAGNOSTIC
          path: ${{ runner.temp }}/pytest-pr586.log
          if-no-files-found: error
