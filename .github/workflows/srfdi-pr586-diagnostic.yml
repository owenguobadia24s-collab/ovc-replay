name: OPS SRFDI PR586 diagnostic

on:
  push:
    branches:
      - remediate/srfdi-wp10-v11-env-profile-supersession-20260811
    paths:
      - '.github/workflows/srfdi-pr586-diagnostic.yml'
      - 'tests/srfd/**'
      - 'src/ovc/opt_b/srfd/**'
      - 'registries/implementation/srfd/**'
      - 'docs/releases/srfd-benchmark-v0-1/**'

jobs:
  unittest-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact repository unittest gate with captured output
        continue-on-error: true
        run: |
          set -o pipefail
          PYTHONPATH=src python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/unittest-pr586-final.log"
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: SRFDI_PR586_UNITTEST_DIAGNOSTIC_FINAL
          path: ${{ runner.temp }}/unittest-pr586-final.log
          if-no-files-found: error
