name: SRFDI v0.9 accepted Drive retrieval probe

on:
  push:
    branches:
      - run/srfdi-v09-drive-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
      - name: Retrieve one accepted source artifact and verify frozen hash
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          target="$RUNNER_TEMP/C2_15M_BID_LOCAL.jsonl"
          gdown 1ZWPZGGXZC_okzkeb5Sr0urgJlZb9Dipk -O "$target"
          sha256sum "$target"
          wc -c "$target"
          echo "63a1d24836d3cd0aaad9e5a11e9b9ec51724bfd335fab47f538ed23f36e8c58b  $target" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'C2_15M_BID_LOCAL.jsonl'
          print({'bytes': p.stat().st_size, 'provider_fetch': 'DENIED', 'retrieval': 'ACCEPTED_GOOGLE_DRIVE_ARTIFACT_ONLY'})
          PY
