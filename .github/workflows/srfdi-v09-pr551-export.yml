name: SRFDI v0.9 PR551 workspace export

on:
  push:
    branches:
      - run/srfdi-v09-pr551-export

permissions:
  contents: read

jobs:
  export-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PR head parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "73e7e27c2d853d6367d9b221bcbe67b8269b59ba"
      - name: Build workspace archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          git archive --format=tar.gz --output="$RUNNER_TEMP/export/ovc-replay-pr551-73e7e27.tar.gz" 73e7e27c2d853d6367d9b221bcbe67b8269b59ba
          sha256sum "$RUNNER_TEMP/export/ovc-replay-pr551-73e7e27.tar.gz" | tee "$RUNNER_TEMP/export/SHA256SUMS"
      - name: Upload exact workspace
        uses: actions/upload-artifact@v4
        with:
          name: srfdi-pr551-workspace-73e7e27
          path: ${{ runner.temp }}/export/
          if-no-files-found: error
          retention-days: 1
