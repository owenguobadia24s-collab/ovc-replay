name: SRFDI v0.9 workspace export

on:
  push:
    branches:
      - run/srfdi-v09-workspace-export

permissions:
  contents: read

jobs:
  export-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify lawful main baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fa7b9e1599f61a2b66c2c36e6d5c7920fdd4bcd4"
          git status --porcelain=v1
      - name: Build workspace archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          git archive --format=tar.gz --output="$RUNNER_TEMP/export/ovc-replay-fa7b9e1599f61a2b66c2c36e6d5c7920fdd4bcd4.tar.gz" fa7b9e1599f61a2b66c2c36e6d5c7920fdd4bcd4
          sha256sum "$RUNNER_TEMP/export/ovc-replay-fa7b9e1599f61a2b66c2c36e6d5c7920fdd4bcd4.tar.gz" | tee "$RUNNER_TEMP/export/SHA256SUMS"
      - name: Upload exact workspace
        uses: actions/upload-artifact@v4
        with:
          name: srfdi-v09-workspace-fa7b9e1
          path: ${{ runner.temp }}/export/
          if-no-files-found: error
          retention-days: 1
