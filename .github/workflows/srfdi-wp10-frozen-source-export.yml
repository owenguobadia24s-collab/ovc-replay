name: SRFDI WP10 frozen source export

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/srfdi-wp10-frozen-source-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout execution-prep head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: current
          show-progress: false

      - name: Checkout frozen scientific implementation
        uses: actions/checkout@v4
        with:
          ref: 0e94bf4d61272b685a8e972e695e88b6ca4cb3c7
          path: frozen
          show-progress: false

      - name: Verify no scientific SRFD drift
        shell: bash
        run: |
          set -euo pipefail
          diff -ru --exclude=june_authority_v04.py frozen/src/ovc/opt_b/srfd current/src/ovc/opt_b/srfd
          test ! -e frozen/src/ovc/opt_b/srfd/june_authority_v04.py
          printf '%s\n' '0e94bf4d61272b685a8e972e695e88b6ca4cb3c7' > frozen/BOUND_IMPLEMENTATION_COMMIT.txt
          sha256sum frozen/src/ovc/opt_b/srfd/*.py | sort > frozen/SRFD_SOURCE_SHA256.txt

      - name: Upload exact execution snapshot
        uses: actions/upload-artifact@v4
        with:
          name: srfdi-wp10-frozen-implementation-0e94bf4d
          if-no-files-found: error
          retention-days: 1
          path: |
            frozen/src
            frozen/registries/research/srfd
            frozen/contracts/opt_b/srfd
            frozen/BOUND_IMPLEMENTATION_COMMIT.txt
            frozen/SRFD_SOURCE_SHA256.txt
            current/src/ovc/opt_b/srfd/june_authority_v04.py
            current/docs/releases/srfd-benchmark-v0-1/srfdi-june-auth-v0-4/SRFD_JUNE_AUTHORIZED_MANIFEST_v0_4.json
            current/docs/releases/srfd-benchmark-v0-1/srfdi-june-auth-v0-4/SRFD_JUNE_AUTHORITY_TOKEN_v0_4.json
            current/docs/releases/srfd-benchmark-v0-1/srfdi-june-auth-v0-4/SRFDI_G_JUNE_AUTH_OPERATOR_DECISION_v0_4.json
