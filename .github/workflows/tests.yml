name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovc-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner and project
        run: python3 -m pip install -e ".[test]"
      - name: Legacy unittest suite — retained parity baseline
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Pytest unified suite — candidate primary runner
        run: PYTHONPATH=src python3 -m pytest tests -ra
      - name: Prove unittest collection parity under pytest
        run: PYTHONPATH=src python3 scripts/qa/check_python_test_runner_parity.py
