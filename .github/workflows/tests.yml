name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: ovc-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy-unittest:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Research Console exact-surface dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-console-vnext.txt
      - name: Complete repository suite as BASE_INDEPENDENT assurance
        run: python3 -m unittest discover -s tests -v
      - name: Research Console vNext exact maintained API surface
        run: PYTHONPATH=src:. python3 -m unittest discover -s tests/research_console_vnext -v

  pytest-unittest-parity:
    name: pytest-unittest-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest and Research Console test dependencies
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt
      - name: Execute exact legacy unittest surface under pytest as BASE_INDEPENDENT assurance
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python3 tools/ci/pytest_unittest_parity.py run > /tmp/pytest-legacy.log 2>&1
          status=$?
          cat /tmp/pytest-legacy.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/pytest-legacy.log').read_text(encoding='utf-8', errors='replace')
          tail = text[-5000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Pytest legacy-surface failure::{tail}')
          PY
          fi
          exit "$status"

  runner-parity:
    name: runner-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest and Research Console test dependencies
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt
      - name: Prove pytest collection parity as BASE_INDEPENDENT assurance
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python3 tools/ci/pytest_unittest_parity.py collect > /tmp/pytest-parity.log 2>&1
          status=$?
          cat /tmp/pytest-parity.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/pytest-parity.log').read_text(encoding='utf-8', errors='replace')
          tail = text[-5000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Pytest collection-parity failure::{tail}')
          PY
          fi
          exit "$status"
