name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      aa0_target_head_sha:
        description: Exact pushed candidate head to run as a PRE_PR_AA0_WARM producer
        required: false
        type: string

permissions:
  contents: read
  checks: read
  pull-requests: read

env:
  OVC_ASSURANCE_TARGET_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.aa0_target_head_sha != '' && inputs.aa0_target_head_sha) || github.sha }}
  OVC_AA0_PREWARM_TARGET_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.aa0_target_head_sha || '' }}

concurrency:
  group: ovc-tests-${{ github.event.pull_request.number || inputs.aa0_target_head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  vit-routing-preflight:
    name: VIT routing preflight
    runs-on: ubuntu-latest
    outputs:
      aa0_identity: ${{ steps.assurance.outputs.aa0_identity }}
      generation_id: ${{ steps.assurance.outputs.generation_id }}
      pip_id: ${{ steps.assurance.outputs.pip_id }}
      lineage_source: ${{ steps.assurance.outputs.lineage_source }}
      lineage_ref: ${{ steps.assurance.outputs.lineage_ref }}
      qualification_id: ${{ steps.assurance.outputs.qualification_id }}
      aa0_producer_mode: ${{ steps.assurance.outputs.aa0_producer_mode }}
      aa0_reuse_authorized: ${{ steps.assurance.outputs.aa0_reuse_authorized }}
      aa0_reuse_reason: ${{ steps.assurance.outputs.aa0_reuse_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OVC_ASSURANCE_TARGET_HEAD_SHA }}
          fetch-depth: 0
          show-progress: false

      - name: Verify VIT-owned physical-main protection
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.base.ref;
            if (branch !== 'main') {
              core.setFailed(`PHYSICAL_MAIN_EXCLUSIVITY_TARGET_INVALID:${branch}`);
              return;
            }
            const effective = await github.request('GET /repos/{owner}/{repo}/rules/branches/{branch}', {
              owner, repo, branch,
              headers: {'X-GitHub-Api-Version':'2022-11-28'}
            });
            const rules = effective.data;
            const byType = type => rules.filter(rule => rule.type === type);
            if (!byType('pull_request').length || !byType('non_fast_forward').length || !byType('deletion').length) {
              core.setFailed('PHYSICAL_MAIN_EXCLUSIVITY_GUARDS_MISSING');
              return;
            }
            const prRule = byType('pull_request')[0];
            const methods = prRule.parameters?.allowed_merge_methods || [];
            if (methods.length !== 1 || methods[0] !== 'squash') {
              core.setFailed(`PHYSICAL_MAIN_EXCLUSIVITY_MERGE_METHOD_INVALID:${methods.join(',')}`);
              return;
            }
            const statusRules = byType('required_status_checks');
            const contexts = statusRules.flatMap(rule => rule.parameters?.required_status_checks || []).map(row => row.context);
            if (!contexts.includes('OVC merge readiness')) {
              core.setFailed(`PHYSICAL_MAIN_EXCLUSIVITY_REQUIRED_CHECK_MISSING:${contexts.join(',')}`);
              return;
            }
            const rulesetIds = [...new Set(rules.map(rule => rule.ruleset_id).filter(Boolean))];
            if (rulesetIds.length !== 1) {
              core.setFailed(`PHYSICAL_MAIN_EXCLUSIVITY_RULESET_AMBIGUOUS:${rulesetIds.join(',')}`);
              return;
            }
            const ruleset = await github.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}', {
              owner, repo, ruleset_id: rulesetIds[0],
              headers: {'X-GitHub-Api-Version':'2022-11-28'}
            });
            if (ruleset.data.enforcement !== 'active') {
              core.setFailed(`PHYSICAL_MAIN_EXCLUSIVITY_RULESET_INACTIVE:${ruleset.data.enforcement}`);
              return;
            }
            const bypass = ruleset.data.bypass_actors || [];
            if (bypass.length !== 0) {
              core.setFailed(`PHYSICAL_MAIN_EXCLUSIVITY_BYPASS_ACTORS_PRESENT:${bypass.length}`);
              return;
            }
            core.info(
              `OVC_PHYSICAL_MAIN_EXCLUSIVITY=PASS ruleset=${rulesetIds[0]} ` +
              `writer=DSAI_VIT_PHYSICAL_CONTROLLER gateway=DSAI_SIQ_EXISTING_SERIALIZED_GATEWAY`
            );

      - name: Resolve PIP-bound assurance identity before placement-sensitive routing
        id: assurance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
        run: python3 tools/ci/vit_assurance_preflight.py

      - name: Require canonical VIT placement before permanent PR admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
        run: python3 tools/ci/vit_routing_preflight.py

  pytest-assurance-plan:
    name: canonical pytest shard assurance plan
    needs: vit-routing-preflight
    runs-on: ubuntu-latest
    outputs:
      disposition: ${{ steps.aa0.outputs.disposition }}
      harness_hash: ${{ steps.aa0-harness.outputs.harness_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OVC_ASSURANCE_TARGET_HEAD_SHA }}
          fetch-depth: 1
          show-progress: false
      - name: Compute AA0 assurance harness identity
        id: aa0-harness
        run: python3 tools/ci/aa0_harness_identity.py
      - name: Restore AA0 PIP-bound repository assurance for planning
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ovc-aa0-tests
          key: ovc-aa0-tests-v2-pip-${{ needs.vit-routing-preflight.outputs.aa0_identity }}-h-${{ steps.aa0-harness.outputs.harness_hash }}-gen-${{ needs.vit-routing-preflight.outputs.generation_id }}
          restore-keys: |
            ovc-aa0-tests-v2-pip-${{ needs.vit-routing-preflight.outputs.aa0_identity }}-h-${{ steps.aa0-harness.outputs.harness_hash }}-gen-
      - name: Decide AA0 PIP-bound repository assurance
        id: aa0
        shell: bash
        env:
          EXACT_HIT: ${{ steps.cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          PRODUCER_MODE: ${{ needs.vit-routing-preflight.outputs.aa0_producer_mode }}
          REUSE_AUTHORIZED: ${{ needs.vit-routing-preflight.outputs.aa0_reuse_authorized }}
        run: |
          set -euo pipefail
          disposition=RUN_AA0
          if [[ "${PRODUCER_MODE}" != "true" && "${EXACT_HIT}" == "true" ]]; then disposition=EXACT_GENERATION_REUSE; elif [[ "${PRODUCER_MODE}" != "true" && -n "${MATCHED_KEY}" && "${REUSE_AUTHORIZED}" == "true" ]]; then disposition=PLACEMENT_ONLY_PIP_REUSE; fi
          if [[ "${disposition}" != "RUN_AA0" ]]; then test -f "${RUNNER_TEMP}/ovc-aa0-tests/PASS"; fi
          echo "disposition=${disposition}" >> "$GITHUB_OUTPUT"
          echo "OVC_CI_METRIC {\"schema\":\"ovc-ci-metric/v1\",\"metric\":\"aa0_pip_assurance_repository\",\"disposition\":\"${disposition}\",\"topology\":\"DETERMINISTIC_FOUR_SHARD_CANONICAL_PYTEST\"}"

  pytest-shard-manifest:
    name: canonical pytest shard manifest
    needs: pytest-assurance-plan
    if: ${{ needs.pytest-assurance-plan.outputs.disposition == 'RUN_AA0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OVC_ASSURANCE_TARGET_HEAD_SHA }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - name: Install pytest and Research Console test dependencies
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt
      - name: Prove exact current canonical pytest shard union
        run: |
          mkdir -p "${RUNNER_TEMP}/ovc-canonical-manifest"
          PYTHONPATH=src:. python3 tools/ci/pytest_shard_canonical.py prove \
            --head-sha "${OVC_ASSURANCE_TARGET_HEAD_SHA}" \
            --output "${RUNNER_TEMP}/ovc-canonical-manifest/manifest.json"
      - name: Upload canonical pytest manifest
        uses: actions/upload-artifact@v4
        with:
          name: canonical-pytest-manifest-${{ env.OVC_ASSURANCE_TARGET_HEAD_SHA }}
          path: ${{ runner.temp }}/ovc-canonical-manifest/manifest.json
          if-no-files-found: error
          retention-days: 7

  pytest-shard:
    name: canonical pytest shard ${{ matrix.shard }}
    needs: pytest-assurance-plan
    if: ${{ needs.pytest-assurance-plan.outputs.disposition == 'RUN_AA0' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OVC_ASSURANCE_TARGET_HEAD_SHA }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
      - name: Install pytest and Research Console test dependencies
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt
      - name: Execute one exact canonical pytest shard session
        run: |
          mkdir -p "${RUNNER_TEMP}/ovc-canonical-shard-${{ matrix.shard }}"
          PYTHONPATH=src:. python3 tools/ci/pytest_shard_canonical.py run \
            --head-sha "${OVC_ASSURANCE_TARGET_HEAD_SHA}" \
            --shard-index "${{ matrix.shard }}" \
            --manifest-output "${RUNNER_TEMP}/ovc-canonical-shard-${{ matrix.shard }}/manifest.json" \
            --result-output "${RUNNER_TEMP}/ovc-canonical-shard-${{ matrix.shard }}/result.json"
      - name: Upload canonical pytest shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-pytest-shard-${{ matrix.shard }}-${{ env.OVC_ASSURANCE_TARGET_HEAD_SHA }}
          path: ${{ runner.temp }}/ovc-canonical-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 7

  pytest-unified:
    name: tests
    needs: [vit-routing-preflight, pytest-assurance-plan, pytest-shard-manifest, pytest-shard]
    if: ${{ always() && needs.vit-routing-preflight.result == 'success' && needs.pytest-assurance-plan.result == 'success' && (needs.pytest-assurance-plan.outputs.disposition != 'RUN_AA0' || (needs.pytest-shard-manifest.result == 'success' && needs.pytest-shard.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OVC_ASSURANCE_TARGET_HEAD_SHA }}
          fetch-depth: 1
          show-progress: false
      - name: Compute AA0 assurance harness identity
        id: aa0-harness
        run: python3 tools/ci/aa0_harness_identity.py
      - name: Restore AA0 PIP-bound repository assurance
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ovc-aa0-tests
          key: ovc-aa0-tests-v2-pip-${{ needs.vit-routing-preflight.outputs.aa0_identity }}-h-${{ steps.aa0-harness.outputs.harness_hash }}-gen-${{ needs.vit-routing-preflight.outputs.generation_id }}
          restore-keys: |
            ovc-aa0-tests-v2-pip-${{ needs.vit-routing-preflight.outputs.aa0_identity }}-h-${{ steps.aa0-harness.outputs.harness_hash }}-gen-
      - uses: actions/setup-python@v5
        if: needs.pytest-assurance-plan.outputs.disposition == 'RUN_AA0'
        with:
          python-version: "3.11.15"
      - name: Install pytest and Research Console test dependencies
        if: needs.pytest-assurance-plan.outputs.disposition == 'RUN_AA0'
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt
      - name: Download canonical pytest shard evidence
        if: needs.pytest-assurance-plan.outputs.disposition == 'RUN_AA0'
        uses: actions/download-artifact@v4
        with:
          pattern: canonical-pytest-*-${{ env.OVC_ASSURANCE_TARGET_HEAD_SHA }}
          path: ${{ runner.temp }}/ovc-canonical-shards
          merge-multiple: false
      - name: Complete repository suite as BASE_INDEPENDENT assurance
        shell: bash
        env:
          DISPOSITION: ${{ needs.pytest-assurance-plan.outputs.disposition }}
        run: |
          set -euo pipefail
          if [[ "${DISPOSITION}" == "RUN_AA0" ]]; then
            # Historical rollback command (not executed): python3 -m unittest discover -s tests -v
            PYTHONPATH=src:. python3 tools/ci/pytest_shard_canonical.py aggregate \
              --root "${RUNNER_TEMP}/ovc-canonical-shards" \
              --output "${RUNNER_TEMP}/ovc-canonical-shards/aggregate.json"
            PYTHONPATH=src:. python3 -m pytest tests/research_console_vnext -q --tb=short
            mkdir -p "${RUNNER_TEMP}/ovc-aa0-tests"
            printf '%s\n' "${{ needs.vit-routing-preflight.outputs.pip_id }}" > "${RUNNER_TEMP}/ovc-aa0-tests/PASS"
          else
            test -f "${RUNNER_TEMP}/ovc-aa0-tests/PASS"
          fi
      - name: Save AA0 PIP-bound repository assurance
        if: ${{ success() && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ovc-aa0-tests
          key: ovc-aa0-tests-v2-pip-${{ needs.vit-routing-preflight.outputs.aa0_identity }}-h-${{ steps.aa0-harness.outputs.harness_hash }}-gen-${{ needs.vit-routing-preflight.outputs.generation_id }}

  pytest-unittest-parity:
    name: pytest-unittest-parity
    needs: vit-routing-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OVC_ASSURANCE_TARGET_HEAD_SHA }}
          fetch-depth: 1
          show-progress: false
      - name: Compute AA0 assurance harness identity
        id: aa0-harness
        run: python3 tools/ci/aa0_harness_identity.py
      - name: Restore AA0 PIP-bound unittest parity
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ovc-aa0-unittest
          key: ovc-aa0-unittest-v2-pip-${{ needs.vit-routing-preflight.outputs.aa0_identity }}-h-${{ steps.aa0-harness.outputs.harness_hash }}-gen-${{ needs.vit-routing-preflight.outputs.generation_id }}
          restore-keys: |
            ovc-aa0-unittest-v2-pip-${{ needs.vit-routing-preflight.outputs.aa0_identity }}-h-${{ steps.aa0-harness.outputs.harness_hash }}-gen-
      - name: Decide AA0 PIP-bound unittest parity
        id: aa0
        shell: bash
        env:
          EXACT_HIT: ${{ steps.cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          PRODUCER_MODE: ${{ needs.vit-routing-preflight.outputs.aa0_producer_mode }}
          REUSE_AUTHORIZED: ${{ needs.vit-routing-preflight.outputs.aa0_reuse_authorized }}
        run: |
          set -euo pipefail
          disposition=RUN_AA0
          if [[ "${PRODUCER_MODE}" != "true" && "${EXACT_HIT}" == "true" ]]; then disposition=EXACT_GENERATION_REUSE; elif [[ "${PRODUCER_MODE}" != "true" && -n "${MATCHED_KEY}" && "${REUSE_AUTHORIZED}" == "true" ]]; then disposition=PLACEMENT_ONLY_PIP_REUSE; fi
          if [[ "${disposition}" != "RUN_AA0" ]]; then test -f "${RUNNER_TEMP}/ovc-aa0-unittest/PASS"; fi
          echo "disposition=${disposition}" >> "$GITHUB_OUTPUT"
          echo "OVC_CI_METRIC {\"schema\":\"ovc-ci-metric/v1\",\"metric\":\"aa0_pip_assurance_unittest_parity\",\"disposition\":\"${disposition}\"}"
      - uses: actions/setup-python@v5
        if: steps.aa0.outputs.disposition == 'RUN_AA0'
        with:
          python-version: "3.11.15"
      - name: Install pytest and Research Console test dependencies
        if: steps.aa0.outputs.disposition == 'RUN_AA0'
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt
      - name: Execute exact legacy unittest surface under pytest as AA0 PIP-bound BASE_INDEPENDENT assurance
        if: steps.aa0.outputs.disposition == 'RUN_AA0'
        shell: bash
        run: |
          set +e
          PYTHONPATH=src:. python3 tools/ci/pytest_unittest_parity.py run > /tmp/pytest-legacy.log 2>&1
          status=$?
          cat /tmp/pytest-legacy.log
          if [ "$status" -ne 0 ]; then python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/pytest-legacy.log').read_text(encoding='utf-8', errors='replace')
          tail = text[-5000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Pytest legacy-surface failure::{tail}')
          PY
          fi
          if [ "$status" -eq 0 ]; then mkdir -p "${RUNNER_TEMP}/ovc-aa0-unittest"; printf '%s\n' "${{ needs.vit-routing-preflight.outputs.pip_id }}" > "${RUNNER_TEMP}/ovc-aa0-unittest/PASS"; fi
          exit "$status"
      - name: Save AA0 PIP-bound unittest parity
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ovc-aa0-unittest
          key: ovc-aa0-unittest-v2-pip-${{ needs.vit-routing-preflight.outputs.aa0_identity }}-h-${{ steps.aa0-harness.outputs.harness_hash }}-gen-${{ needs.vit-routing-preflight.outputs.generation_id }}

  runner-parity:
    name: runner-parity
    needs: vit-routing-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.OVC_ASSURANCE_TARGET_HEAD_SHA }}
          fetch-depth: 1
          show-progress: false
      - name: Compute AA0 assurance harness identity
        id: aa0-harness
        run: python3 tools/ci/aa0_harness_identity.py
      - name: Restore AA0 PIP-bound runner parity
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ovc-aa0-runner
          key: ovc-aa0-runner-v2-pip-${{ needs.vit-routing-preflight.outputs.aa0_identity }}-h-${{ steps.aa0-harness.outputs.harness_hash }}-gen-${{ needs.vit-routing-preflight.outputs.generation_id }}
          restore-keys: |
            ovc-aa0-runner-v2-pip-${{ needs.vit-routing-preflight.outputs.aa0_identity }}-h-${{ steps.aa0-harness.outputs.harness_hash }}-gen-
      - name: Decide AA0 PIP-bound runner parity
        id: aa0
        shell: bash
        env:
          EXACT_HIT: ${{ steps.cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          PRODUCER_MODE: ${{ needs.vit-routing-preflight.outputs.aa0_producer_mode }}
          REUSE_AUTHORIZED: ${{ needs.vit-routing-preflight.outputs.aa0_reuse_authorized }}
        run: |
          set -euo pipefail
          disposition=RUN_AA0
          if [[ "${PRODUCER_MODE}" != "true" && "${EXACT_HIT}" == "true" ]]; then disposition=EXACT_GENERATION_REUSE; elif [[ "${PRODUCER_MODE}" != "true" && -n "${MATCHED_KEY}" && "${REUSE_AUTHORIZED}" == "true" ]]; then disposition=PLACEMENT_ONLY_PIP_REUSE; fi
          if [[ "${disposition}" != "RUN_AA0" ]]; then test -f "${RUNNER_TEMP}/ovc-aa0-runner/PASS"; fi
          echo "disposition=${disposition}" >> "$GITHUB_OUTPUT"
          echo "OVC_CI_METRIC {\"schema\":\"ovc-ci-metric/v1\",\"metric\":\"aa0_pip_assurance_runner_parity\",\"disposition\":\"${disposition}\"}"
      - uses: actions/setup-python@v5
        if: steps.aa0.outputs.disposition == 'RUN_AA0'
        with:
          python-version: "3.11.15"
      - name: Install pytest and Research Console test dependencies
        if: steps.aa0.outputs.disposition == 'RUN_AA0'
        run: python3 -m pip install -e ".[test]" -r requirements-console-vnext.txt
      - name: Prove pytest collection parity as AA0 PIP-bound BASE_INDEPENDENT assurance
        if: steps.aa0.outputs.disposition == 'RUN_AA0'
        shell: bash
        run: |
          set +e
          PYTHONPATH=src:. python3 tools/ci/pytest_unittest_parity.py collect > /tmp/pytest-parity.log 2>&1
          status=$?
          cat /tmp/pytest-parity.log
          if [ "$status" -ne 0 ]; then python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/pytest-parity.log').read_text(encoding='utf-8', errors='replace')
          tail = text[-5000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Pytest collection-parity failure::{tail}')
          PY
          fi
          if [ "$status" -eq 0 ]; then mkdir -p "${RUNNER_TEMP}/ovc-aa0-runner"; printf '%s\n' "${{ needs.vit-routing-preflight.outputs.pip_id }}" > "${RUNNER_TEMP}/ovc-aa0-runner/PASS"; fi
          exit "$status"
      - name: Save AA0 PIP-bound runner parity
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ovc-aa0-runner
          key: ovc-aa0-runner-v2-pip-${{ needs.vit-routing-preflight.outputs.aa0_identity }}-h-${{ steps.aa0-harness.outputs.harness_hash }}-gen-${{ needs.vit-routing-preflight.outputs.generation_id }}
