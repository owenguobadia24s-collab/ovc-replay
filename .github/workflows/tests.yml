name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovc-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner and project
        run: python3 -m pip install -e ".[test]"
      - name: Legacy unittest suite — retained parity baseline
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Pytest unified suite — candidate primary runner
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python3 -m pytest tests -ra > /tmp/ovc-pytest.log 2>&1
          status=$?
          cat /tmp/ovc-pytest.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/ovc-pytest.log').read_text(encoding='utf-8', errors='replace')
          tail = text[-3500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Pytest unified suite failure::{tail}')
          PY
          fi
          exit "$status"
      - name: Prove unittest collection parity under pytest
        if: always()
        run: PYTHONPATH=src python3 scripts/qa/check_python_test_runner_parity.py
