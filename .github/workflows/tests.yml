name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovc-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: tests
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest test extra
        run: python3 -m pip install -e ".[test]"
      - name: Legacy unittest suite (preserved during parity proof)
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - name: Pytest unified suite candidate
        run: python3 -m pytest -v
      - name: Prove pytest/unittest collection parity
        run: python3 tools/ci/check_pytest_unittest_parity.py
