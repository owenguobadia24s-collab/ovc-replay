name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: ovc-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  final-integration-window-admitted:
    name: OVC final integration window admitted
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for serialized final-integration window acquisition
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const windowCheckName = 'OVC merge readiness';
            const startedAt = Date.now();
            const deadline = startedAt + 23 * 60 * 1000;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
            const latestNamedRun = runs => {
              const matches = runs.filter(run => run.name === windowCheckName).sort((a, b) => b.id - a.id);
              return matches[0];
            };

            while (Date.now() < deadline) {
              const response = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: sha,
                per_page: 100,
                filter: 'latest'
              });
              const windowRun = latestNamedRun(response.data.check_runs);
              if (windowRun?.status === 'in_progress') {
                const mainNow = await github.rest.repos.getBranch({ owner, repo, branch: pr.base.ref });
                const currentMain = mainNow.data.commit.sha;
                if (currentMain !== pr.base.sha) {
                  core.setFailed(`OVC_REQUIRED_CHECK_BASE_MOVED_BEFORE_ASSURANCE: event base ${pr.base.sha}, current ${pr.base.ref} ${currentMain}; expensive required checks will not start.`);
                  return;
                }
                core.info(`OVC_FINAL_INTEGRATION_WINDOW_ADMITTED: ${windowCheckName} is in progress for ${sha} and ${pr.base.ref} remains ${currentMain}; candidate ancestry will be proved before expensive required checks start.`);
                return;
              }
              if (windowRun?.status === 'completed') {
                if (windowRun.conclusion === 'success') {
                  core.info(`OVC_FINAL_INTEGRATION_WINDOW_ADMITTED: ${windowCheckName} already passed for ${sha}.`);
                  return;
                }
                core.setFailed(`OVC_FINAL_INTEGRATION_WINDOW_NOT_ADMITTED: ${windowCheckName} completed ${windowRun.conclusion} for ${sha}; expensive required checks will not start.`);
                return;
              }
              await sleep(5000);
            }

            core.setFailed(`OVC_FINAL_INTEGRATION_WINDOW_ADMISSION_TIMEOUT: ${windowCheckName} did not acquire the serialized lane for ${sha}.`);
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false
      - name: Prove required-check candidate contains admitted current main
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"; then
            echo "::error title=Required-check candidate not reconciled::OVC_REQUIRED_CHECK_CANDIDATE_NOT_RECONCILED_TO_CURRENT_MAIN: ${{ github.event.pull_request.head.sha }} does not contain admitted main ${{ github.event.pull_request.base.sha }}."
            exit 1
          fi
      - name: Non-PR admission
        if: github.event_name != 'pull_request'
        run: echo "Final-integration admission is not required for ${{ github.event_name }}; canonical tests proceed normally."

  legacy-unittest:
    name: tests
    needs: final-integration-window-admitted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Complete repository suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

  pytest-unittest-parity:
    name: pytest-unittest-parity
    needs: final-integration-window-admitted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest test extra
        run: python3 -m pip install -e ".[test]"
      - name: Execute exact legacy unittest surface under pytest
        shell: bash
        run: |
          set +e
          python3 tools/ci/pytest_unittest_parity.py run > /tmp/pytest-legacy.log 2>&1
          status=$?
          cat /tmp/pytest-legacy.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/pytest-legacy.log').read_text(encoding='utf-8', errors='replace')
          tail = text[-5000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Pytest legacy-surface failure::{tail}')
          PY
          fi
          exit "$status"

  runner-parity:
    name: runner-parity
    needs: final-integration-window-admitted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest test extra
        run: python3 -m pip install -e ".[test]"
      - name: Prove pytest collection parity for legacy unittest surface
        shell: bash
        run: |
          set +e
          python3 tools/ci/pytest_unittest_parity.py collect > /tmp/pytest-parity.log 2>&1
          status=$?
          cat /tmp/pytest-parity.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/pytest-parity.log').read_text(encoding='utf-8', errors='replace')
          tail = text[-5000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Pytest collection-parity failure::{tail}')
          PY
          fi
          exit "$status"

  pytest-unified:
    name: pytest-unified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest test extra
        run: python3 -m pip install -e ".[test]"
      - name: Execute complete unified pytest surface
        shell: bash
        run: |
          set +e
          python3 -m pytest -q --continue-on-collection-errors --tb=short --junitxml=pytest-unified-results.xml > /tmp/pytest-unified.log 2>&1
          status=$?
          cat /tmp/pytest-unified.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/pytest-unified.log').read_text(encoding='utf-8', errors='replace')
          tail = text[-12000:]
          chunks = [tail[i:i+3800] for i in range(0, len(tail), 3800)]
          for index, chunk in enumerate(chunks, 1):
              escaped = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Unified pytest failure tail {index}-{len(chunks)}::{escaped}')
          PY
          fi
          exit "$status"
      - name: Upload unified pytest result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-unified-results
          path: pytest-unified-results.xml
          if-no-files-found: warn
