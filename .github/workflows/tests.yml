name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ovc-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy-unittest:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Complete repository suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

  pytest-unified:
    name: pytest-unified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest test extra
        run: python3 -m pip install -e ".[test]"
      - name: Execute intended unified pytest surface
        shell: bash
        run: |
          set +e
          python3 -m pytest tests > /tmp/pytest-unified.log 2>&1
          status=$?
          cat /tmp/pytest-unified.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path

          def esc(value: str) -> str:
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          text = Path('/tmp/pytest-unified.log').read_text(encoding='utf-8', errors='replace')
          summary_lines = [
              line for line in text.splitlines()
              if line.startswith('FAILED ') or line.startswith('ERROR ')
          ]
          for offset in range(0, len(summary_lines), 10):
              chunk = '\n'.join(summary_lines[offset:offset + 10])
              print(
                  f'::error title=Unified pytest failures {offset + 1}-'
                  f'{min(offset + 10, len(summary_lines))}::{esc(chunk)}'
              )
          tail = esc(text[-1800:])
          print(f'::error title=Unified pytest admission failure::{tail}')
          PY
          fi
          exit "$status"

  pytest-unittest-parity:
    name: pytest-unittest-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest test extra
        run: python3 -m pip install -e ".[test]"
      - name: Execute exact legacy unittest surface under pytest
        shell: bash
        run: |
          set +e
          python3 tools/ci/pytest_unittest_parity.py run > /tmp/pytest-legacy.log 2>&1
          status=$?
          cat /tmp/pytest-legacy.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/pytest-legacy.log').read_text(encoding='utf-8', errors='replace')
          tail = text[-5000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Pytest legacy-surface failure::{tail}')
          PY
          fi
          exit "$status"

  runner-parity:
    name: runner-parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest test extra
        run: python3 -m pip install -e ".[test]"
      - name: Prove pytest collection parity for legacy unittest surface
        shell: bash
        run: |
          set +e
          python3 tools/ci/pytest_unittest_parity.py collect > /tmp/pytest-parity.log 2>&1
          status=$?
          cat /tmp/pytest-parity.log
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/pytest-parity.log').read_text(encoding='utf-8', errors='replace')
          tail = text[-5000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Pytest collection-parity failure::{tail}')
          PY
          fi
          exit "$status"
