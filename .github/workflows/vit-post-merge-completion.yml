name: DSAI3V local post-merge completion

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      merge_sha:
        description: Exact already-effective main merge SHA to recover; defaults to the dispatch ref SHA
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: ovc-vit-local-post-merge-completion-v1
  cancel-in-progress: false

jobs:
  complete:
    name: DSAI3V local post-merge completion
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    env:
      OVC_VIT_RECOVERY_MERGE_SHA: ${{ inputs.merge_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Verify existing local external-artifact binding
        shell: pwsh
        run: |
          if (-not $env:OVC_EXTERNAL_ARTIFACT_ROOT) {
            throw "OVC_EXTERNAL_ARTIFACT_ROOT is not configured on the existing self-hosted runner."
          }
          if (-not $env:OVC_VIT_RECOVERY_MERGE_SHA) {
            throw "OVC_VIT_RECOVERY_MERGE_SHA did not resolve."
          }
          python --version

      - name: Persist canonical VIT completion bundle
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src;.
        run: |
          python tools/ci/vit_post_merge_completion_late_binding.py `
            --repo-root . `
            --merge-sha "$env:OVC_VIT_RECOVERY_MERGE_SHA" `
            --recovery-manifest registries/development/skills/VIT_POST_MERGE_RECOVERY_REQUESTS_v0_1.json
