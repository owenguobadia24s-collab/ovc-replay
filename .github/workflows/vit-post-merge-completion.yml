name: DSAI3V local post-merge completion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: ovc-vit-local-post-merge-completion-v1
  cancel-in-progress: false

jobs:
  complete:
    name: DSAI3V local post-merge completion
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          show-progress: false

      - name: Verify existing local external-artifact binding
        shell: pwsh
        run: |
          if (-not $env:OVC_EXTERNAL_ARTIFACT_ROOT) {
            throw "OVC_EXTERNAL_ARTIFACT_ROOT is not configured on the existing self-hosted runner."
          }
          python --version

      - name: Persist canonical VIT completion bundle
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
        run: |
          python tools/ci/vit_post_merge_completion.py --repo-root . --merge-sha "${{ github.sha }}"
