name: DSAI3V local post-merge completion

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      merge_sha:
        description: Exact already-effective main merge SHA to recover; defaults to the dispatch ref SHA
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

# A fixed concurrency group cancels an older pending run when a newer main push
# arrives, even when cancel-in-progress is false. Key by merge SHA instead so
# each physical write retains a completion demand while the existing local
# runner is offline/busy. The bounded first-parent drain below also recovers
# recent completion debt idempotently when the runner resumes.
concurrency:
  group: ovc-vit-local-post-merge-completion-v2-${{ inputs.merge_sha || github.sha }}
  cancel-in-progress: false

jobs:
  complete:
    name: DSAI3V local post-merge completion
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    env:
      OVC_VIT_RECOVERY_MERGE_SHA: ${{ inputs.merge_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Verify existing local external-artifact binding
        shell: pwsh
        run: |
          if (-not $env:OVC_EXTERNAL_ARTIFACT_ROOT) {
            throw "OVC_EXTERNAL_ARTIFACT_ROOT is not configured on the existing self-hosted runner."
          }
          if (-not $env:OVC_VIT_RECOVERY_MERGE_SHA) {
            throw "OVC_VIT_RECOVERY_MERGE_SHA did not resolve."
          }
          python --version

      - name: Persist canonical VIT completion bundle and drain recent completion debt
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src;.
        run: |
          python tools/ci/vit_post_merge_completion_drain.py --repo-root . --head "$env:OVC_VIT_RECOVERY_MERGE_SHA" --limit 16
