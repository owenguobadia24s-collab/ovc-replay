name: Windows Research Console Portability

on:
  push:
    paths:
      - "apps/research_console/**"
      - "src/ovc/research_operations/v0_4/**"
      - "tests/research_operations/v0_4/test_windows_console_portability.py"
      - "docs/releases/research-console-v0-3/windows-portability-remediation/**"
      - "registries/research_operations/v0_4/RC_WINDOWS_PORTABILITY_REMEDIATION_STATE_v0_1.json"
      - ".github/workflows/windows-research-console-portability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-research-console-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portability:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run native Windows portability regression
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD;$PWD\src"
          python -m unittest tests.research_operations.v0_4.test_windows_console_portability -v
