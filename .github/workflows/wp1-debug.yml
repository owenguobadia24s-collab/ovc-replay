name: WP1 Debug

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wp1-debug.yml'

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture test output
        run: |
          set +e
          PYTHONPATH=src python -m unittest discover -s tests -v > docs/releases/opt-a-v2/governance/WP1_DEBUG_TEST_OUTPUT.log 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/releases/opt-a-v2/governance/WP1_DEBUG_TEST_OUTPUT.log
          git commit -m 'WP1 capture CI failure output'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit 0
