name: WP4 Actual GBPUSD Provider Population

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wp4-provider-population.yml'
      - 'src/ovc/opt_a/provider_population.py'
      - 'tools/wp4/**'
      - 'tests/opt_a/test_wp4_provider_population.py'
      - 'docs/releases/opt-a-v2/intake/**'
      - 'registries/implementation/OPT_A_WP4_PROVIDER_POPULATION.yaml'
      - 'registries/authority/ACTIVE_AUTHORITY.yaml'
      - 'docs/CURRENT_STATUS.md'

permissions:
  contents: write
  actions: read

concurrency:
  group: wp4-provider-population-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.11'
  DUKASCOPY_NODE_VERSION: '1.46.4'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run complete repository suite
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

  provider-pilot:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out WP4 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned provider adapter
        run: npm install --no-save --package-lock=false --ignore-scripts dukascopy-node@${DUKASCOPY_NODE_VERSION}
      - name: Record runner preflight
        shell: bash
        run: |
          set -euo pipefail
          export OVC_EXTERNAL_ARTIFACT_ROOT="$RUNNER_TEMP/ovc-external"
          mkdir -p "$OVC_EXTERNAL_ARTIFACT_ROOT"
          test "$OVC_EXTERNAL_ARTIFACT_ROOT" != "$GITHUB_WORKSPACE"
          df -Pk "$RUNNER_TEMP" | tee "$RUNNER_TEMP/WP4_PILOT_CAPACITY.txt"
          PYTHONPATH=src python3 -m ovc_evidence_store init-workspace \
            --workspace-id wp4-pilot-2021-01 \
            --repository-root "$GITHUB_WORKSPACE"
      - name: Download and audit actual January 2021 pilot
        id: pilot
        shell: bash
        run: |
          set -uo pipefail
          export OVC_EXTERNAL_ARTIFACT_ROOT="$RUNNER_TEMP/ovc-external"
          workspace="$OVC_EXTERNAL_ARTIFACT_ROOT/workspace/wp4-pilot-2021-01"
          log="$RUNNER_TEMP/WP4_PILOT_EXECUTION.log"
          status=0
          node tools/wp4/download_month.mjs 2021-01 "$workspace" 2>&1 | tee "$log" || status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            PYTHONPATH=src python3 tools/wp4/audit_month.py \
              --workspace "$workspace" \
              --year-month 2021-01 2>&1 | tee -a "$log" || status=${PIPESTATUS[0]}
          fi
          if [ -d "$workspace" ]; then
            tar -C "$workspace" -czf "$RUNNER_TEMP/wp4-pilot-2021-01.tar.gz" . || true
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload pilot evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp4-provider-pilot-2021-01
          path: |
            ${{ runner.temp }}/wp4-pilot-2021-01.tar.gz
            ${{ runner.temp }}/WP4_PILOT_CAPACITY.txt
            ${{ runner.temp }}/WP4_PILOT_EXECUTION.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - name: Enforce pilot success
        if: steps.pilot.outputs.status != '0'
        run: |
          echo "WP4 provider pilot failed; inspect wp4-provider-pilot-2021-01 artifact"
          exit 1

  provider-population:
    needs: provider-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2021, 2022, 2023, 2024, 2025]
    steps:
      - name: Check out WP4 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned provider adapter
        run: npm install --no-save --package-lock=false --ignore-scripts dukascopy-node@${DUKASCOPY_NODE_VERSION}
      - name: Create safe external workspace and record capacity
        shell: bash
        run: |
          set -euo pipefail
          export OVC_EXTERNAL_ARTIFACT_ROOT="$RUNNER_TEMP/ovc-external"
          mkdir -p "$OVC_EXTERNAL_ARTIFACT_ROOT"
          df -Pk "$RUNNER_TEMP" | tee "$RUNNER_TEMP/WP4_CAPACITY_${{ matrix.year }}.txt"
          PYTHONPATH=src python3 -m ovc_evidence_store init-workspace \
            --workspace-id wp4-${{ matrix.year }} \
            --repository-root "$GITHUB_WORKSPACE"
      - name: Download and audit twelve actual monthly partitions
        shell: bash
        run: |
          set -euo pipefail
          export OVC_EXTERNAL_ARTIFACT_ROOT="$RUNNER_TEMP/ovc-external"
          workspace="$OVC_EXTERNAL_ARTIFACT_ROOT/workspace/wp4-${{ matrix.year }}"
          for month in $(seq -w 1 12); do
            year_month="${{ matrix.year }}-${month}"
            echo "::group::${year_month}"
            node tools/wp4/download_month.mjs "$year_month" "$workspace"
            PYTHONPATH=src python3 tools/wp4/audit_month.py \
              --workspace "$workspace" \
              --year-month "$year_month"
            echo "::endgroup::"
          done
          tar -C "$workspace" -czf "$RUNNER_TEMP/wp4-${{ matrix.year }}.tar.gz" .
          mkdir -p "$RUNNER_TEMP/wp4-summaries-${{ matrix.year }}"
          cp "$workspace"/summaries/*.json "$RUNNER_TEMP/wp4-summaries-${{ matrix.year }}/"
      - name: Upload actual yearly provider population
        uses: actions/upload-artifact@v4
        with:
          name: wp4-provider-population-${{ matrix.year }}
          path: |
            ${{ runner.temp }}/wp4-${{ matrix.year }}.tar.gz
            ${{ runner.temp }}/WP4_CAPACITY_${{ matrix.year }}.txt
          retention-days: 30
          compression-level: 0
      - name: Upload compact yearly summaries
        uses: actions/upload-artifact@v4
        with:
          name: wp4-provider-summaries-${{ matrix.year }}
          path: ${{ runner.temp }}/wp4-summaries-${{ matrix.year }}/*.json
          retention-days: 90
          compression-level: 6

  aggregate-and-record:
    needs: provider-population
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out WP4 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download all compact monthly summaries
        uses: actions/download-artifact@v4
        with:
          pattern: wp4-provider-summaries-*
          path: ${{ runner.temp }}/wp4-monthly-summaries
          merge-multiple: true
      - name: Aggregate exact 60-month population
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/releases/opt-a-v2/intake
          PYTHONPATH=src python3 tools/wp4/aggregate_population.py \
            --summaries-root "$RUNNER_TEMP/wp4-monthly-summaries" \
            --output docs/releases/opt-a-v2/intake/WP4_POPULATION_INTAKE_SUMMARY.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target = Path('docs/releases/opt-a-v2/intake/WP4_EXECUTION_RECEIPT.json')
          target.write_text(json.dumps({
              'schema': 'ovc-opt-a-wp4-execution-receipt/v1',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_branch': os.environ['GITHUB_HEAD_REF'],
              'source_commit': os.environ['GITHUB_SHA'],
              'provider': 'DUKASCOPY',
              'instrument_id': 'GBPUSD',
              'month_count': 60,
              'source_object_count': 240,
              'raw_artifact_retention_days': 30,
              'summary_artifact_retention_days': 90,
              'r2_mutation': 'NONE',
              'selector_activation': 'NONE',
              'validation_consumption': 'LOCKED_UNCONSUMED',
              'market_authority': 'NONE',
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Upload aggregate execution record
        uses: actions/upload-artifact@v4
        with:
          name: wp4-provider-population-summary
          path: |
            docs/releases/opt-a-v2/intake/WP4_POPULATION_INTAKE_SUMMARY.json
            docs/releases/opt-a-v2/intake/WP4_EXECUTION_RECEIPT.json
          retention-days: 90
      - name: Commit compact execution records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/releases/opt-a-v2/intake/WP4_POPULATION_INTAKE_SUMMARY.json
          git add docs/releases/opt-a-v2/intake/WP4_EXECUTION_RECEIPT.json
          git diff --cached --check
          git commit -m 'WP4 record actual GBPUSD provider population intake'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
