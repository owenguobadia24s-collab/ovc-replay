      - BRANCH_AND_PATH_ENFORCING_WRITER_ADAPTER
      - NO_MERGE_API_AVAILABLE_TO_BOT
      - DENIED_ACTION_TESTS_PASS
      - TOKEN_REDACTION_TESTS_PASS
      - IDEMPOTENCY_AND_COLLISION_TESTS_PASS
      - REVOCATION_TESTS_PASS
      - MAIN_BRANCH_PROTECTION_NO_BOT_BYPASS_VERIFIED
      - REAL_PROPOSAL_BRANCH_SHADOW_PASS
      - FINAL_HEAD_COMPLETE_REPOSITORY_ASSURANCE_PASS
      - QA_PASS
    blockers:
      - MAIN_BRANCH_PROTECTION_NO_BOT_BYPASS_EVIDENCE_UNAVAILABLE
      - DEDICATED_REVOCABLE_IDENTITY_NOT_PROVISIONED
      - REAL_PROPOSAL_BRANCH_SHADOW_NOT_RUN
    gate: DA-G4B
    rollback: Keep the profile inactive, provision no credential, close any unmerged shadow PR if later created and revert the bounded implementation through a new non-destructive commit.
