  - route_id: RESEARCH_DESK
    discovery_hub_use: selected context, source state, research brief, uncertainty, friction and change conditions
    authority: READ_ONLY_WHEN_MATERIALIZED
  - route_id: REPLAY
    discovery_hub_use: prospective cutoff-safe replay and explicitly separated review path
    authority: READ_ONLY_CUTOFF_SAFE
  - route_id: EVIDENCE
    discovery_hub_use: observations, claims, realizations, cases, contradictions, nulls, anomalies, censoring and neutral recurrence candidates
    authority: READ_ONLY
  - route_id: SESSIONS
    discovery_hub_use: governed ResearchSession lifecycle and linked immutable records
    authority: READ_ONLY_UI_EXISTING_APPEND_ONLY_SERVICE_OUTSIDE_UI
  - route_id: QUEUE
    discovery_hub_use: due realizations, unresolved incidents, censored paths, stale catalogues, missing artifacts and unreviewed contradictions
    authority: READ_ONLY_DERIVED
  - route_id: HEALTH
    discovery_hub_use: data, read-model, artifact, QA, research-record, repository and semantic health domains
    authority: READ_ONLY
  - route_id: LINEAGE
    discovery_hub_use: record, release, model, gate and artifact parent-child lineage
    authority: READ_ONLY
  - route_id: CATALOGUE
    discovery_hub_use: local, GitHub Actions and R2 artifact identity, availability, checksum and expiry
    authority: READ_ONLY
  - route_id: RELEASES
    discovery_hub_use: Discovery, Development and Validation lifecycle, authority, QA, availability and compatibility
    authority: READ_ONLY
  - route_id: QA_GATES
    discovery_hub_use: DO checks, gate packets, blockers, operator decisions and architecture-promotion evidence
    authority: READ_ONLY
  - route_id: AUDIT
    discovery_hub_use: immutable research, build, gate, incident and catalogue activity
    authority: READ_ONLY
  - route_id: CONFIG
    discovery_hub_use: local resolved paths and represented environment without mutation
    authority: READ_ONLY_LOCAL
  - route_id: ABOUT
    discovery_hub_use: programme contract, implementation registry, authority boundary and operator guidance
    authority: READ_ONLY_STATIC
