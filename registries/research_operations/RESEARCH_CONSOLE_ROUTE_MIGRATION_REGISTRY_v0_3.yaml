    v0_3_workspace: SYSTEM
    destination: SYSTEM_DETAIL.QA_GATES
    disposition: DETAIL_SECTION
  - v0_2_route_id: AUDIT
    v0_3_workspace: SYSTEM
    destination: SYSTEM_DETAIL.AUDIT
    global_projection: ACTIVITY_STREAM
    disposition: DETAIL_SECTION_PLUS_GLOBAL_PROJECTION
