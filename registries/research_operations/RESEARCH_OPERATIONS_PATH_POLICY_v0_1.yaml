  local_derived:
    path: var/research_operations
    git_state: IGNORED
    authority: DERIVED_REBUILDABLE_ONLY
approved_repository_write_roots:
  - contracts/research_operations/**
  - schemas/research_operations/**
  - registries/research_operations/**
  - fixtures/research_operations/**
  - tests/research_operations/**
  - docs/research-operations/**
  - docs/releases/research-operations-foundation/**
  - records/research_operations/**
  - src/ovc/research_operations/**
  - apps/research_console/**
  - scripts/**
path_controls:
  traversal: DENIED
  symlink_escape: DENIED
  absolute_path_commit: DENIED
  unsafe_existing_target_overwrite: DENIED
  frozen_record_delete_or_replace: DENIED
  direct_primary_branch_mutation: DENIED
validation_boundary:
  release_id: OPT-A.GBPUSD.VALIDATION.2025.v2
  metadata_visibility: ALLOWED
  payload_resolution: DENIED_LOCKED_UNCONSUMED
  search_case_or_realization_access: DENIED
