stores:
  git:
    purpose:
      - contracts
      - schemas
      - registries
      - compact_records
      - fixtures
      - tests
      - manifests
      - decisions
      - gate_packets
    prohibited:
      - raw_ohlcv
      - full_model_streams
      - sqlite_databases
      - caches
      - recordings
      - screenshots
      - secrets
      - absolute_operator_paths
  external_root:
    environment_variable: OVC_EXTERNAL_ARTIFACT_ROOT
    purpose:
      - raw_market_payloads
      - full_state_and_outcome_streams
      - large_case_extracts
      - recordings_and_media
      - checksum_addressed_evidence
