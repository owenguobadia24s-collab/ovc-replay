
schema: ovc-ro4-friction-reason-registry/v1
registry_id: RO4.C2E.FRICTION.REASONS.v0.1
status: PROPOSED_AT_RO4_G0
reasons:
  BOUNDARY_AMBIGUITY: Operators cannot reproduce a stable start or end from per-bar C2 records.
  SPLIT_MERGE_FRICTION: One observed development appears to split or merge under fixed per-bar representation.
  CROSS_SCALE_CONTEXT_FRICTION: Review depends on explicit multi-clock context not represented by one C2 record.
  LONG_PERSISTENCE_FRICTION: Research concerns a variable-duration persistence span rather than one state.
  RAPID_ALTERNATION_FRICTION: High-frequency state alternation obscures a stable developing structure.
  TRANSITION_CHAIN_FRICTION: Review requires a chain of transitions rather than one transition.
  MISSINGNESS_FRICTION: Gaps or unavailable parents prevent lawful continuity.
  PRESENTATION_ONLY_FRICTION: A better RO4 view may solve the issue without a new market layer.
semantic_promotion: PROHIBITED
automatic_c2e_opening: PROHIBITED
